name: NgelX v18 Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: V18 APK artifactini indir
        uses: actions/download-artifact@v4
        with:
          name: NgelX-v18-FINAL-BEYAZ-EKRANLAR
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34898944077

      - name: APK dosyasini hazirla
        run: |
          set -e
          APK_FILE="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          cp "$APK_FILE" NgelX-v18.apk
          ls -lh NgelX-v18.apk

      - name: NgelX v18 Release olustur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v18 NgelX-v18.apk \
            --repo "${{ github.repository }}" \
            --target main \
            --title "NgelX v18" \
            --notes "NgelX Android test sürümü v18." \
            --prerelease
