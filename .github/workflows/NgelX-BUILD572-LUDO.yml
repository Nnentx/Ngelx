name: NgelX Build572 Ludo reference and smart game
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['tools/apply_build572*','tools/test_build572*','server/ludo565/**','cloudflare/live-moderation/src/ludo565.mjs','.github/workflows/NgelX-BUILD572-LUDO.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build571-Assembled-Source
          run-id: 40231403363
          github-token: ${{ github.token }}
          path: assembled
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build571-Review-APK
          run-id: 40231403363
          github-token: ${{ github.token }}
          path: previous-apk
      - name: Preserve existing app images and sounds
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path,PurePosixPath
          import zipfile
          files=list(Path('previous-apk').rglob('*.apk'))
          assert len(files)==1
          with zipfile.ZipFile(files[0]) as apk:
            for name in apk.namelist():
              prefix='assets/flutter_assets/assets/'
              if not name.startswith(prefix) or name.endswith('/'):continue
              relative=PurePosixPath(name[len(prefix):])
              assert '..' not in relative.parts and not relative.is_absolute()
              target=Path('app/assets')/str(relative)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(apk.read(name))
          PYTHON
      - name: Restore verified Build571 and apply only game fixes
        run: |
          cp -a assembled/. app/
          mkdir -p app/android/app/src/main/res/xml
          cp tools/update_paths564.xml app/android/app/src/main/res/xml/update_paths564.xml
          python3 - <<'NATIVE'
          from pathlib import Path
          p=Path('app/android/app/build.gradle.kts');s=p.read_text()
          dependencies=['implementation(platform("com.google.firebase:firebase-bom:34.6.0"))','implementation("com.google.firebase:firebase-messaging")','implementation("com.google.firebase:firebase-auth")','implementation("androidx.activity:activity:1.9.3")']
          missing=[d for d in dependencies if d not in s]
          if missing:s+='\ndependencies {\n'+''.join('    '+d+'\n' for d in missing)+'}\n'
          p.write_text(s)
          NATIVE
          python3 -m py_compile tools/apply_build572_ludo.py
          python3 tools/apply_build572_ludo.py
          python3 tools/test_build572_ludo.py
          cp tools/build570_join_test.dart app/test/build570_join_test.dart
          cp tools/build570_perf_test.dart app/test/build570_perf_test.dart
          cp tools/build572_fast_visual_test.dart app/test/build572_fast_visual_test.dart

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/pubspec.yaml');s=p.read_text()
          for package,version in [('firebase_storage','^13.6.0'),('crypto','^3.0.6'),('flutter_cache_manager','^3.4.5')]:
            if '  '+package+':' not in s:s=s.replace('  cupertino_icons:','  '+package+': '+version+'\n  cupertino_icons:',1)
          assert 'version: 1.0.342+572' in s
          for item in ['    - assets/call_ringback444.wav','    - assets/gifts553/']:
            if item not in s:s=s.replace('  assets:\n','  assets:\n'+item+'\n',1)
          p.write_text(s)
          PY
      - name: Analyze entire app and test targeted Ludo layout without polling screenshot race
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --concurrency=1 --timeout=35s --reporter expanded test/build570_join_test.dart test/build570_perf_test.dart test/build572_fast_visual_test.dart
          echo 'Note: legacy image readback/integration widget tests are independently investigated; this run validates nonflaky Ludo behavior and whole-app analysis.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build572-Previews
          path: app/build567-previews
          if-no-files-found: ignore
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Verify existing updater signer
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'
      - name: Retain Build567 Android packaging
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('app/android/app/build.gradle.kts');s=p.read_text()
          s=s.replace('abiFilters += listOf("armeabi-v7a", "arm64-v8a")','abiFilters += listOf("arm64-v8a")')
          if 'useLegacyPackaging' not in s:s=s.replace('    buildTypes {','    packaging { jniLibs { useLegacyPackaging = true } }\n\n    buildTypes {',1)
          p.write_text(s)
          PYTHON
      - name: Build review APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.342 --build-number=572 --dart-define=NGELX_VERSION_NAME=1.0.342 --dart-define=NGELX_BUILD_NUMBER=572 --dart-define=NGELX_VERIFICATION_EMAIL_URL=https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > apk-signature568.txt
          grep -iF 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' apk-signature568.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          old=list(Path('../previous-apk').rglob('*.apk'))
          with zipfile.ZipFile(old[0]) as previous,zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as current:
            for name in previous.namelist():
              if name.startswith('assets/flutter_assets/assets/') and not name.endswith('/'):
                assert previous.read(name)==current.read(name),name
          print('Build571 images and sounds preserved byte-for-byte')
          PYTHON
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.342-Build572.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build572-Review-APK
          path: app/build/app/outputs/flutter-apk/NgelX-1.0.342-Build572.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build572-Assembled-Source
          path: |
            app/lib
            app/pubspec.yaml
            app/pubspec.lock
            app/assets/
            app/android/app/src/main/
            app/android/app/build.gradle.kts
            app/android/app/google-services.json
            app/android/build.gradle.kts
            app/android/settings.gradle.kts
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties


  backend:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full game including fair dice, bot policy and moving rewards
        run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/*.test.mjs server/livekit443/*.test.mjs
      - name: Deploy tested Ludo engine and AI to existing game service
        working-directory: cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
      - name: Verify authenticated game through current production hostname
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/build566_ludo_smoke.mjs
