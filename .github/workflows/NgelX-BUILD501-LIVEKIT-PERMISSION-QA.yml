name: NgelX Build501 LiveKit Permission Preservation QA (no deploy)

on:
  push:
    branches:
      - qa/ngelx-build499-livekit-server-guest-moderation-20261018
      - qa/ngelx-build501-livekit-permission-preservation-20261018
    paths:
      - 'server/**'
      - '.github/workflows/NgelX-BUILD501-LIVEKIT-PERMISSION-QA.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngelx-build499-server-moderation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all new server modules
        run: |
          node --check server/livekit443/live-moderation.mjs
          node --check server/livekit443/live-moderation-adapters.mjs
          node --check server/livekit443/index.mjs
          node --check server/livekit443/live-moderation.test.mjs
          node --check server/livekit443/live-moderation-adapters.test.mjs
      - name: Pure policy, Firestore transaction and authenticated room admin tests
        run: npm --prefix server test
      - name: Install server SDK without running scripts or deploying
        run: npm --prefix server install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify LiveKit SDK protocol constants and constructor
        working-directory: server
        run: |
          node --input-type=module -e "import {RoomServiceClient,TrackSource,TrackType} from 'livekit-server-sdk'; if(typeof RoomServiceClient!=='function'||TrackSource.CAMERA!==1||TrackSource.MICROPHONE!==2||TrackType.AUDIO!==0)process.exit(1); console.log('LiveKit SDK room admin protocol constants PASS');"
      - name: Confirm zero production side effects
        run: echo 'Pure QA only; no Firebase deploy, no LiveKit moderation request, no APK, no website update.'
