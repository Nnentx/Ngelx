name: NgelX DIAG463 Production Firestore Rules Read Only

on:
  push:
    branches:
      - work/diag463-production-rule-version
    paths:
      - '.github/workflows/NgelX-DIAG463-PRODUCTION-RULES.yml'
      - 'tools/diagnose_build463_production_rules.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Firebase API client
        run: python3 -m pip install --disable-pip-version-check google-auth requests
      - name: Check live rules markers without reading app users
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/diagnose_build463_production_rules.py
      - name: Confirm read-only
        if: always()
        run: echo 'No data reads, writes, rule deployments or functions deployments attempted.'
