name: NgelX Build457 Integrated QA (no deployment)

on:
  pull_request:
    branches:
      - fix/community-ui-invite-member-menu-20261015
    paths:
      - 'app/lib/**'
      - 'firestore.rules'
      - 'tools/**'
      - '.github/workflows/ngelx-build457-integrated-qa.yml'

permissions:
  contents: read

jobs:
  integrated-qa:
    name: Flutter, inbox, community and hardened rules together
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify security regression fixtures before source generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          legacy = Path('tools/build450_rules_test.mjs').read_text()
          cover = Path('tools/build457_cover_rules_test.mjs').read_text()
          rules = Path('firestore.rules').read_text()
          assert "inviteCode:'wrong'" in legacy
          assert "community450InviteValid(cid, request.resource.data.get('inviteCode', ''))" in rules
          assert "await assertSucceeds(updateDoc(doc(db('owner'),community),{admins:['owner','admin']}))" in cover
          assert "await assertFails(updateDoc(doc(db('admin'),community),{admins:['admin']}))" in cover
          print('Current security regression fixtures and rules are present.')
          PY

      - name: Unit test fail-closed postbuild source transformations
        run: |
          python3 -m unittest discover -s tools -p 'test_build457_community_runtime_fixes.py'
          python3 -m unittest discover -s tools -p 'test_build457_avatar_http.py'
          python3 -m unittest discover -s tools -p 'test_merge_build457_community_rules.py'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Build457 sources, preserving the candidate secure rules
        env:
          NGELX_QA_BASELINE_COMMUNITY: '1'
          NGELX_QA_RESTORE_HARDENED_RULES: '1'
        run: python3 tools/prepare_build457_flutter_qa.py

      - name: Integrate founder, comment counter and avatar optimizations
        run: |
          python3 tools/apply_build457_community_runtime_fixes.py
          python3 tools/apply_build457_avatar_http.py
          python3 tools/verify_inbox_avatar_loading.py
          python3 tools/verify_community_invite_ui.py
          python3 - <<'PY'
          from pathlib import Path
          rules=Path('firestore.rules').read_text()
          community=Path('app/lib/community450.dart').read_text()
          counts=Path('app/lib/build455_widgets.dart').read_text()
          assert "match /chats/{chatId} {" in rules
          assert "match /users/{uid} {" in rules
          assert rules.count('match /communities450/{cid} {')==1
          assert rules.count('match /communityInvites450/{code} {')==1
          assert "v['founderId'] == _communityUid450" in community
          assert "s.data?[item.$1] ?? widget.liveCounts[item.$1]" in counts
          assert 'match /reactions/{reactionUid}' in rules
          assert 'match /comments/{commentId}' in rules
          print('All fixes are present together with one hardened rule namespace.')
          PY

      - name: Run all Python regression unit tests on generated QA sources
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Analyze integrated Flutter code
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test community layout and inbox behavior
        working-directory: app
        run: flutter test --timeout 60s test/build450_responsive_test.dart test/build430_presence_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firestore emulator dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Validate generated candidate rules for permissions and privacy
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx-community450 --only firestore --non-interactive "node tools/firestore_rules_communities_test.mjs"
      - name: Audit older NgelX Firestore and community clients
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "bash tools/run_legacy_community_rules_qa.sh"
      # Recover the exact existing Build456/Build457 install-compatible QA key.
      # Never generate a new key: a new signer causes INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      # This only reads GitHub's encrypted runner cache; no production Firebase calls.
      - name: Restore existing install-compatible signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Verify restored install-compatible signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'
      # Optimize for physical ARM64 Android phones. "release" here is only
      # Flutter's AOT compilation mode: the APK is QA/debug-key signed and is
      # never deployed or signed with production release credentials.
      - name: Build smaller ARM64-only QA test APK after all tests pass
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android/key.properties
          # Restrict native libraries on this disposable QA runner only.
          # Existing app/Gradle settings on other branches remain untouched.
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          before = gradle.read_text()
          old = 'abiFilters += listOf("armeabi-v7a", "arm64-v8a")'
          assert before.count(old) == 1, 'Expected Build457 native ABI configuration changed'
          gradle.write_text(before.replace(old, '// QA: Flutter ABI splits select only ARM64'))
          PY
          # Flutter normally prefixes split-APK version codes with ABI offsets.
          # Preserve EXACT versionCode=457 so future NgelX builds can update
          # this install normally (e.g. Build458) without forced uninstalls.
          echo >> android/gradle.properties
          echo 'force-version-code-ignoring-abi=true' >> android/gradle.properties
          flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub --build-name=1.0.232 --build-number=457 --dart-define=NGELX_VERSION_NAME=1.0.232 --dart-define=NGELX_BUILD_NUMBER=457 --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev

      - name: Verify ARM64 APK contents, size and Android signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          unzip -tqq "$apk"
          python3 - "$apk" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(sys.argv[1])
          with ZipFile(apk) as z:
              paths = set(z.namelist())
              abis = {name.split('/')[1] for name in paths if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {'arm64-v8a'}, f'Unexpected native architectures: {abis}'
              assert 'lib/arm64-v8a/libflutter.so' in paths
              assert 'lib/arm64-v8a/libapp.so' in paths
              assert 'assets/flutter_assets/kernel_blob.bin' not in paths, 'Debug kernel must not ship in optimized APK'
          assert apk.stat().st_size < 160 * 1024 * 1024, f'APK unexpectedly large: {apk.stat().st_size}'
          print(f'Validated ARM64-only QA APK: {apk.stat().st_size / 1024 / 1024:.1f} MiB')
          PY
          signer="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' apk-signature.txt
          aapt="$(dirname "$signer")/aapt"
          "$aapt" dump badging "$apk" | tee apk-manifest.txt
          grep -q "package: name='com.nnentx.ngelx_app'" apk-manifest.txt
          grep -q "versionCode='457'" apk-manifest.txt
          grep -q "versionName='1.0.232'" apk-manifest.txt
          sha256sum "$apk"

      - name: Attach optimized ARM64 QA test APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ngelx-build457-install-compatible-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

      # Produce a second standalone option for legacy 32-bit and modern 64-bit phones.
      # Uses the same restored Build456 signing key and the same versionCode.
      - name: Build universal ARM32 and ARM64 test APK
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android/key.properties
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --build-name=1.0.232 --build-number=457 --dart-define=NGELX_VERSION_NAME=1.0.232 --dart-define=NGELX_BUILD_NUMBER=457 --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev

      - name: Verify universal APK architecture, manifest, certificate and integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -tqq "$apk"
          python3 - "$apk" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(sys.argv[1])
          with ZipFile(apk) as z:
              paths = set(z.namelist())
              abis = {name.split('/')[1] for name in paths if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {'armeabi-v7a', 'arm64-v8a'}, f'Unexpected architectures: {abis}'
              for abi in abis:
                  assert f'lib/{abi}/libflutter.so' in paths, f'Missing Flutter engine: {abi}'
                  assert f'lib/{abi}/libapp.so' in paths, f'Missing compiled app: {abi}'
              assert 'assets/flutter_assets/kernel_blob.bin' not in paths
          assert apk.stat().st_size < 250 * 1024 * 1024
          print(f'Universal APK contains ARM32 + ARM64: {apk.stat().st_size / 1024 / 1024:.1f} MiB')
          PY
          signer="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs "$apk" | tee universal-signature.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' universal-signature.txt
          aapt="$(dirname "$signer")/aapt"
          "$aapt" dump badging "$apk" > universal-manifest.txt
          grep -q "package: name='com.nnentx.ngelx_app'" universal-manifest.txt
          grep -q "versionCode='457'" universal-manifest.txt
          grep -q "versionName='1.0.232'" universal-manifest.txt
          sha256sum "$apk"

      - name: Attach universal ARM32 and ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: ngelx-build457-install-compatible-universal-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
