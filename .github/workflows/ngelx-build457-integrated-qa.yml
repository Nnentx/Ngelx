name: NgelX Build457 Integrated QA (no deployment)

on:
  pull_request:
    branches:
      - fix/community-ui-invite-member-menu-20261015
    paths:
      - 'app/lib/**'
      - 'firestore.rules'
      - 'tools/**'
      - '.github/workflows/ngelx-build457-integrated-qa.yml'

permissions:
  contents: read

jobs:
  integrated-qa:
    name: Flutter, inbox, community and hardened rules together
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Unit test fail-closed postbuild source transformations
        run: |
          python3 -m unittest discover -s tools -p 'test_build457_community_runtime_fixes.py'
          python3 -m unittest discover -s tools -p 'test_build457_avatar_http.py'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Build457 sources, preserving the candidate secure rules
        env:
          NGELX_QA_BASELINE_COMMUNITY: '1'
          NGELX_QA_RESTORE_HARDENED_RULES: '1'
        run: python3 tools/prepare_build457_flutter_qa.py

      - name: Integrate founder, comment counter and avatar optimizations
        run: |
          python3 tools/apply_build457_community_runtime_fixes.py
          python3 tools/apply_build457_avatar_http.py
          python3 tools/verify_inbox_avatar_loading.py
          python3 tools/verify_community_invite_ui.py
          python3 - <<'PY'
          from pathlib import Path
          rules=Path('firestore.rules').read_text()
          community=Path('app/lib/community450.dart').read_text()
          counts=Path('app/lib/build455_widgets.dart').read_text()
          assert rules.count('match /communities450/{cid} {')==1
          assert rules.count('match /communityInvites450/{code} {')==1
          assert "v['founderId'] == _communityUid450" in community
          assert "s.data?[item.$1] ?? widget.liveCounts[item.$1]" in counts
          assert 'match /reactions/{reactionUid}' in rules
          assert 'match /comments/{commentId}' in rules
          print('All fixes are present together with one hardened rule namespace.')
          PY

      - name: Analyze integrated Flutter code
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test community layout and inbox behavior
        working-directory: app
        run: flutter test --timeout 60s test/build450_responsive_test.dart test/build430_presence_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only Firestore emulator dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Validate generated candidate rules for permissions and privacy
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx-community450 --only firestore --non-interactive "node tools/firestore_rules_communities_test.mjs"
      - name: Audit older NgelX Firestore and community clients
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "bash tools/run_legacy_community_rules_qa.sh"
