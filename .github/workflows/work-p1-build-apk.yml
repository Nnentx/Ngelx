name: Work P1 Build APK

on:
  push:
    branches:
      - work/final-consolidated-p1
    paths:
      - 'app/**'
      - '.github/workflows/work-p1-build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-p1-build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX test imzasini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Bagimliliklari kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Paket 1 APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          BUILD_NAME="${APP_VERSION%%+*}"
          BUILD_NUMBER="${APP_VERSION##*+}"
          flutter build apk --release             --build-name="$BUILD_NAME"             --build-number="$BUILD_NUMBER"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk             build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-${BUILD_NUMBER}.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-${BUILD_NUMBER}.apk             > build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-${BUILD_NUMBER}.apk.sha256

      - name: APK imzasini dogrula
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-347.apk

      - name: APK artefaktini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-Paket1-Test-Build-347
          path: |
            app/build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-347.apk
            app/build/app/outputs/flutter-apk/NgelX-Paket1-Test-Build-347.apk.sha256
          if-no-files-found: error
          retention-days: 14
