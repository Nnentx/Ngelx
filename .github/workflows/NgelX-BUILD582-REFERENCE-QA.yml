name: NgelX Build582 reference screen review
on:
  push:
    branches: [feat/build582-ludo-reference]
    paths:
      - 'tools/build582_*.dart'
      - 'tools/assets/ludo582/**'
      - 'tools/apply_build582_reference.py'
      - '.github/workflows/NgelX-BUILD582-REFERENCE-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-build582-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs
  android-review:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build581-Assembled-Source
          run-id: 40468098023
          github-token: ${{ github.token }}
          path: assembled
      - name: Apply Build582 to exact Build581 source and verify idempotence
        run: |
          cp -a assembled/. app/
          python3 tools/apply_build582_reference.py
          python3 tools/apply_build582_reference.py
          mkdir -p app/test
          cp tools/build570_join_test.dart tools/build570_perf_test.dart tools/build572_fast_visual_test.dart tools/build575_widget_test.dart tools/build577_widget_test.dart tools/build579_invite_test.dart tools/build580_feedback_test.dart tools/build581_design_test.dart tools/build582_reference_test.dart app/test/
      - run: flutter pub get
        working-directory: app
      - name: Analyze complete app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Run old and new game, chat, widget tests
        run: timeout --signal=TERM --kill-after=10s 300s flutter test --concurrency=1 --timeout=35s --reporter expanded test/build570_join_test.dart test/build570_perf_test.dart test/build572_fast_visual_test.dart test/build575_widget_test.dart test/build577_widget_test.dart test/build579_invite_test.dart test/build580_feedback_test.dart test/build581_design_test.dart
        working-directory: app
      - name: Verify reference interactions and capture phone screenshots
        run: flutter test --update-goldens --concurrency=1 test/build582_reference_test.dart
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build582-Phone-Screenshots
          path: app/test/screenshots/*.png
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Build signed review APK (do not publish)
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.352 --build-number=582 --dart-define=NGELX_VERSION_NAME=1.0.352 --dart-define=NGELX_BUILD_NUMBER=582 --dart-define=NGELX_VERIFICATION_EMAIL_URL=https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > signature.txt
          grep -iF 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' signature.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.352-Build582-REVIEW.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.352-Build582-REVIEW.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NgelX-Build582-Review-APK
          path: app/build/app/outputs/flutter-apk/NgelX-1.0.352-Build582-REVIEW.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build582-Assembled-Source
          path: |
            app/lib
            app/pubspec.yaml
            app/pubspec.lock
            app/assets/
            app/android/
