name: NgelX Build531 Group Exit Rules Emulator QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build531-group-exit-rule-guard-20261019
  pull_request:
    branches:
      - qa/ngelx-build530-group-exit-rejoin-guard-20261019
    paths:
      - 'firestore.rules'
      - 'tools/build531_group_exit_rules_test.mjs'
      - '.github/workflows/NgelX-BUILD531-GROUP-EXIT-RULES-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-exit-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check QA test syntax and Build530 helper contract
        run: |
          set -euo pipefail
          node --check tools/build531_group_exit_rules_test.mjs
          python3 tools/test_build530_group_exit_guard.py
          node --test server/livekit443/room-policy.test.mjs
      - name: Install only local Firestore emulator testing dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Validate Build531 group-exit rules, and prior group regressions
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build531_group_exit_rules_test.mjs && node tools/build517_group_leave_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs"
      - name: Confirm local-only, no production deployment
        run: echo 'Build531 only tested local emulator rules; main, Build484, production Firestore and LiveKit untouched.'
