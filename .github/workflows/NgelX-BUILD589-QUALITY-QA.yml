name: NgelX Build589 final PK score gift audio and phone layouts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-build589-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test server/livekit443/*.test.mjs server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs
      - name: Install isolated rule-test dependencies
        run: npm install --no-save --package-lock=false firebase@11 @firebase/rules-unit-testing@4 firebase-tools@13.35.1
      - name: Verify permission boundaries with Firestore emulator
        run: npx firebase emulators:exec --project demo-ngelx --only firestore 'node tools/build588_rules_test.mjs'
  historical-score-preflight:
    needs: backend-and-rules
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual Firestore historical score aggregates using private fixtures
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node tools/build589_snapshot_probe.mjs
  android-review:
    needs: [backend-and-rules, historical-score-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact published assembled Build588
        run: |
          curl --fail --location --retry 3 --max-time 120 https://github.com/Nnentx/Ngelx/releases/download/v1.0.358-build588/NgelX-Build588-Source.zip -o base588.zip
          echo '2b1a2d6bed9173ffe4595c810dbe1eb71cc18c2529e4ddd119067c604203e800  base588.zip' | sha256sum --check
          unzip -q -o base588.zip -d app
          python3 tools/apply_build589.py
          python3 tools/apply_build589.py
          mkdir -p app/test
          cp tools/build589_quality_test.dart tools/build588_widgets_test.dart tools/build587_feedback_test.dart tools/build586_roll_test.dart tools/build583_feedback_test.dart app/test/
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - timeout-minutes: 8
        run: flutter test --concurrency=1 --timeout=45s test/build589_quality_test.dart test/build588_widgets_test.dart test/build587_feedback_test.dart test/build586_roll_test.dart
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build589-Phone-Screenshots
          path: app/test/screenshots/build589*.png
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Build signed review APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.359 --build-number=589 --dart-define=NGELX_VERSION_NAME=1.0.359 --dart-define=NGELX_BUILD_NUMBER=589 --dart-define=NGELX_VERIFICATION_EMAIL_URL=https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > signature.txt
          grep -iF 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' signature.txt
          cp build/app/outputs/flutter-apk/app-release.apk NgelX-1.0.359-Build589-REVIEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build589-Review-APK
          path: app/NgelX-1.0.359-Build589-REVIEW.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build589-Assembled-Source
          path: |
            app/lib
            app/assets
            app/pubspec.yaml
            app/pubspec.lock
            app/android
