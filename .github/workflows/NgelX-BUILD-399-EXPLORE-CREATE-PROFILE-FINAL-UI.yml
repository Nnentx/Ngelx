name: NgelX BUILD 399 EXPLORE CREATE PROFILE FINAL UI

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-399-explore-create-profile-final-ui
    paths:
      - 'app/**'
      - 'tools/apply_build395_final_login_inbox_ui.py'
      - 'tools/apply_build396_inbox_final_polish.py'
      - 'tools/apply_build397_inbox_complete_fixes.py'
      - 'tools/apply_build398_login_story_polish.py'
      - 'tools/apply_build399_registration_profile_cover.py'
      - 'tools/apply_build399_explore_reference_ui.py'
      - 'tools/apply_build399_create_reference_ui.py'
      - 'tools/apply_build399_profile_reference_ui.py'
      - 'tools/check_build399_regression.py'
      - '.github/workflows/NgelX-BUILD-399-EXPLORE-CREATE-PROFILE-FINAL-UI.yml'

concurrency:
  group: ngelx-build399-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 395 final referans tasarimini uygula
        run: python3 tools/apply_build395_final_login_inbox_ui.py

      - name: Build 396 gelen kutusu duzeltmelerini uygula
        run: python3 tools/apply_build396_inbox_final_polish.py

      - name: Build 397 gelen kutusu tamamlamasini uygula
        run: python3 tools/apply_build397_inbox_complete_fixes.py

      - name: Build 398 giris ve hikaye duzeltmelerini uygula
        run: python3 tools/apply_build398_login_story_polish.py

      - name: Build 399 kayit ve profil kapak altyapisini uygula
        run: python3 tools/apply_build399_registration_profile_cover.py

      - name: Build 399 Kesfet tasarimini uygula
        run: python3 tools/apply_build399_explore_reference_ui.py

      - name: Build 399 Uret tasarimini uygula
        run: python3 tools/apply_build399_create_reference_ui.py

      - name: Build 399 Ben tasarimini uygula
        run: python3 tools/apply_build399_profile_reference_ui.py

      - name: Build 399 regresyon kapisi
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/check_build399_regression.py

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          nl -ba lib/main.dart | sed -n '10972,11002p'
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Gercek APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.175 --build-number=399
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI.apk > build/app/outputs/flutter-apk/NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.175-Build-399-EXPLORE-CREATE-PROFILE-FINAL-UI.apk.sha256
          if-no-files-found: error
          retention-days: 14
