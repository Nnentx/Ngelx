name: NgelX Build580 verified server and APK publication
on:
  push:
    branches: [release/build580-in-app-update]
    paths: ['.github/workflows/NgelX-PUBLISH580-UPDATE.yml', 'tools/build580_live_smoke.mjs', 'tools/build580_deployment_guard.mjs']
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-production-worker-deployment
  cancel-in-progress: false
jobs:
  staging:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_SERVER_URL: ${{ secrets.LIVEKIT_SERVER_URL }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated target and required configuration without printing credentials
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          for(const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','LIVEKIT_API_KEY','LIVEKIT_API_SECRET','LIVEKIT_SERVER_URL'])if(!process.env[key])throw Error('Missing required configuration: '+key);
          const raw=process.env.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED||process.env.FIREBASE_SERVICE_ACCOUNT;
          if(!raw)throw Error('Missing Firebase service identity');
          let service;try{service=JSON.parse(raw);}catch{service=JSON.parse(Buffer.from(raw,'base64').toString());}
          if(service.project_id!=='ngelx-44eed')throw Error('Wrong Firebase project');
          const name='ngelx-ludo576-qa-'+process.env.GITHUB_RUN_ID;
          if(!/^ngelx-ludo576-qa-[0-9]+$/.test(name))throw Error('Unsafe staging name');
          const config='name = "'+name+'"\nmain = "src/index.mjs"\ncompatibility_date = "2026-10-22"\nworkers_dev = true\n[vars]\nFIREBASE_PROJECT_ID = "ngelx-44eed"\n';
          fs.writeFileSync('cloudflare/live-moderation/wrangler.build576-qa.toml',config);
          const secrets={GOOGLE_SERVICE_ACCOUNT:JSON.stringify(service)};
          for(const key of ['LIVEKIT_API_KEY','LIVEKIT_API_SECRET','LIVEKIT_SERVER_URL'])secrets[key]=process.env[key];
          fs.writeFileSync(process.env.RUNNER_TEMP+'/build576-stage-secrets.json',JSON.stringify(secrets),{mode:0o600});
          console.log('Isolated staging configuration ready; production hostname and configuration unchanged.');
          JS
      - name: Run backend and authentication tests
        run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/auth.test.mjs
      - name: Deploy isolated temporary Worker only
        working-directory: cloudflare/live-moderation
        run: |
          npx --yes wrangler@4 deploy --config wrangler.build576-qa.toml
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/build576-stage-secrets.json" --config wrangler.build576-qa.toml
      - name: Test real Firebase accounts and Firestore CAS on isolated Worker
        env:
          NGELX_GAME_ENDPOINT: https://ngelx-ludo576-qa-${{ github.run_id }}.alihancaglar76.workers.dev/ludo
        run: node tools/build580_live_smoke.mjs
      - name: Always remove the exact temporary Worker and local secret file
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          fs.rmSync(process.env.RUNNER_TEMP+'/build576-stage-secrets.json',{force:true});
          if(!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)process.exit(0);
          const name='ngelx-ludo576-qa-'+process.env.GITHUB_RUN_ID;
          if(!/^ngelx-ludo576-qa-[0-9]+$/.test(name))throw Error('Unsafe cleanup target');
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)+'/workers/scripts/'+name,{method:'DELETE',headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(30000)});
          const data=await response.json();
          if(!data.success&&response.status!==404&&!data.errors?.some(e=>e.code===10007))throw Error('Temporary Worker cleanup failed: HTTP '+response.status);
          console.log('Temporary Worker removed or absent; production Worker untouched.');
          JS
  live:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the same tested Worker runtime and run its regression suite
        run: |
          git diff --exit-code e04d8e99aea63ede3802b282ff4688062245f965 -- cloudflare/live-moderation/src/ludo565.mjs cloudflare/live-moderation/wrangler.toml server/ludo565
          node --test tools/build576_deployment_guard.test.mjs
          node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/auth.test.mjs
      - name: Wait for the exact Build578 APK review to finish successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 40401696200 --repo Nnentx/Ngelx --exit-status --interval 20
      - name: Check successful APK and isolated acceptance; record rollback checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build580_deployment_guard.mjs prepare
      - name: Deploy only the existing Worker with original hostname and secrets
        id: deploy
        working-directory: cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy
      - name: Record deployment and wait for both production hostnames to converge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build580_deployment_guard.mjs record
      - name: Verify live game API including an already-rolled Auto die and temporary-account cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NGELX_GAME_ENDPOINT: https://oyun.ngelxsocial.com/ludo
          NGELX_PRODUCTION_SMOKE: '576'
        run: node tools/build580_live_smoke.mjs
      - name: Record live API acceptance without publishing APK or manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build580_deployment_guard.mjs accept
      - name: Restore checkpoint if deployment or acceptance failed
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build580_deployment_guard.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build580-Worker-Deployment-Evidence
          path: ${{ runner.temp }}/build580-worker-state.json
          if-no-files-found: ignore
  publish:
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build580-Worker-Deployment-Evidence
          path: evidence
      - name: Gate on exact signed app and successful matching live acceptance
        run: |
          set -euo pipefail
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40401696200 --jq .head_sha)" = e04d8e99aea63ede3802b282ff4688062245f965
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40401696200 --jq .conclusion)" = success
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/build580-worker-state.json'))
          assert d['apiAcceptance'] is True and d['physicalDeviceAcceptance'] is False
          assert d['apkRun']==40401696200 and d['acceptedAt']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build580-Review-APK
          run-id: 40401696200
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Verify exact APK bytes and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,os
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();digest=hashlib.sha256(raw).hexdigest()
          assert digest=='7743cdf5090d52b7472d89e934c4df3e910d1bef0e698c4a59e25d13a78d23e0'
          assert len(raw)==49482280
          with zipfile.ZipFile(files[0]) as z:
            assert z.testzip() is None
            assert 'lib/arm64-v8a/libapp.so' in z.namelist()
            assert z.read('assets/flutter_assets/assets/ludo577_pawns.png')==Path('tools/assets/ludo577_pawns.png').read_bytes()
          name='NgelX-1.0.350-Build580.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(digest+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.350','build':580,'size':len(raw),'sha256':digest,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.350-build580/'+name,'notes':'Ludo Auto aç/kapat ve ses kontrolü düzeltildi. Puanlarım, günlük hediye ve sandık hataları giderildi. Görselli davet kartı, iki dakikalık sayaç ve fotoğraflı kişi/grup araması eklendi. Dört kişilik serbest odalar iki veya üç oyuncuyla başlatılabilir. Oyuncu adları ve oda kodu büyütüldü; rakip seviyeleri görünür. Taş hizası ve hareketleri düzenlendi; dört saniyelik tam ekran kazanan kutlaması eklendi.','testedSource':'e04d8e99aea63ede3802b282ff4688062245f965','buildRun':40401696200,'liveAcceptanceRun':int(os.environ['GITHUB_RUN_ID'])}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('release-notes.md').write_text('NgelX 1.0.350 / Build580\n\n'+feed['notes']+'\n\n149 sunucu ve 34 Flutter testi, aynı imza ve gerçek Firebase/Cloudflare API kabul testleri geçti. İki fiziksel Android cihazda ses/akıcılık/uçtan uca kabul henüz yapılmadı. Mevcut uygulamanın üzerine kurulur.\n')
          PY
      - name: Preserve tested source with trusted release workflow metadata
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/git/trees/main > trusted-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          trusted=next(e['sha'] for e in json.load(open('trusted-tree.json'))['tree'] if e['path']=='.github')
          Path('release-tree.json').write_text(json.dumps({'base_tree':'e04d8e99aea63ede3802b282ff4688062245f965','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE580_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input release-tree.json > release-tree-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('release-commit.json').write_text(json.dumps({'message':'Build580 verified APK snapshot; physical device checks remain','tree':json.load(open('release-tree-result.json'))['sha'],'parents':['e04d8e99aea63ede3802b282ff4688062245f965']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input release-commit.json > release-commit-result.json
      - name: Publish exact APK and compare anonymous download
        run: |
          set -euo pipefail
          if gh release view v1.0.350-build580 >/dev/null 2>&1; then
            gh release download v1.0.350-build580 --pattern NgelX-1.0.350-Build580.apk --dir existing
            cmp NgelX-1.0.350-Build580.apk existing/NgelX-1.0.350-Build580.apk
          else
            target=$(python3 -c "import json;print(json.load(open('release-commit-result.json'))['sha'])")
            gh release create v1.0.350-build580 NgelX-1.0.350-Build580.apk NgelX-1.0.350-Build580.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.350 / Build580' --notes-file release-notes.md
          fi
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --silent --show-error https://github.com/Nnentx/Ngelx/releases/download/v1.0.350-build580/NgelX-1.0.350-Build580.apk --output public-download.apk
          cmp NgelX-1.0.350-Build580.apk public-download.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build580-Verified-Release-Metadata
          path: android-update.json
