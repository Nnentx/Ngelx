name: Ngel X BUILD 363 BOTTOM VIEWPORT SAFEAREA

on:
  workflow_dispatch:
  push:
    branches:
      - work/build363-bottom-viewport-safearea
    paths:
      - '.github/workflows/NgelX-BUILD-363-BOTTOM-VIEWPORT-SAFEAREA.yml'
      - 'app/lib/main.dart'
      - 'app/lib/build258_settings.dart'
      - 'app/pubspec.yaml'
      - 'WORK_PACKAGE_TEST_NOTES.md'

permissions:
  contents: read

concurrency:
  group: ngelx-build363-bottom-viewport-safearea
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          ref: work/build363-bottom-viewport-safearea
          fetch-depth: 0

      - name: Build 363 regresyonlarini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "version: 1.0.142+363" app/pubspec.yaml
          grep -F "defaultValue: '1.0.142'" app/lib/main.dart
          grep -F "defaultValue: '363'" app/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/lib/main.dart').read_text(encoding='utf-8')
          settings=Path('app/lib/build258_settings.dart').read_text(encoding='utf-8')
          assert "double ngelxAltSistemRezervi(BuildContext context,{double minimum=64})" in s
          assert "mq.systemGestureInsets.bottom" in s
          footer="bottomNavigationBar:SizedBox(height:ngelxAltSistemRezervi(context))"
          assert s.count(footer) >= 4
          assert footer in settings
          assert "minimum:EdgeInsets.only(bottom:8)" not in s
          assert "minimum:EdgeInsets.only(bottom:8)" not in settings
          assert "Widget _istekEylemButonu" in s
          assert "Icons.check_rounded:Icons.close_rounded" in s
          assert "case 'follow_requests': return tur=='follow_request'&&v['status']=='pending';" in s
          assert "case 'friend_requests': return tur=='friend_request'&&v['status']=='pending';" in s
          cache="for(final d in _sunucuAktiviteleri)birlesik[d.id]=d;"
          live="for(final d in s.data?.docs??<QueryDocumentSnapshot<Map<String,dynamic>>>[])birlesik[d.id]=d;"
          assert s.index(cache) < s.index(live)
          assert "sosyalIstekRef(me,uid,'follow_request').snapshots()" in s
          assert "sosyalIstekRef(me,uid,'friend_request').snapshots()" in s
          assert "Takip tek yönlüdür. Arkadaşlık state'ine dokunulmaz." in s

          # Grup arama Aktivite bildirimi doğrudan eski/aktif aramaya sokmamalı.
          group_route="if((hedefTuru=='group'||olay=='group_audio_call'||olay=='group_video_call')&&kaynak.isNotEmpty)"
          private_call="if(tur=='call'&&kaynak.isNotEmpty)"
          assert group_route in s
          assert s.index(group_route) < s.index(private_call)

          assert 'ngelxArkaPlanAramaSakla(' in s
          assert 'ngelxArkaPlanAramayiGeriAl(widget.roomName)' in s
          assert 'rotus=widget.goruntulu;' in s
          print('Build 363 static regression checks OK')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz ve test
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi
          if [ -d test ]; then flutter test; else echo "Test klasoru yok."; fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.142-Build-363-BOTTOM-VIEWPORT-SAFEAREA
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
