name: NgelX live backend readiness read only
on:
  push:
    branches: [qa/ngelx-build553-live-video-20261022]
    paths: ['.github/workflows/NgelX-DIAG553-LIVE.yml', 'tools/diagnose_build553_live.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check google-auth requests
      - env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/diagnose_build553_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-live553-current-rules
          path: |
            live553-current.rules
            live553-rule-release.json
          retention-days: 7
