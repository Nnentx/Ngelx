name: Publish Build573 test APK direct download
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-PUBLISH573-DIRECT-APK.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require tested Build572 before publishing
        run: |
          set -euo pipefail
          gh run watch 40286383224 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40286383224 --jq .conclusion)" = success
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40286383224 --jq .head_sha)" = e4b6ece0dbab9c856769abe52bc4ce72701ca849
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build573-Review-APK
          run-id: 40286383224
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate the exact tested APK and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();sha=hashlib.sha256(raw).hexdigest()
          assert len(raw)==48668586
          assert sha=='4b0ddff862746775e6a86bca5ea639019aa439836f95cae587dbd460078dd5cb'
          with __import__('zipfile').ZipFile(files[0]) as z:
              assert z.testzip() is None and 'assets/flutter_assets/AssetManifest.bin' in z.namelist()
          name='NgelX-1.0.343-Build573.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(sha+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.343','build':573,'size':len(raw),'sha256':sha,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.343-build573-test/'+name,'notes':'Build573 deneme sürümü. Daha geniş Ludo tahtası, kompakt alt kontrol alanı, yeni arka plan, hücre içine sığan taşlar, gerçek veri için cüzdan/seviye alanları. Uygulama içi otomatik güncelleme değiştirilmez.','testedSource':'e4b6ece0dbab9c856769abe52bc4ce72701ca849','buildRun':40286383224}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('notes.md').write_text('NgelX 1.0.343 / Build573 TEST.\\n\\nKlasik ve Power Ludo, izleyici sayacı, 2/4 oyuncu, 3 zar başlangıç hakkı, sesli odaya katılma sesi, sohbet performansı ve özel/grup sohbetinde Ludo daveti.\\n\\nCI testleri, APK imzası ve önceki görseller doğrulandı; gerçek cihaz oyun ve ses kontrolleri ayrıca gereklidir.\\n')
          PY
      - name: Preserve tested source using the existing trusted release workflow tree
        run: |
          gh api repos/Nnentx/Ngelx/git/trees/main > main-tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          trusted=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'e4b6ece0dbab9c856769abe52bc4ce72701ca849','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE573_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('commit.json').write_text(json.dumps({'message':'Build573 tested preview source snapshot for APK direct download','tree':json.load(open('tree-result.json'))['sha'],'parents':['e4b6ece0dbab9c856769abe52bc4ce72701ca849']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish APK and verify the public download bytes
        run: |
          if gh release view v1.0.343-build573-test >/dev/null 2>&1; then
            gh release download v1.0.343-build573-test --pattern NgelX-1.0.343-Build573.apk --dir existing
            cmp NgelX-1.0.343-Build573.apk existing/NgelX-1.0.343-Build573.apk
          else
            target=$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")
            gh release create v1.0.343-build573-test NgelX-1.0.343-Build573.apk NgelX-1.0.343-Build573.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.343 / Build573 test' --notes-file notes.md
            gh release download v1.0.343-build573-test --pattern NgelX-1.0.343-Build573.apk --dir existing
            cmp NgelX-1.0.343-Build573.apk existing/NgelX-1.0.343-Build573.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build573-Release-Metadata
          path: android-update.json

