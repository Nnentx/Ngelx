name: NgelX free live moderation worker
on:
  push:
    branches: [qa/ngelx-free-live555-20261022]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test worker authentication, room admin and Firestore behavior
        run: node --test cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/auth.test.mjs server/livekit443/*.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Check existing free hosting and LiveKit configuration
        id: readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_SERVER_URL: ${{ secrets.LIVEKIT_SERVER_URL }}
        run: node cloudflare/live-moderation/preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-free-live555-readiness
          path: live555-free-readiness.json
          retention-days: 7
      - name: Deploy only the new moderation worker on confirmed Free hosting
        if: steps.readiness.outputs.ready == 'true'
        working-directory: cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx wrangler deploy
          npx wrangler secret bulk .live-secrets555.json
          node -e "const r=await fetch('https://ngelx-live-moderation.alihancaglar76.workers.dev/health');if(r.status!==200)throw Error('Worker not configured');const u=await fetch('https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate',{method:'POST'});if(u.status!==401)throw Error('Authentication boundary failed');console.log('Worker configured; unauthorized requests denied');"
