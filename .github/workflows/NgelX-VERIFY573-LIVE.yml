name: Verify NgelX Build573 in-app update feed
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-VERIFY573-LIVE.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live app updater after GitHub Pages deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --location --max-time 12 -H 'Cache-Control: no-cache' "https://ngelxsocial.com/android-update.json?verify=573-$attempt" -o /tmp/ngelx-update.json; then
              if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/ngelx-update.json'))
          assert p['package']=='com.nnentx.ngelx_app'
          assert p['version']=='1.0.343' and p['build']==573
          assert p['size']==48668586
          assert p['sha256']=='4b0ddff862746775e6a86bca5ea639019aa439836f95cae587dbd460078dd5cb'
          assert p['url']=='https://github.com/Nnentx/Ngelx/releases/download/v1.0.343-build573-test/NgelX-1.0.343-Build573.apk'
          print('PASS: NgelX Build573 is live for in-app Updates and NgelX Announcements')
          PY
              then exit 0; fi
            fi
            sleep 7
          done
          echo 'Build573 not yet confirmed on live update URL'
          exit 1
