                          color: Colors.white70,
                        ),
                      ),
                    Positioned(
                      left: 18,
                      right: 85,
                      bottom: 25,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '@${widget.kullaniciAdi}',
                            style: const TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Anı yakala, kendi hikâyeni paylaş ✨',
                          ),
                          const SizedBox(height: 8),
                          const Row(
                            children: [
                              Icon(Icons.graphic_eq, size: 17),
                              SizedBox(width: 6),
                              Text('NgelX • Özgün ses'),
                            ],
                          ),
                        ],
                      ),
                    ),
                    Positioned(
                      right: 14,
                      bottom: 20,
                      child: Column(
                        children: [
                          GestureDetector(
                            onTap: paylasanProfiliAc,
                            child: CircleAvatar(
                              radius: 27,
                              backgroundColor: mavi,
                              child: CircleAvatar(
                                radius: 23,
                                backgroundColor: panel,
                                backgroundImage: profilFoto.isEmpty ? null : NetworkImage(profilFoto),
                                child: profilFoto.isNotEmpty ? null : const Text(
                                  'N',
                                  style: TextStyle(
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            ),
                          ),
                          IslemButonu(
                            ikon: begenildi
                                ? Icons.favorite
                                : Icons.favorite_border,
                            yazi: '$begeniSayisi',
                            renk: begenildi
                                ? Colors.pinkAccent
                                : Colors.white,
                            tiklama: begeniyiDegistir,
                          ),
                          IslemButonu(
                            ikon: Icons.mode_comment_outlined,
                            yazi: '$yorumSayisi',
                            tiklama: yorumlariAc,
                          ),
                          IslemButonu(
                            ikon: indiriliyor
                                ? Icons.downloading
                                : kaydedildi
                                ? Icons.bookmark
