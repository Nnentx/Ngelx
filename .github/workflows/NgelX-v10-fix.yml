                  child: Column(children: [Icon(ikon, color: secili ? Colors.black : Colors.white60), const SizedBox(height: 5), Text(yazi, style: TextStyle(color: secili ? Colors.black : Colors.white60, fontWeight: FontWeight.bold))]),
