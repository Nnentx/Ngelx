                                    child: GestureDetector(
                                      onTap: hikayeYukle,
                                      child: Container(
                                        padding: const EdgeInsets.all(9),
                                        decoration: const BoxDecoration(color: mor, shape: BoxShape.circle, boxShadow: [BoxShadow(color: mor, blurRadius: 13)]),
                                        child: const Icon(Icons.add_a_photo_rounded, size: 20),
                                      ),
                                    ),
                                  ),
