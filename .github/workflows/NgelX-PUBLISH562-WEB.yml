name: Publish verified Build562 for website downloads
on:
  push:
    branches: [fix/free-verification-email]
    paths: ['.github/workflows/NgelX-PUBLISH562-WEB.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - name: Require exact successfully tested source and immutable artifact
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/actions/runs/40120801727 > run.json
          gh api repos/Nnentx/Ngelx/actions/artifacts/12570679710 > artifact.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'));a=json.load(open('artifact.json'))
          assert r['conclusion']=='success' and r['head_sha']=='33728e8454f712dd301cc737ef68b3bf5b040dbb'
          assert not a['expired'] and a['workflow_run']['id']==40120801727
          assert a['digest']=='sha256:c77e89fdc88a1293651d57503e9e180c483e4dffd8d6806b6358a2627d7f09ee'
          PY
          gh api repos/Nnentx/Ngelx/actions/artifacts/12570679710/zip > artifact.zip
      - name: Verify and extract unchanged signed APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          raw=Path('artifact.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c77e89fdc88a1293651d57503e9e180c483e4dffd8d6806b6358a2627d7f09ee'
          with zipfile.ZipFile('artifact.zip') as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.endswith('.apk')]
              assert len(names)==1
              apk=z.read(names[0])
          digest=hashlib.sha256(apk).hexdigest()
          assert len(apk)==47507827 and digest=='7b13237e789fd87be25dc6e5ba99f6f562e6230afe426013e0524ac630483c40'
          name='NgelX-1.0.332-Build-562.apk'
          Path(name).write_bytes(apk)
          Path(name+'.sha256').write_text(digest+'  '+name+'\n')
          print('Exact tested APK verified:',len(apk),'bytes',digest)
          PY
      - name: Preserve tested source with trusted existing workflow tree
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/commits/main > main.json
          gh api repos/Nnentx/Ngelx/git/trees/$(python3 -c "import json;print(json.load(open('main.json'))['sha'])") > main-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          main=json.load(open('main.json'))['sha']
          github=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          manifest={'testedSource':'33728e8454f712dd301cc737ef68b3bf5b040dbb','buildRun':40120801727,'artifact':12570679710,'apkSha256':'7b13237e789fd87be25dc6e5ba99f6f562e6230afe426013e0524ac630483c40','workflowTreeFromMain':main,'note':'APK unchanged; all tested source retained except trusted main workflow directory, to support release-tag API authorization.'}
          tree={'base_tree':manifest['testedSource'],'tree':[{'path':'.github','mode':'040000','type':'tree','sha':github},{'path':'RELEASE562_MANIFEST.json','mode':'100644','type':'blob','content':json.dumps(manifest,indent=2)+'\n'}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('commit.json').write_text(json.dumps({'message':'Build562 verified release source snapshot; retain trusted main workflows','tree':json.load(open('tree-result.json'))['sha'],'parents':['33728e8454f712dd301cc737ef68b3bf5b040dbb']}))
          Path('notes.md').write_text('NgelX Android 1.0.332 / Build562 test sürümü.\n\nYeni üyelik ve yeniden gönderim, ngelxsocial.com gönderen adresinden butonlu doğrulama e-postası gönderen ücretsiz Cloudflare + Resend servisine bağlandı. Firebase Spark planında kaldı; ücretli plan açılmadı.\n\nMevcut uygulamayı silmeden üzerine güncelleyebilirsiniz. Aynı APK başarılı 40120801727 çalışmasından alınmış, SHA256 ve mevcut güncelleme imzası doğrulanmıştır.\n\nGerçek telefonda kayıt/yeniden gönderim ve Gmail görünümü kullanıcı kabul kontrolü bekliyor. Profil gönderilerindeki yorum kasması bu sürümde çözülmüş sayılmıyor.\n')
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish owner-authorized test download without replacing other versions
        run: |
          set -euo pipefail
          if gh release view v1.0.332-build562-test >/dev/null 2>&1; then
            gh release view v1.0.332-build562-test --json assets > existing.json
            python3 - <<'PY'
          import json
          assets=json.load(open('existing.json'))['assets']
          apk=next(a for a in assets if a['name']=='NgelX-1.0.332-Build-562.apk')
          assert apk['size']==47507827
          PY
            gh release download v1.0.332-build562-test --pattern NgelX-1.0.332-Build-562.apk --dir verify-existing
            echo '7b13237e789fd87be25dc6e5ba99f6f562e6230afe426013e0524ac630483c40  verify-existing/NgelX-1.0.332-Build-562.apk' | sha256sum -c -
          else
            gh release create v1.0.332-build562-test NgelX-1.0.332-Build-562.apk NgelX-1.0.332-Build-562.apk.sha256 --target "$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")" --prerelease --title 'NgelX 1.0.332 / Build562 test' --notes-file notes.md
          fi
