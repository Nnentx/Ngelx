name: Publish verified Build452 test APK
on:
  push:
    branches: [work/build-452-free-call-push]
    paths: ['.github/workflows/NgelX-PUBLISH452.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact successfully tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38469429163 --repo Nnentx/Ngelx --name NgelX-1.0.227-Build-452-FREE-CALL-PUSH --dir release452
      - name: Validate published APK bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          apk=next(Path('release452').rglob('NgelX-1.0.227-Build-452-FREE-CALL-PUSH.apk'))
          expected='9f59102d9d08d2518483470f11e76ecdcf63ca6d38becccfb60731e46b3ab127'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          shutil.copyfile(apk,'NgelX-1.0.227-Build-452.apk')
          Path('NgelX-1.0.227-Build-452.apk.sha256').write_text(expected+'  NgelX-1.0.227-Build-452.apk\n')
          Path('release-notes452.md').write_text('Android test sürümü 1.0.227 / Build 452.\n\nÜcretsiz arama bildirim sunucusu bağlantısı eklendi. Önceki canlı yayın ve topluluk ekranı düzenlemelerini içerir. Derleme, analiz, güvenlik testleri ve mevcut kurulumla uyumlu imza doğrulandı.\n\nArka plan araması ve zil sesi iki gerçek telefonda test edilmeyi bekliyor. Topluluk gönderi indeksi için sunucu yetkisi eksikliği devam ediyor.\n')
          PY
      - name: Publish exact test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.227-build452-test NgelX-1.0.227-Build-452.apk NgelX-1.0.227-Build-452.apk.sha256 --repo Nnentx/Ngelx --target 4232ade5605c84bd92e53c876ed92122f1366e68 --prerelease --title "NgelX 1.0.227 / Build 452 test" --notes-file release-notes452.md
