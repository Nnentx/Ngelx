name: Publish exact verified Build546 APK
on:
  push:
    branches: [qa/ngelx-publish546-verified-20261020]
    paths: ['.github/workflows/NgelX-PUBLISH546-VERIFIED.yml', 'docs/qa/publish546.md']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ngelx-publish546
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the exact tested source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 39446648099 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39446648099 --jq .head_sha)" = "53c60d1a9752c56a2b8fb49d0634e4ea0b875879"
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39446648099 --jq .conclusion)" = "success"
      - name: Download only the checked signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39446648099 --repo Nnentx/Ngelx --name NgelX-Build546-REAL-INPLACE-SIGNED-REVIEW-ONLY --dir candidate546
      - name: Check exact APK bytes and preserve prior releases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,shutil
          name='NgelX-1.0.316-Build546-INPLACE-CANDIDATE.apk'
          matches=list(Path('candidate546').rglob(name))
          assert len(matches)==1
          apk=matches[0];expected=Path(str(apk)+'.sha256').read_text().split()[0]
          assert len(expected)==64
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          assert 30_000_000 < apk.stat().st_size < 100_000_000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          output='NgelX-1.0.316-Build-546.apk'
          shutil.copyfile(apk,output)
          Path(output+'.sha256').write_text(expected+'  '+output+'\n')
          Path('release546.md').write_text('NgelX Android 1.0.316 / Build546 test sürümü.\n\nKonuk katılımında mevcut yayın izni yeterliyse bağlantı korunur. Konuk bağlantı durumları, sınırlı tekrar deneme, mikrofon/kamera kontrolleri ve yalnızca sesle katılım eklendi. Bağlantı kurtarmada konuk tercihleri korunur. Gelen arama ekranı grup/kişi fotoğrafını zil sesini bekletmeden yükler. Build545 hesap geçişi ve küçük pencere yapısı korunur.\n\nTam kaynak üretimi, Flutter testleri/analizi, Android derlemesi, orijinal imza ve paket/sürüm kontrolleri başarılı. Gerçek cihazda konuk sesi, bağlantı gecikmesi ve gelen arama fotoğrafı kabul testi gerekir. Sunucu tarafı konuk moderasyonu gerekli yönetim anahtarları bulunmadığı için etkinleştirilmedi. Topluluğu tam silme hizmeti henüz etkin değildir. Ücretli plan/faturalandırma açılmadı. Önceki sürümler korunur.\n\nSHA256: '+expected+'\nCI: https://github.com/Nnentx/Ngelx/actions/runs/39446648099\n')
          print('Verified release APK SHA256:',expected)
          PY
      - name: Publish immutable version without overwriting prior APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.316-build546-test --repo Nnentx/Ngelx >/dev/null 2>&1; then
            echo 'Build546 release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v1.0.316-build546-test NgelX-1.0.316-Build-546.apk NgelX-1.0.316-Build-546.apk.sha256 --repo Nnentx/Ngelx --target 53c60d1a9752c56a2b8fb49d0634e4ea0b875879 --prerelease --title 'NgelX 1.0.316 / Build546 test' --notes-file release546.md
