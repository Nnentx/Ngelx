name: NgelX Build495 Call Rejoin Flutter QA (no deploy)

on:
  workflow_dispatch:
  push:
    branches:
      - qa/ngelx-build495-call-kick-rejoin-tests-20261018
    paths:
      - '.github/workflows/NgelX-BUILD495-REJOIN-QA.yml'
      - 'app/lib/build446_call_lifecycle.dart'
      - 'app/test/build485_call_kick_rejoin_test.dart'

permissions:
  contents: read

concurrency:
  group: ngelx-build495-rejoin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify scoped rejoin tests
        working-directory: app
        run: |
          flutter test --reporter expanded --timeout 90s test/build485_call_kick_rejoin_test.dart
      - name: Verify call code syntax
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Confirm no deploy
        run: echo "QA only; no production APK, no Firebase deployment"
