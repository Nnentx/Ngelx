name: NgelX Build438 identifier auth validation
on:
  push:
    branches: [work/build-438-phone-qa]
    paths:
      - '.github/workflows/NgelX-BUILD-438-AUTH-VALIDATION.yml'
      - 'server/auth/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server auth tests (mock upstream, no production operations)
        run: node --test server/auth/test/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Emulator dependencies
        run: npm install --prefix server/auth --no-save firebase-admin firebase-tools
      - name: Concurrent limiter test (local emulator only)
        run: npx --prefix server/auth firebase emulators:exec --project demo-ngelx-auth --config server/auth/emulator/firebase.json --only firestore "node server/auth/emulator/rate-limit.mjs"
