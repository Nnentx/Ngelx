name: NgelX Build566 game connection domain
on:
  push:
    branches: [feat/build566-ludo-pk]
    paths: ['tools/build566_game_domain.mjs', '.github/workflows/NgelX-BUILD566-ROUTE.yml']
permissions:
  contents: read
jobs:
  existing-worker-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add owned game hostname to the existing worker without billing changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build566_game_domain.mjs
