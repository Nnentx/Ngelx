name: NgelX BUILD 394 INBOX CHAT ACTIVITY SEARCH FIXES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-394-inbox-chat-activity-search-fixes
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'QA/**'
      - 'WORK_BUILD_394.md'
      - '.github/workflows/NgelX-BUILD-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.yml'

concurrency:
  group: ngelx-build394-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 394 regresyon kapisi
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: 1.0.170+394' app/pubspec.yaml
          grep -Fq "defaultValue: '394'" app/lib/main.dart
          grep -Fq "defaultValue: '1.0.170'" app/lib/main.dart

          # Build 392/393 korunan davranislar.
          grep -Fq "Daha önceki sohbet geçmişi silinmez." app/lib/main.dart
          grep -Fq "Engellemeyi Kaldır" app/lib/main.dart
          grep -Fq "Bu grupta engellediğin bir kişi var" app/lib/main.dart
          grep -Fq "Engellediğin kişinin mesajı gizlendi" app/lib/main.dart
          grep -Fq "Bu gruba mesaj gönderemezsin" app/lib/main.dart
          grep -Fq "Takip isteği kabul edildi." app/lib/main.dart
          grep -Fq "Arkadaşlık isteği kabul edildi." app/lib/main.dart

          # Build 394.
          grep -Fq "inbox_merged_" app/lib/main.dart
          grep -Fq "group_removed" app/lib/main.dart
          grep -Fq "_ozelSohbetArkaPlanUrl" app/lib/main.dart
          grep -Fq "_acilisKaydirmaKalan=4" app/lib/main.dart
          grep -Fq "people_search_" app/lib/main.dart
          grep -Fq "Sonuç bulunamadı." app/lib/main.dart
          grep -Fq "if(!members.contains(me))" app/lib/main.dart
          grep -Fq "private_chat_" app/lib/main.dart

          git diff --check

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Gercek APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.170 --build-number=394
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.apk > build/app/outputs/flutter-apk/NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.170-Build-394-INBOX-CHAT-ACTIVITY-SEARCH-FIXES.apk.sha256
          if-no-files-found: error
          retention-days: 14
