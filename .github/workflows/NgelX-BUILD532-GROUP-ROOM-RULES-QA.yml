name: NgelX Build532 Group Room Participant Rules QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build532-group-room-participant-guard-20261019
  pull_request:
    branches:
      - qa/ngelx-build531-group-exit-rule-guard-20261019
    paths:
      - 'firestore.rules'
      - 'tools/build532_group_room_rules_test.mjs'
      - '.github/workflows/NgelX-BUILD532-GROUP-ROOM-RULES-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group-room-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source syntax and server token rules
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build532_group_room_rules_test.mjs
          python3 tools/test_build530_group_exit_guard.py
          node --test server/livekit443/room-policy.test.mjs
      - name: Install local emulator test dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Test Build532 and earlier group call Firestore regressions
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build532_group_room_rules_test.mjs && node tools/build531_group_exit_rules_test.mjs && node tools/build517_group_leave_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs"
      - name: Verify production isolation
        run: echo 'Build532 no deployment, live secrets, Build484, main, or production RTC writes.'
