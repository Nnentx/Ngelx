name: NgelX BUILD 387 DEVICE FIXES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-387-device-fixes
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'QA/**'
      - '.github/workflows/NgelX-BUILD-387-DEVICE-FIXES.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 387 kapsam kontrolu
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: 1.0.163+387' app/pubspec.yaml
          grep -q "defaultValue: '387'" app/lib/main.dart

          # Mesaj yazma performansi korunacak.
          grep -Fq 'mentionZamanlayici' app/lib/main.dart
          grep -Fq "final sonParca=deger.split(RegExp(r'\\s+')).last;" app/lib/main.dart

          # Sohbet arka plani sohbet seviyesinde ortak tutulacak.
          grep -Fq "arkaPlanUrl=(veri['backgroundUrl']??veri['backgroundUrl_\$uid']??'').toString()" app/lib/main.dart
          grep -Fq "await ref.set({'backgroundUrl':url,'backgroundUpdatedBy':me" app/lib/main.dart
          grep -Fq 'Sohbet arka planı iki taraf için güncellendi.' app/lib/main.dart

          # Alt tasma duzeltmeleri.
          grep -Fq 'ngelxAltGuvenliBosluk(context,extra:28)' app/lib/main.dart
          grep -Fq 'ngelxAltSistemRezervi(ctx,minimum:88)' app/lib/main.dart
          grep -Fq 'ngelxAltGuvenliBosluk(context,extra:32)' app/lib/main.dart

          # Etkilesim kartlari gercek hit target ile tiklanabilir.
          grep -Fq "label:'\$t detayları'" app/lib/main.dart
          grep -Fq 'behavior:HitTestBehavior.opaque' app/lib/main.dart
          grep -Fq 'EtkilesimDetayPage(uid:uid' app/lib/main.dart

          # Hikaye menusu + silme onayi.
          grep -Fq 'Hikâyeyi paylaş' app/lib/story_v66.dart
          grep -Fq 'Öne çıkanlara ekle' app/lib/story_v66.dart
          grep -Fq 'Arşive taşı' app/lib/story_v66.dart
          grep -Fq 'Hikâye silinsin mi?' app/lib/story_v66.dart

          # Takip/takipci sayaçlari Firestore streaminden gelir; gecici delta yok.
          ! grep -Fq '_yerelTakipciDelta' app/lib/main.dart
          grep -Fq "collection('users').doc(uid).snapshots()" app/lib/main.dart
          grep -Fq "final canliTakipci=List<dynamic>.from(canli['followers']??const[]).length;" app/lib/main.dart

          git diff --check

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Gercek APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.163 --build-number=387
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.163-Build-387-DEVICE-FIXES.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.163-Build-387-DEVICE-FIXES.apk > build/app/outputs/flutter-apk/NgelX-1.0.163-Build-387-DEVICE-FIXES.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.163-Build-387-DEVICE-FIXES
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.163-Build-387-DEVICE-FIXES.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.163-Build-387-DEVICE-FIXES.apk.sha256
          if-no-files-found: error
          retention-days: 14
