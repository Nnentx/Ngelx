name: NgelX v37 Final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/build-v37-final.yml'

concurrency:
  group: ngelx-v37-final
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bağımlılıkları kur
        working-directory: app
        run: flutter pub get
      - name: Dart biçimini doğrula
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib
      - name: Statik analizi çalıştır
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Release APK oluştur
        working-directory: app
        run: flutter build apk --release
      - name: Final APK adını hazırla
        run: cp app/build/app/outputs/flutter-apk/app-release.apk NgelX-v37-final.apk
      - name: Final APK artifactini yükle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v37-final
          path: NgelX-v37-final.apk
          if-no-files-found: error
          retention-days: 30
