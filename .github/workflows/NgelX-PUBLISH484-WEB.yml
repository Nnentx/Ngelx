name: Publish verified NgelX Build484 APK for web
on:
  push:
    branches: [qa/ngelx-build484-community-founder-client-20261017]
    paths: ['.github/workflows/NgelX-PUBLISH484-WEB.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the exact successful Build484 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39061716452 --jq .head_sha)" = "6667fd0416994c72c8ce6baa6ef880fd17d40260"
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39061716452 --jq .conclusion)" = "success"
          test "$(gh api repos/Nnentx/Ngelx/actions/artifacts/12111942942 --jq .expired)" = "false"
          if gh release view v1.0.259-build484-test --repo Nnentx/Ngelx >/dev/null 2>&1; then
            echo 'Release tag already exists; stopping without replacing existing APK.'
            exit 1
          fi
      - name: Download verified Build484 Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39061716452 --repo Nnentx/Ngelx --name NgelX-1.0.259-Build-484-COMMUNITY-QA --dir candidate484
      - name: Verify exact APK SHA-256 and prepare release files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          root=Path('candidate484')
          filename='NgelX-1.0.259-Build-484-COMMUNITY-QA.apk'
          matches=list(root.rglob(filename))
          checksums=list(root.rglob(filename+'.sha256'))
          assert len(matches)==len(checksums)==1, 'Expected exactly one signed APK and checksum'
          apk=matches[0]
          expected=checksums[0].read_text().split()[0].lower()
          assert len(expected)==64 and all(c in '0123456789abcdef' for c in expected)
          assert apk.stat().st_size > 50_000_000, 'APK unexpectedly small'
          with apk.open('rb') as fh:
              h=hashlib.file_digest(fh,'sha256').hexdigest()
          assert h==expected, 'APK checksum mismatch'
          output='NgelX-1.0.259-Build-484.apk'
          shutil.copyfile(apk,output)
          Path(output+'.sha256').write_text(f'{h}  {output}\n')
          Path('release-notes484.md').write_text(
              'NgelX Android 1.0.259 / Build 484 TEST sürümü.\n\n'
              'Bu APK, GitHub Actions çalışması 39061716452 sonucunda başarılı biçimde derlenen ve SHA-256 ile doğrulanan test adayıdır. Derleme sırasında Android sürüm kodu, adı ve kurulu sürümle uyumlu imza doğrulanmıştır.\n\n'
              'Build484 topluluk kurucusu/yöneticisi istemci yetki kontrollerini içerir. Canlı Firebase güvenlik kurallarının dağıtımı ve iki gerçek telefonla testler bu yayın kapsamında yapılmamıştır. Üretim dağıtımı değildir.\n')
          print('Verified signed QA candidate: size',apk.stat().st_size,'sha256',h)
          PY
      - name: Publish test release without changing production backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.259-build484-test NgelX-1.0.259-Build-484.apk NgelX-1.0.259-Build-484.apk.sha256 --repo Nnentx/Ngelx --target 6667fd0416994c72c8ce6baa6ef880fd17d40260 --prerelease --title 'NgelX 1.0.259 / Build 484 test' --notes-file release-notes484.md
