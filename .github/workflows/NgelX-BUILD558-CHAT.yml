# Build541: same-package, pinned-signer, review-only real NgelX release APK candidate.
# Community rules activated by owner authorization; no unrelated deployment.
name: NgelX Build558 chat, media and call banner candidate
# Feature-branch candidate only; no deployment or production mutation.
on:
  push:
    branches: [fix/build558-chat-profile-polish]
    paths: ['tools/**', '.github/workflows/NgelX-BUILD558-CHAT.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngelx-build558-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify moderation, authentication and resumable deletion before deployment
        run: node --test cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/*.test.mjs server/community543/delete-policy.test.mjs server/livekit443/*.test.mjs
      - name: Verify healthy configuration and anonymous deletion rejection
        run: |
          node --input-type=module - <<'JS'
          const base='https://ngelx-live-moderation.alihancaglar76.workers.dev';
          const health=await fetch(base+'/health');const data=await health.json();
          if(!health.ok||data.ok!==true||!data.features?.includes('community_delete556'))throw Error('Delete service is not deployed/configured');
          const denied=await fetch(base+'/community/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({communityId:'health-check-only',confirmName:'health-check-only',confirmDelete:true})});
          if(denied.status!==401)throw Error('Unauthorized deletion boundary failed');
          console.log('Existing worker configured; unauthenticated delete request rejected. No community deleted.');
          JS

  build:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build516 header compatibility preflight before long QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_build516_global_live_search.py tools/test_build516_layout_variants.py
          python3 tools/test_build516_layout_variants.py

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Confirm authentic NgelX Android identity and Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          # No QA suffix, no placeholder Firebase setup, no production mutation.
          test ! -f app/android/key.properties
          test -s app/android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          gradle=Path('app/android/app/build.gradle.kts').read_text()
          assert 'applicationId = "com.nnentx.ngelx_app"' in gradle
          assert 'applicationIdSuffix' not in gradle
          cfg=json.loads(Path('app/android/app/google-services.json').read_text())
          ids=[x.get('client_info',{}).get('android_client_info',{}).get('package_name') for x in cfg.get('client',[])]
          assert 'com.nnentx.ngelx_app' in ids, 'Firebase Android client for real app is missing'
          assert cfg.get('project_info',{}).get('project_id') not in ('demo-project','fake','qa-placeholder','test-project',''), 'Placeholder Firebase project'
          assert Path('app/lib/main.dart').is_file()
          print('Existing Android app identity and real-app Firebase config are present (values not displayed).')
          PY

      - name: Restore verified existing NgelX update signing certificate
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Gate signing certificate against Build470 in-place updater
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'
          echo 'Expected Build470 signing identity present.'

      - name: Build536 approved source contracts before full regeneration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_build535_consented_rejoin_preflight.py
          python3 tools/test_build534_explicit_rejoin.py
