      - name: Compile NgelX real-app release APK for ARM64 update
        shell: bash
        working-directory: app
        timeout-minutes: 35
        run: |
          set -euo pipefail
          # Use the proven Build536 Flutter app, not the separate Build538 offline entrypoint.
          # Do not use --split-per-abi: Flutter adds ABI prefixes to versionCode,
          # which can block future ordinary 540+ in-place upgrade attempts.
          # These Gradle packaging edits exist ONLY in the disposable CI runner.
          # Keep the manifest versionCode 553; filter all JNI libs using Gradle ABI filters.
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('android/app/build.gradle.kts')
          old=gradle.read_text(encoding='utf-8')
          abi='        ndk {\n            abiFilters += listOf("armeabi-v7a", "arm64-v8a")\n        }\n'
          assert old.count(abi)==1, 'Unexpected native ABI Gradle layout'
          # Restrict Android native dependencies too (Flutter --target-platform alone
          # does not guarantee third-party .so files are ARM64-only).
          new=old.replace(abi,'        ndk {\n            abiFilters += listOf("arm64-v8a")\n        }\n',1)
          assert new.count('    buildTypes {')==1
          new=new.replace('    buildTypes {','    packaging { jniLibs { useLegacyPackaging = true } }\n\n    buildTypes {',1)
          gradle.write_text(new,encoding='utf-8')
          PY
          flutter build apk --release --target-platform android-arm64 \
            --build-name=1.0.328 --build-number=558 \
            --dart-define=NGELX_VERSION_NAME=1.0.328 --dart-define=NGELX_BUILD_NUMBER=558 \
            --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete \
            --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate \
            --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' apk-signature.txt
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$apk" > apk-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          b=Path('apk-badging.txt').read_text()
          m=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",b)
          assert m, 'Android manifest badging missing'
          assert m.group(1)=='com.nnentx.ngelx_app', 'Wrong package — would not update real NgelX'
          assert int(m.group(2))==558, 'APK versionCode must be exactly 558 (no ABI offset)'
          assert m.group(3)=='1.0.328', 'VersionName mismatch'
          assert "com.nnentx.ngelx_app.qa" not in b
          print('Real NgelX Android package/version verified:',m.groups())
          PY
          python3 - "$apk" <<'PY'
          import sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              libs=[f.filename for f in z.infolist() if f.filename.endswith('.so') and f.filename.startswith('lib/')]
              arm64=[name for name in libs if name.startswith('lib/arm64-v8a/')]
              # Third-party AAR dependencies may contribute additional ABI slices
              # even with Gradle ndk.abiFilters; Android will select arm64 at install.
              # Require the actual 64-bit Flutter runtime and app binaries instead
              # of rejecting a valid signed APK for carrying extra architectures.
              assert 'lib/arm64-v8a/libflutter.so' in arm64, 'Missing Android ARM64 Flutter runtime'
              assert 'lib/arm64-v8a/libapp.so' in arm64, 'Missing Android ARM64 application binary'
              non_arm=sorted(set(name.split('/')[1] for name in libs if not name.startswith('lib/arm64-v8a/')))
              print('Verified ARM64 Flutter native libs:',len(arm64),'additional bundled ABI names:',non_arm)
          print('Build543 Android ARM64-capable release APK bytes:',p.stat().st_size)
          PY
          cp "$apk" build/app/outputs/flutter-apk/NgelX-1.0.328-Build558-INPLACE-CANDIDATE.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.328-Build558-INPLACE-CANDIDATE.apk > build/app/outputs/flutter-apk/NgelX-1.0.328-Build558-INPLACE-CANDIDATE.apk.sha256

      - name: Capture Build543 assembled candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build558-Assembled-Source
          path: |
            firestore.rules
            app/lib/
            app/android/app/src/main/kotlin/com/nnentx/ngelx_app/*.kt
            app/android/app/src/main/AndroidManifest.xml
            app/apk-signature.txt
            app/apk-badging.txt
          if-no-files-found: error
          retention-days: 4

      - name: Upload real-app install-over APK as review-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build558-REAL-INPLACE-SIGNED-REVIEW-ONLY
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.328-Build558-INPLACE-CANDIDATE.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.328-Build558-INPLACE-CANDIDATE.apk.sha256
          if-no-files-found: error
          retention-days: 4

      - name: Record candidate scope
        run: echo 'Signed APK candidate only; existing app is not auto-installed. No production services, billing, website, rules or data changed.'
