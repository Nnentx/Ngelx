name: Apply NgelX Build 295 Chat Media Fix

on:
  push:
    branches:
      - work/v72-combined
    paths:
      - 'tools/apply_v76_chat_media.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ngelx-build-295-chat-media
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sohbet medya yamasini uygula
        run: python3 tools/apply_v76_chat_media.py

      - name: Hedef degisiklikleri dogrula
        run: python3 tools/verify_v76_chat_media.py

      - name: Diff kontrolu
        run: git diff --check

      - name: Build 295 degisikliklerini kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/main.dart app/pubspec.yaml tools/verify_v64_app_quality.py tools/verify_v65_media_traffic.py tools/verify_v65_work.py tools/verify_v66_work.py tools/verify_v67_work.py tools/verify_v68_work.py tools/verify_v72_device_fixes.py
          if git diff --cached --quiet; then
            echo "Uygulanacak degisiklik bulunamadi."
            exit 1
          fi
          git commit -m "fix: repair chat image and video previews"
          git push
