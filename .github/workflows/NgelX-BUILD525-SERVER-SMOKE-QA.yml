name: NgelX Build525 Combined LiveKit Policy Smoke QA (no deploy)

on:
  push:
    branches:
      - qa/ngelx-build525-integrated-call-live-20261019
  pull_request:
    branches:
      - qa/ngelx-build524-live-comment-send-reliability-20261019
    paths:
      - 'server/livekit443/**'
      - 'tools/*525*'
      - '.github/workflows/NgelX-BUILD525-SERVER-SMOKE-QA.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-combination:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both group-kick and ten-guest authorization policies
        shell: bash
        run: |
          set -euo pipefail
          node --check server/livekit443/room-policy.mjs
          node --check server/livekit443/firestore-adapters.mjs
          node --check server/livekit443/room-policy.test.mjs
          node --check server/livekit443/firestore-adapters.test.mjs
          node --test server/livekit443/room-policy.test.mjs server/livekit443/firestore-adapters.test.mjs server/livekit443/live-moderation.test.mjs server/livekit443/live-moderation-adapters.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Confirm Build511 YAML parses, patches compile and staging is safe
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/NgelX-BUILD511-GIFTS-QA.yml')"
          python3 -m py_compile tools/apply_build517_group_call_stability.py tools/apply_build518_paginated_live_search.py tools/apply_build519_unified_photo_picker.py tools/apply_build520_livekit_android_pip.py tools/apply_build521_idempotent_gifts.py tools/apply_build524_comment_send_reliability.py tools/test_build525_integrated_qa.py
          grep -F "room.guestCapacityAllowed!==false" server/livekit443/room-policy.mjs
          grep -F "list(room.callKickedUids).includes(uid)" server/livekit443/room-policy.mjs
          echo 'No production write, deployment or secrets required.'
