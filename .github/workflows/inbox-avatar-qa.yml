name: NgelX Inbox and Avatar QA (no deploy)

on:
  pull_request:
    branches:
      - work/build-457-device-recovery
    paths:
      - 'app/lib/main.dart'
      - 'tools/verify_inbox_avatar_loading.py'
      - '.github/workflows/inbox-avatar-qa.yml'

permissions:
  contents: read

jobs:
  avatar-guards:
    name: Avatar and inbox static regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile stream retry and image cache behavior
        run: python3 tools/verify_inbox_avatar_loading.py

  flutter-analyze:
    name: Flutter analyzer for inbox patch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: Prepare Build457 generated Flutter sources (local only)
        run: python3 tools/prepare_build457_flutter_qa.py
      - name: Analyze Dart sources
        working-directory: app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test inbox behavior
        working-directory: app
        run: flutter test --timeout 60s test/build430_presence_test.dart
