name: NgelX V42 Tek Final Paket

on:
  workflow_dispatch:
  push:
    branches: [ngelx-v42-dev]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - '.github/workflows/build-v42-dev.yml'

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kalıcı imzayı hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NGELX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NGELX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NGELX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NGELX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kalıcı imza secret'ı yok; release APK debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/ngelx-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ngelx-release.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Release APK olustur
        working-directory: app
        run: flutter build apk --release

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V42-TEK-FINAL-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
