name: Ngel X v54 BUILD 339 LIVE CARD TAP DEDUPE

on:
  workflow_dispatch:
  push:
    branches:
      - work/build339-live-card-tap-dedupe
    paths:
      - '.github/workflows/NgelX-v54-BUILD-339-LIVE-CARD-TAP-DEDUPE.yml'
      - '.github/scripts/build339_live_card_patch.py'
      - 'app/lib/main.dart'
      - 'app/lib/live_broadcast_studio.dart'
      - 'app/pubspec.yaml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build339-live-card-tap-dedupe
          fetch-depth: 0

      - name: Build 339 kaynak duzeltmelerini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build339_live_card_patch.py
          python3 .github/scripts/build339_live_card_patch.py
          git diff --check

          grep -F "version: 1.0.120+339" app/pubspec.yaml
          grep -F "defaultValue: '1.0.120'" app/lib/main.dart
          grep -F "defaultValue: '339'" app/lib/main.dart

          # Build 339: sohbet canlı kartı tıklanabilir, canlı/bitmiş yayın davranışı güvenli.
          grep -F "Future<void> canliPaylasimMesajiniAc" app/lib/main.dart
          grep -F "onTap:canliPaylasimi" app/lib/main.dart
          grep -F "Yayına gitmek için dokun" app/lib/main.dart
          grep -F "ngelxCanliYayinaKatil(context,canliId)" app/lib/main.dart
          grep -F "Bu canlı yayın bitti." app/lib/main.dart

          # Build 339: aynı canlı için Aktivite kartı tekilleştirilir.
          grep -F "String _aktiviteTekilAnahtar" app/lib/main.dart
          grep -F "final gelenDocs=(s.data?.docs??[]).toList();" app/lib/main.dart
          grep -F "final tekil=<String,QueryDocumentSnapshot<Map<String,dynamic>>>{};" app/lib/main.dart
          grep -F "final tumDocs=tekil.values.toList()" app/lib/main.dart

          # Build 338 ve daha eski çalışan canlı omurgası korunmalı.
          grep -F "where('members',arrayContains:ben.uid).limit(100)" app/lib/live_broadcast_studio.dart
          grep -F "Aktivite ve Sohbet üzerinden gönderildi" app/lib/live_broadcast_studio.dart
          grep -F "'liveShare':true" app/lib/live_broadcast_studio.dart
          grep -F "'liveId':widget.belgeId" app/lib/live_broadcast_studio.dart
          grep -F "Overlay.of(context,rootOverlay:true)" app/lib/live_broadcast_studio.dart
          grep -F "lastLiveVisibility" app/lib/live_broadcast_studio.dart
          grep -F "sayac?.cancel();" app/lib/live_broadcast_studio.dart
          grep -F "where('toUid', isEqualTo: uid).limit(200).snapshots()" app/lib/main.dart
          grep -F "https://media.ngelxsocial.com" app/lib/main.dart
          grep -F "part 'live_pk.dart';" app/lib/main.dart

      - name: Build 339 kaynak commitini dala yaz
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/lib/main.dart app/pubspec.yaml; then
            echo "Kaynak zaten Build 339 seviyesinde."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/lib/main.dart app/pubspec.yaml
            git commit -m "Build 339: make live chat card tappable and dedupe activity"
            git push origin HEAD:work/build339-live-card-tap-dedupe
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.120-Build-339-LIVE-CARD-TAP-DEDUPE
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
