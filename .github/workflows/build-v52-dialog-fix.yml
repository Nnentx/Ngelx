name: NgelX V52 Dialog Lifecycle Fix

on:
  push:
    branches: [ngelx-v52-dialog-lifecycle-fix]
    paths:
      - 'app/**'
      - '.github/workflows/build-v52-dialog-fix.yml'
  workflow_dispatch:

concurrency:
  group: ngelx-v52-dialog-lifecycle-fix
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: R2 Worker saglik kontrolu
        run: curl --fail --silent --show-error https://ngelx-media.alihancaglar76.workers.dev/health

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Debug APK derle
        working-directory: app
        run: flutter build apk --debug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V52-DIALOG-FIX-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
