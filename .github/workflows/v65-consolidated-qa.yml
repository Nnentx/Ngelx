name: NgelX V68 Consolidated WORK QA

on:
  push:
    branches:
      - work/v65-consolidated-qa
      - work/v72-combined
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'tools/**'
      - 'firestore.rules'
      - '.github/workflows/v65-consolidated-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngelx-v68-consolidated-work-qa
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kilit dosyasi temizligini dogrula
        run: git diff --exit-code -- app/pubspec.lock

      - name: NgelX sozlesmesini dogrula
        run: python3 tools/verify_ngelx_contract.py

      - name: Onceki regresyon kontrolleri
        run: |
          python3 tools/verify_v61_group_qa.py
          python3 tools/verify_v62_performance.py
          python3 tools/verify_v63_input_performance.py
          python3 tools/verify_v64_app_quality.py

      - name: V65 WORK kontrolleri
        run: python3 tools/verify_v65_work.py

      - name: V66 test edilen WORK kontrolleri
        run: python3 tools/verify_v66_work.py

      - name: V67 cihaz testi düzeltmelerini dogrula
        run: python3 tools/verify_v67_work.py

      - name: V68 video yazi katmani kontrollerini dogrula
        run: python3 tools/verify_v68_work.py

      - name: V72 medya trafik optimizasyonlarini dogrula
        run: python3 tools/verify_v65_media_traffic.py

      - name: V72 cihaz testi düzeltmelerini dogrula
        run: python3 tools/verify_v72_device_fixes.py

      - name: R2 Worker JavaScript kontrolu
        run: node --check cloudflare/worker/src/index.js

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter testleri
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok."
          fi

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore kurallarini emulator ile test et
        run: |
          npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
          npx firebase emulators:exec --only firestore --project demo-ngelx "node tools/firestore_rules_test.mjs"

      - name: Sabit debug imzasini geri yukle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1

      - name: Sabit debug anahtari yoksa olustur
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Debug APK derle
        working-directory: app
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          BUILD_NAME="${APP_VERSION%%+*}"
          BUILD_NUMBER="${APP_VERSION##*+}"
          flutter build apk --debug \
            --dart-define=NGELX_VERSION_NAME="$BUILD_NAME" \
            --dart-define=NGELX_BUILD_NUMBER="$BUILD_NUMBER"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V72-COMBINED-WORK-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
