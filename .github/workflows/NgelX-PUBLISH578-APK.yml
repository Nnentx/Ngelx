name: Publish verified Build578 APK asset before updater switch
on:
  push:
    branches: [feat/build575-ludo-auto-premium-rewards]
    paths: ['.github/workflows/NgelX-PUBLISH578-APK.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: ngelx-build578-release-asset
  cancel-in-progress: false
jobs:
  publish-verified-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - name: Require exact Android and live acceptance; never mark physical tests as passed
        run: |
          set -euo pipefail
          gh run watch 40379566732 --repo Nnentx/Ngelx --exit-status --interval 20
          gh run watch 40379934754 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40379566732 --jq .head_sha)" = 389059e2227d94814bae7fc9f1f21cdee19e70ca
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40379934754 --jq .head_sha)" = 14c53d73daa841546e350b3e42489c9370a1879c
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40379566732 --jq .conclusion)" = success
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40379934754 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build578-Review-APK
          run-id: 40379566732
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate selected asset and prepare exact release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();digest=hashlib.sha256(raw).hexdigest()
          assert 40_000_000<len(raw)<100_000_000
          with zipfile.ZipFile(files[0]) as z:
            assert z.testzip() is None
            assert z.read('assets/flutter_assets/assets/ludo577_pawns.png')==Path('tools/assets/ludo577_pawns.png').read_bytes()
            assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          name='NgelX-1.0.348-Build578.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(digest+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.348','build':578,'size':len(raw),'sha256':digest,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.348-build578/'+name,'notes':'Ludo: Büyük taşlar yuvalarına tabanından oturur; yoldaki taşların başı kareden yukarı taşar. Daha seyrek toplanabilir zarlar; kesintisiz Auto; tamamlanan maçlarla artan XP/seviye. Yarım bırakılan maçlar ödüllendirilmez. Mevcut uygulama ve hesaplar korunur.','testedSource':'389059e2227d94814bae7fc9f1f21cdee19e70ca','buildRun':40379566732,'liveAcceptanceRun':40379934754}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('release-notes.md').write_text('NgelX 1.0.348 / Build578\n\nBüyük ve tabanından hizalanan Ludo taşları, seyrek ödül simgeleri, kalıcı Auto ve artan XP eşikleri.\n\nAndroid CI, aynı imza, paket/ABI, 142 sunucu testi ve gerçek Firebase/Cloudflare API kontrolleri doğrulandı. İki fiziksel Android cihazla uçtan uca test yapılmış değildir; görsel/oyun/ses kabulü uzaktan tamamlanmış sayılmaz. Ödüllü reklamlar kapalıdır; moderatör yetkisi normal kullanıcılara verilmez.\n\nMevcut uygulamanın üzerine kurulur; uygulamayı silmeyin.\n')
          print('Prepared exact APK bytes:',len(raw),'SHA-256:',digest)
          PY
      - name: Preserve tested source using trusted release workflow metadata
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/git/trees/main > trusted-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          trusted=next(e['sha'] for e in json.load(open('trusted-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'389059e2227d94814bae7fc9f1f21cdee19e70ca','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE578_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('release-tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input release-tree.json > release-tree-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('release-commit.json').write_text(json.dumps({'message':'Build578 verified APK source snapshot; physical device acceptance not claimed','tree':json.load(open('release-tree-result.json'))['sha'],'parents':['389059e2227d94814bae7fc9f1f21cdee19e70ca']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input release-commit.json > release-commit-result.json
      - name: Publish exact verified APK and verify anonymous download bytes
        run: |
          set -euo pipefail
          if gh release view v1.0.348-build578 >/dev/null 2>&1; then
            gh release download v1.0.348-build578 --pattern NgelX-1.0.348-Build578.apk --dir existing
            cmp NgelX-1.0.348-Build578.apk existing/NgelX-1.0.348-Build578.apk
          else
            target=$(python3 -c "import json;print(json.load(open('release-commit-result.json'))['sha'])")
            gh release create v1.0.348-build578 NgelX-1.0.348-Build578.apk NgelX-1.0.348-Build578.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.348 / Build578' --notes-file release-notes.md
          fi
          curl --fail --location --retry 3 --silent --show-error https://github.com/Nnentx/Ngelx/releases/download/v1.0.348-build578/NgelX-1.0.348-Build578.apk --output public-download.apk
          cmp NgelX-1.0.348-Build578.apk public-download.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build578-Verified-Release-Metadata
          path: android-update.json
