name: Apply Build 299 source candidate

on:
  push:
    branches:
      - work/build-299-release
    paths:
      - .github/workflows/apply-build-299-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build-299-release
          fetch-depth: 0
      - name: Apply Build 299 source patch
        run: |
          git apply --check --exclude=.github/workflows/build-299-release.yml tools/build_299_release.patch
          git apply --exclude=.github/workflows/build-299-release.yml tools/build_299_release.patch
      - name: Verify source contracts
        run: |
          for test_file in tools/verify_*.py; do
            if [ "$test_file" != "tools/verify_build_299_release.py" ]; then
              python3 "$test_file"
            fi
          done
          node --check cloudflare/worker/src/index.js
      - name: Commit Build 299 source candidate
        run: |
          git config user.name "ngelx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart app/pubspec.yaml tools
          git commit -m "release: prepare NgelX 1.0.80 Build 299"
          git push origin work/build-299-release
