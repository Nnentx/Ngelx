name: NgelX Build580 Ludo feedback QA
on:
  push:
    branches: [qa/ludo-feedback-20261026]
    paths:
      - 'tools/**'
      - 'server/ludo565/**'
      - 'cloudflare/live-moderation/**'
      - '.github/workflows/NgelX-BUILD580-FEEDBACK-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-build580-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs
  android-review:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build579-Assembled-Source
          run-id: 40386052388
          github-token: ${{ github.token }}
          path: assembled
      - name: Apply isolated feedback patch to verified Build579
        run: |
          cp -a assembled/. app/
          python3 tools/apply_build580_ludo.py
          python3 tools/apply_build580_ludo.py
          mkdir -p app/test
          cp tools/build570_join_test.dart tools/build570_perf_test.dart tools/build572_fast_visual_test.dart tools/build575_widget_test.dart tools/build577_widget_test.dart tools/build579_invite_test.dart tools/build580_feedback_test.dart app/test/
      - run: flutter pub get
        working-directory: app
      - name: Analyze complete app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Ludo old and new behavior and widget regressions
        run: timeout --signal=TERM --kill-after=10s 240s flutter test --concurrency=1 --timeout=35s --reporter expanded test/build570_join_test.dart test/build570_perf_test.dart test/build572_fast_visual_test.dart test/build575_widget_test.dart test/build577_widget_test.dart test/build579_invite_test.dart test/build580_feedback_test.dart
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build580-Flutter-Previews
          path: app/build580-previews/
          if-no-files-found: warn
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Build signed review APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.350 --build-number=580 --dart-define=NGELX_VERSION_NAME=1.0.350 --dart-define=NGELX_BUILD_NUMBER=580 --dart-define=NGELX_VERIFICATION_EMAIL_URL=https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > signature.txt
          grep -iF 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' signature.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.350-Build580-REVIEW.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.350-Build580-REVIEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build580-Review-APK
          path: app/build/app/outputs/flutter-apk/NgelX-1.0.350-Build580-REVIEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build580-Assembled-Source
          path: |
            app/lib
            app/pubspec.yaml
            app/pubspec.lock
            app/assets/
            app/android/app/src/main/
            app/android/app/build.gradle.kts
            app/android/app/google-services.json
            app/android/build.gradle.kts
            app/android/settings.gradle.kts
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties
