name: NgelX Build448 verified call and live backend
on:
  workflow_dispatch:
  push:
    branches: [work/build-448-device-live-fixes]
    paths: ['.github/workflows/NgelX-BUILD448-BACKEND.yml']
concurrency:
  group: ngelx448-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install google-auth requests
      - run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - run: node --test server/livekit441/token-endpoint.test.mjs server/livekit443/*.test.mjs server/calls448/*.test.mjs
      - name: Wait for exact app candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_build448_candidate.py
      - name: Apply tested minimal rules and deploy call and live functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python3 tools/deploy_build448_minimal_rules.py
          python3 tools/deploy_build448_functions.py
      - uses: actions/upload-artifact@v4
        with:
          name: Build448-tested-live-rules
          path: firestore.rules
