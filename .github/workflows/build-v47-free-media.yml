name: NgelX V47 Free Media

on:
  push:
    branches: [ngelx-v47-free-media-final]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'infra/cloudflare-r2/**'
      - '.github/workflows/build-v47-free-media.yml'
  workflow_dispatch:

concurrency:
  group: ngelx-v47-free-media
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Debug APK derle
        working-directory: app
        env:
          NGELX_MEDIA_API_BASE: ${{ vars.NGELX_MEDIA_API_BASE }}
        run: flutter build apk --debug --dart-define=NGELX_MEDIA_API_BASE="$NGELX_MEDIA_API_BASE"

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V47-FREE-MEDIA-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
