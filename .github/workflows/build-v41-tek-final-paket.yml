          tar -xzf /tmp/ngelx-final.tar.gz
          rm /tmp/ngelx-final.tar.gz

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kalıcı imzayı hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NGELX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NGELX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NGELX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NGELX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kalıcı imza secret'ı yok; bu deneme APK'sı debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/ngelx-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ngelx-release.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties

      - name: Bağımlılıkları ve kodu doğrula
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/main.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Release APK üret
        working-directory: app
        run: flutter build apk --release

      - name: APK yapısını doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -gt 5000000
          sha256sum "$APK" | tee app/build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Firestore ve bağlantı sitesini yayınla
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN yok; kurallar ve hosting bu çalıştırmada yayınlanmadı."
            exit 0
          fi
          npx --yes firebase-tools deploy --project ngelx-44eed --only firestore:rules,hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v41-TEK-FINAL-APK
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
