name: NgelX BUILD 435 MEDIA CLEANUP

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-430-46-followup
    paths:
      - 'tools/*435*'
      - '.github/workflows/NgelX-BUILD-435-CLEANUP.yml'

concurrency:
  group: ngelx-build433-inbox-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
