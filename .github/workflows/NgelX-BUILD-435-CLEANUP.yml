      - name: Build435 durable message and server cleanup
        run: |
          python3 tools/apply_build435_cleanup.py
          python3 -m unittest discover -s tools -p 'test_*cleanup*.py'

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          nl -ba lib/main.dart | sed -n '10972,11002p'
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build 430 presence behavior tests
        working-directory: app
        run: |
          cp ../tools/build431_notification_test.dart test/build431_notification_test.dart
          cp ../tools/build432_behavior_test.dart test/build432_behavior_test.dart
          cp ../tools/build433_behavior_test.dart test/build433_behavior_test.dart
          cp ../tools/build434_behavior_test.dart test/build434_behavior_test.dart
          cp ../tools/build435_behavior_test.dart test/build435_behavior_test.dart
          timeout 300s flutter test --reporter expanded --timeout 60s test/build430_presence_test.dart test/build431_notification_test.dart test/build432_behavior_test.dart test/build433_behavior_test.dart test/build434_behavior_test.dart test/build435_behavior_test.dart

      - name: Node 24 Firebase test ortami
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java 21 Firebase emulator ortami
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

