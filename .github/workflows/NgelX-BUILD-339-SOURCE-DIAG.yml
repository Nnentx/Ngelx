name: Ngel X BUILD 339 SOURCE DIAG

on:
  workflow_dispatch:
  push:
    branches:
      - work/build339-live-card-tap-dedupe
    paths:
      - '.github/workflows/NgelX-BUILD-339-SOURCE-DIAG.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build339-live-card-tap-dedupe
          fetch-depth: 0
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp app/lib/main.dart /tmp/main.dart
          cp app/lib/live_broadcast_studio.dart /tmp/live_broadcast_studio.dart
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build-339-source-snapshot
          path: |
            /tmp/main.dart
            /tmp/live_broadcast_studio.dart
          if-no-files-found: error
          retention-days: 2
