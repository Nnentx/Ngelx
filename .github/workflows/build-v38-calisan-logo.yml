            }

            @override
            Widget build(BuildContext context) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  satir(context, id, veri, zaman),
                  if (yanitlar.isNotEmpty)
                    Padding(
                      padding: const EdgeInsets.only(left: 52),
                      child: TextButton(
