name: NgelX v38 CALISAN + YENI LOGO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v38-calisan-logo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bugunku logoyu sakla ve calisan tabani geri al
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/lib/main.dart').read_text(encoding='utf-8')

          def matching_brace(text, open_pos):
              depth = 0
              quote = None
              i = open_pos
              while i < len(text):
                  if quote is not None:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                  elif text[i] in ("'", '"'):
                      quote = text[i]
                  elif text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('Logo sinifi kapanisi bulunamadi')

          def take_class(name):
              start = source.index(f'class {name}')
              end = matching_brace(source, source.index('{', start)) + 1
              return source[start:end]

          logo = take_class('Logo') + '\n\n' + take_class('_YorungeCizici')
          logo = logo.replace(
              'final bool kucuk;\n\n  const Logo({super.key, this.kucuk = false});',
              'final bool kucuk;\n  final bool koyuZemin;\n\n  const Logo({super.key, this.kucuk = false, this.koyuZemin = false});',
          )
          Path('/tmp/ngelx_today_logo.dart').write_text(logo, encoding='utf-8')
          PY
          git checkout 8dc9a87be8ef98bab844d75bf9f45dc9adb8c73b -- app/lib/main.dart app/pubspec.yaml

      - name: v34 tabanini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-v34-akis-final-verified.yml').read_text()

          def extract_run(step_name):
              lines = workflow.splitlines()
              target = f'      - name: {step_name}'
              if target not in lines:
                  raise SystemExit(f'v34 adimi bulunamadi: {step_name}')
              i = lines.index(target) + 1
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f'run blogu bulunamadi: {step_name}')
              i += 1
              script = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      script.append(line[10:])
                  elif line.strip() == '':
                      script.append('')
                  else:
                      break
                  i += 1
              return '\n'.join(script) + '\n'

          script = extract_run('v31 dogrulanmis adimlarini ve final duzeltmeyi uygula')
          subprocess.run(['bash'], input=script, text=True, check=True)
          PY

      - name: Paylasim yorum silme profil beyaz menu FIX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/main.dart')
          s = path.read_text(encoding='utf-8')

          def matching_brace(text, open_pos):
              depth = 0
              i = open_pos
              quote = None
              line_comment = False
              block_comment = 0
              while i < len(text):
                  if line_comment:
                      if text[i] == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if text.startswith('/*', i):
                          block_comment += 1
                          i += 2
                          continue
                      if text.startswith('*/', i):
                          block_comment -= 1
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote is not None:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('//', i):
                      line_comment = True
                      i += 2
                      continue
                  if text.startswith('/*', i):
                      block_comment = 1
                      i += 2
                      continue
                  if text[i] in ("'", '"'):
                      quote = text[i]
                      i += 1
                      continue
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def class_bounds(text, class_name):
              start = text.find(f'class {class_name}')
              if start < 0:
                  raise SystemExit(f'class bulunamadi: {class_name}')
              open_pos = text.find('{', start)
              close_pos = matching_brace(text, open_pos)
              if close_pos < 0:
                  raise SystemExit(f'class kapanisi bulunamadi: {class_name}')
              return start, close_pos + 1

          def replace_method(class_name, marker, new_code):
              global s
              cs, ce = class_bounds(s, class_name)
              region = s[cs:ce]
              pos = region.find(marker)
              if pos < 0:
                  raise SystemExit(f'{class_name} icinde method bulunamadi: {marker}')
              line_start = region.rfind('\n', 0, pos) + 1
              open_pos = region.find('{', pos)
              close_pos = matching_brace(region, open_pos)
              if close_pos < 0:
                  raise SystemExit(f'method kapanisi bulunamadi: {class_name}/{marker}')
              region = region[:line_start] + new_code.rstrip() + region[close_pos + 1:]
              s = s[:cs] + region + s[ce:]

          def replace_global_method(marker, new_code):
              global s
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit(f'global method bulunamadi: {marker}')
              line_start = s.rfind('\n', 0, pos) + 1
              open_pos = s.find('{', pos)
              close_pos = matching_brace(s, open_pos)
              if close_pos < 0:
                  raise SystemExit(f'global method kapanisi bulunamadi: {marker}')
              s = s[:line_start] + new_code.rstrip() + s[close_pos + 1:]

          if "package:flutter/services.dart" not in s:
              anchor = "import 'package:flutter/material.dart';"
              if anchor not in s:
                  raise SystemExit('material import bulunamadi')
              s = s.replace(anchor, anchor + "\nimport 'package:flutter/services.dart';", 1)

          if "const ngelxWebAdresi =" not in s:
              anchor = "const panel = Color(0xFF17171F);"
              if anchor not in s:
                  raise SystemExit('panel sabiti bulunamadi')
              s = s.replace(anchor, anchor + "\nconst ngelxWebAdresi = 'https://ngelxsocial.com';", 1)

          helpers = r'''
          String ngelxIcerikLink(String id) => '$ngelxWebAdresi/p/$id';

          Future<void> ngelxIcerikGizle(BuildContext context, String id, {bool ilgilenmiyorum = false}) async {
            final u = FirebaseAuth.instance.currentUser;
            if (u == null || id.isEmpty) return;
            if (u.isAnonymous) {
              await misafirEngeli(context);
              return;
            }
            try {
              final alan = ilgilenmiyorum ? 'notInterestedIds' : 'hiddenContent';
              await FirebaseFirestore.instance.collection('users').doc(u.uid).set({
                alan: FieldValue.arrayUnion([id]),
              }, SetOptions(merge: true));
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                  content: Text(ilgilenmiyorum
                      ? 'Benzer içerikler azaltılacak.'
                      : 'İçerik akışından gizlendi.'),
                ));
              }
            } catch (e) {
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('İşlem tamamlanamadı: $e')),
                );
              }
            }
          }

