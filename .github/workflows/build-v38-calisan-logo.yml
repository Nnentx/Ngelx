                        final docs = snap.data?.docs ?? const [];
                        final secili = aktifUid != null && docs.any((d) => d.id == aktifUid);
                        final sayi = docs.length;
                        return GestureDetector(
                          onTap: () => begen(yorumId, const []),
                          child: Column(
                            children: [
