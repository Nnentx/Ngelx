                      ),
                    ),
                  if (acik)
                    ...yanitlar.map(
                      (d) => satir(
                        context,
                        d.id,
                        d.data(),
                        zamanYaz(d.data()['createdAt']),
                        yanit: true,
                      ),
                    ),
                ],
              );
            }
          }'''
          s = s[:ys] + new_yorum_class + s[ye:]

          call_anchor = "return YorumKarti(\n                                id: d.id,"
          if call_anchor not in s:
              raise SystemExit('YorumKarti cagrisi bulunamadi')
          s = s.replace(
              call_anchor,
