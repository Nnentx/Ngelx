                  s = s[:ks] + region + s[ke:]

          path.write_text(s, encoding='utf-8')
          print('v36 saglam yama tamamlandi')
          PY

      - name: Bugunku yeni logoyu calisan surume uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/main.dart')
          source = path.read_text(encoding='utf-8')

          def matching_brace(text, open_pos):
              depth = 0
              quote = None
              i = open_pos
              while i < len(text):
                  if quote is not None:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                  elif text[i] in ("'", '"'):
                      quote = text[i]
                  elif text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('Logo sinifi kapanisi bulunamadi')

          start = source.index('class Logo')
          end = matching_brace(source, source.index('{', start)) + 1
          logo = Path('/tmp/ngelx_today_logo.dart').read_text(encoding='utf-8')
          source = source[:start] + logo + source[end:]
          path.write_text(source, encoding='utf-8')

          pubspec = Path('app/pubspec.yaml')
          pub = pubspec.read_text(encoding='utf-8')
          pub = pub.replace('version: 1.0.19+194', 'version: 1.0.20+195')
          pubspec.write_text(pub, encoding='utf-8')
          print('Calisan v36 tabani + bugunku logo birlestirildi')
          PY

      - name: Kodu dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          dart format lib/main.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: APK artifactini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v38-CALISAN-YENI-LOGO
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
