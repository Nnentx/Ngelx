name: NgelX v25 AKIS FINAL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v25-akis-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: v20 temel tasarimini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-v20-final-ui.yml').read_text(encoding='utf-8')

          def run_step(step_name):
              lines = workflow.splitlines()
              target = f'      - name: {step_name}'
              if target not in lines:
                  raise SystemExit(f'v20 adimi bulunamadi: {step_name}')
              i = lines.index(target) + 1
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f'run blogu bulunamadi: {step_name}')
              i += 1
              script = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      script.append(line[10:])
                  elif line.strip() == '':
                      script.append('')
                  else:
                      break
                  i += 1
              code = '\n'.join(script) + '\n'
              subprocess.run(['bash'], input=code, text=True, check=True)

          run_step('Yeni logoyu ve cok dilli girisi uygula')
          run_step('Akis Kesfet Uret final tasarimini uygula')
          PY

      - name: Akis ve Uret gorunurluk duzeltmeleri
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          main = Path('app/lib/main.dart')
          text = main.read_text(encoding='utf-8')

          logo_pattern = re.compile(
              r"class Logo extends StatelessWidget \{.*?\nclass RenkliButon extends StatelessWidget \{",
              re.S,
          )
          logo_replacement = textwrap.dedent(r'''class Logo extends StatelessWidget {
            final bool kucuk;
            final bool koyuZemin;
          
            const Logo({
              super.key,
              this.kucuk = false,
              this.koyuZemin = false,
            });
          
            @override
            Widget build(BuildContext context) {
              if (kucuk) {
                final yaziRengi =
          koyuZemin ? Colors.white : const Color(0xFF07142E);
                return SizedBox(
                  height: 30,
                  child: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            ClipRect(
              child: Align(
                alignment: Alignment.centerLeft,
                widthFactor: .47,
                child: Image.asset(
                  'assets/ngelx_logo_horizontal.png',
                  height: 29,
                  fit: BoxFit.contain,
                ),
              ),
            ),
            const SizedBox(width: 4),
            Text.rich(
              TextSpan(
                children: [
                  TextSpan(
                    text: 'Ngel',
                    style: TextStyle(
                      color: yaziRengi,
                      fontSize: 18,
                      fontWeight: FontWeight.w900,
                      letterSpacing: -1,
                    ),
                  ),
                  const TextSpan(
                    text: 'X',
                    style: TextStyle(
                      color: Color(0xFF19C7F2),
                      fontSize: 19,
                      fontWeight: FontWeight.w900,
                      letterSpacing: -1,
                    ),
                  ),
                ],
              ),
            ),
          ],
                  ),
                );
              }
          
              return Center(
                child: Image.asset(
                  'assets/ngelx_logo.png',
                  width: 165,
                  height: 165,
                  fit: BoxFit.contain,
                ),
              );
            }
          }
          
          class RenkliButon extends StatelessWidget {''')

          text, n = logo_pattern.subn(logo_replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Logo sinifi duzeltilemedi: {n}')

          old = 'const Logo(kucuk: true)'
          new = 'const Logo(kucuk: true, koyuZemin: true)'
          if old not in text:
              raise SystemExit('Akis ust logosu bulunamadi')
          text = text.replace(old, new, 1)

          replacements = {
              "const Text('Yeni içerik üret', textAlign: TextAlign.center, style: TextStyle(fontSize: 27, fontWeight: FontWeight.w900))":
                  "const Text('Yeni içerik üret', textAlign: TextAlign.center, style: TextStyle(color: Colors.black, fontSize: 27, fontWeight: FontWeight.w900))",
              "Text(yazi, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold))":
                  "Text(yazi, style: const TextStyle(color: Colors.black87, fontSize: 12, fontWeight: FontWeight.bold))",
              "Text(yazi, style: const TextStyle(fontWeight: FontWeight.bold))":
                  "Text(yazi, style: const TextStyle(color: Colors.black87, fontWeight: FontWeight.bold))",
              "Text(yazi, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w900))":
                  "Text(yazi, style: const TextStyle(color: Colors.black87, fontSize: 18, fontWeight: FontWeight.w900))",
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          main.write_text(text, encoding='utf-8')

          pub = Path('app/pubspec.yaml')
          pub_text = pub.read_text(encoding='utf-8')
          pub_text = re.sub(
              r'^version:\s*[^\n]+$',
              'version: 1.0.13+188',
              pub_text,
              count=1,
              flags=re.M,
          )
          pub.write_text(pub_text, encoding='utf-8')
          PY


      - name: Yorum begeni dis gorunumlerini duzelt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          main = Path('app/lib/main.dart')
          text = main.read_text(encoding='utf-8')

          # Akış fotoğraf/yazı kartı: ses satırının hemen altına
          # beğeni + yorum bilgisini ekle.
          gorsel_pattern = re.compile(
              r"(if\s*\(\(widget\.veri\['audioUrl'\]\s*\?\?\s*''\)\.isNotEmpty\)\s*\.\.\.\["
              r"const SizedBox\(height:\s*8\),\s*const Row\(children:\s*\["
              r"Icon\(Icons\.music_note,\s*size:\s*18\),\s*Text\(' Fotoğraflı müzik'\)\]\)\],)"
          )
          gorsel_insert = r"""\1
              const SizedBox(height: 8),
              Row(children: [
                const Icon(Icons.favorite_rounded, size: 16, color: Colors.white),
                const SizedBox(width: 5),
                Text('$begeniSayisi beğeni', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w700)),
                const SizedBox(width: 13),
                const Icon(Icons.mode_comment_outlined, size: 16, color: Colors.white),
                const SizedBox(width: 5),
                GestureDetector(
                  onTap: yorumlariAc,
                  child: Text('$yorumSayisi yorum', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w700)),
                ),
              ]),
              if (yorumSayisi > 0) ...[
                const SizedBox(height: 5),
                GestureDetector(
                  onTap: yorumlariAc,
                  child: const Text('Yorumları gör', style: TextStyle(color: Colors.white70, fontSize: 12, fontWeight: FontWeight.w700)),
                ),
              ],"""
          text, n1 = gorsel_pattern.subn(gorsel_insert, text, count=1)
          if n1 != 1:
              raise SystemExit(f'Gorsel/yazi akis etkileşim alani duzeltilemedi: {n1}')

          # Video akışı: özgün ses satırının altına beğeni + yorum bilgisi.
          video_pattern = re.compile(
              r"(const Row\(\s*children:\s*\[\s*"
              r"Icon\(Icons\.graphic_eq,\s*size:\s*17\),\s*"
              r"SizedBox\(width:\s*6\),\s*"
              r"Text\('NgelX • Özgün ses'\),\s*"
              r"\],\s*\),)"
          )
          video_insert = r"""\1
                const SizedBox(height: 8),
                Row(children: [
                  const Icon(Icons.favorite_rounded, size: 16, color: Colors.white),
                  const SizedBox(width: 5),
                  Text('$begeniSayisi beğeni', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w700)),
                  const SizedBox(width: 13),
                  const Icon(Icons.mode_comment_outlined, size: 16, color: Colors.white),
                  const SizedBox(width: 5),
                  GestureDetector(
                    onTap: yorumlariAc,
                    child: Text('$yorumSayisi yorum', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w700)),
                  ),
                ]),
                if (yorumSayisi > 0) ...[
                  const SizedBox(height: 5),
                  GestureDetector(
                    onTap: yorumlariAc,
                    child: const Text('Yorumları gör', style: TextStyle(color: Colors.white70, fontSize: 12, fontWeight: FontWeight.w700)),
                  ),
                ],"""
          text, n2 = video_pattern.subn(video_insert, text, count=1)
          if n2 != 1:
              raise SystemExit(f'Video akis etkileşim alani duzeltilemedi: {n2}')

          # Ben/Profil ızgarası: her içerik kartının altına canlı sayaç rozeti.
          profil_pattern = re.compile(
              r"return\s+GestureDetector\("
              r"onTap:\(\)=>icerigiAc\(belge\),"
              r"onLongPress:\(\)=>icerikMenusu\(belge\),"
              r"child:MedyaOnizleme\(\s*"
              r"tur:\s*tur,\s*"
              r"url:\s*url,\s*"
              r"yazi:\s*\(v\['description'\]\s*\?\?\s*''\)\.toString\(\),\s*"
              r"arkaPlan:\s*i\.isEven\s*\?\s*const Color\(0xFF28233F\)\s*:\s*const Color\(0xFF173036\),\s*"
              r"\)\);",
              re.S,
          )
          profil_replacement = """return GestureDetector(
                      onTap:()=>icerigiAc(belge),
                      onLongPress:()=>icerikMenusu(belge),
                      child:Stack(
                        fit:StackFit.expand,
                        children:[
                          MedyaOnizleme(
                            tur: tur,
                            url: url,
                            yazi: (v['description'] ?? '').toString(),
                            arkaPlan: i.isEven ? const Color(0xFF28233F) : const Color(0xFF173036),
                          ),
                          Positioned(
                            left:6,
                            right:6,
                            bottom:6,
                            child:_ProfilEtkilesimRozeti(videoId:belge.id),
                          ),
                        ],
                      ),
                    );"""
          text, n3 = profil_pattern.subn(profil_replacement, text, count=1)
          if n3 != 1:
              raise SystemExit(f'Profil gonderi izgara alani duzeltilemedi: {n3}')

          widget_code = textwrap.dedent(r"""
          class _ProfilEtkilesimRozeti extends StatelessWidget {
            final String videoId;
            const _ProfilEtkilesimRozeti({required this.videoId});

            @override
            Widget build(BuildContext context) {
              final ref = FirebaseFirestore.instance.collection('videos').doc(videoId);
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                decoration: BoxDecoration(
                  color: Colors.black.withValues(alpha: .62),
                  borderRadius: BorderRadius.circular(12),
                ),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceAround,
                  children: [
                    StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                      stream: ref.collection('likes').snapshots(),
                      builder: (_, s) => Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.favorite_rounded, color: Colors.white, size: 15),
                          const SizedBox(width: 4),
                          Text(
                            '${s.data?.docs.length ?? 0}',
                            style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w800),
                          ),
                        ],
                      ),
                    ),
                    StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                      stream: ref.collection('comments').snapshots(),
                      builder: (_, s) => Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.mode_comment_rounded, color: Colors.white, size: 15),
                          const SizedBox(width: 4),
                          Text(
                            '${s.data?.docs.length ?? 0}',
                            style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w800),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          """)

          marker = '\nclass _ProfilSekme extends StatelessWidget'
          if marker not in text:
              raise SystemExit('Profil widget ekleme noktasi bulunamadi')
          text = text.replace(marker, '\n' + widget_code + marker, 1)

          main.write_text(text, encoding='utf-8')

          pub = Path('app/pubspec.yaml')
          pub_text = pub.read_text(encoding='utf-8')
          pub_text = re.sub(
              r'^version:\s*[^\n]+$',
              'version: 1.0.13+188',
              pub_text,
              count=1,
              flags=re.M,
          )
          pub.write_text(pub_text, encoding='utf-8')
          PY


      - name: Akis yorum begeni sayaclarini canli yap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          main = Path('app/lib/main.dart')
          text = main.read_text(encoding='utf-8')

          helper = textwrap.dedent(r"""
          class CanliSayacButonu extends StatelessWidget {
            final CollectionReference<Map<String, dynamic>> ref;
            final IconData ikon;
            final VoidCallback tiklama;
            final Color renk;

            const CanliSayacButonu({
              super.key,
              required this.ref,
              required this.ikon,
              required this.tiklama,
              this.renk = Colors.white,
            });

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                stream: ref.snapshots(),
                builder: (_, snap) => IslemButonu(
                  ikon: ikon,
                  yazi: '${snap.data?.docs.length ?? 0}',
                  renk: renk,
                  tiklama: tiklama,
                ),
              );
            }
          }

          class CanliEtkilesimOzet extends StatelessWidget {
            final String icerikId;
            final VoidCallback yorumlariAc;

            const CanliEtkilesimOzet({
              super.key,
              required this.icerikId,
              required this.yorumlariAc,
            });

            @override
            Widget build(BuildContext context) {
              final ref = FirebaseFirestore.instance.collection('videos').doc(icerikId);
              return Row(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                    stream: ref.collection('likes').snapshots(),
                    builder: (_, snap) => Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.favorite_rounded, size: 16, color: Colors.white),
                        const SizedBox(width: 5),
                        Text(
                          '${snap.data?.docs.length ?? 0} beğeni',
                          style: const TextStyle(
                            color: Colors.white,
                            fontSize: 12,
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(width: 13),
                  Expanded(
                    child: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                      stream: ref.collection('comments').snapshots(),
                      builder: (_, snap) {
                        final sayi = snap.data?.docs.length ?? 0;
                        return GestureDetector(
                          onTap: yorumlariAc,
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.mode_comment_outlined, size: 16, color: Colors.white),
                                  const SizedBox(width: 5),
                                  Text(
                                    '$sayi yorum',
                                    style: const TextStyle(
                                      color: Colors.white,
                                      fontSize: 12,
                                      fontWeight: FontWeight.w700,
                                    ),
                                  ),
                                ],
                              ),
                              if (sayi > 0) ...[
                                const SizedBox(height: 4),
                                const Text(
                                  'Yorumları gör',
                                  style: TextStyle(
                                    color: Colors.white70,
                                    fontSize: 12,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                              ],
                            ],
                          ),
                        );
                      },
                    ),
                  ),
                ],
              );
            }
          }

          """)

          marker = '\nclass IslemButonu extends StatelessWidget'
          if marker not in text:
              raise SystemExit('IslemButonu ekleme noktasi bulunamadi')
          text = text.replace(marker, '\n' + helper + marker, 1)

          # Görsel/yazı kartındaki sağ sayaçları canlı yap.
          g_like = re.compile(
              r"IslemButonu\(ikon:\s*begenildi\s*\?\s*Icons\.favorite\s*:\s*Icons\.favorite_border,\s*"
              r"yazi:\s*'\$begeniSayisi',\s*renk:\s*begenildi\s*\?\s*Colors\.pinkAccent\s*:\s*Colors\.white,\s*"
              r"tiklama:\s*begeniyiDegistir\)"
          )
          text, n1 = g_like.subn(
              "CanliSayacButonu(ref: FirebaseFirestore.instance.collection('videos').doc(icerikId).collection('likes'), ikon: begenildi ? Icons.favorite : Icons.favorite_border, renk: begenildi ? Colors.pinkAccent : Colors.white, tiklama: begeniyiDegistir)",
              text,
              count=1,
          )
          g_comment = re.compile(
              r"IslemButonu\(ikon:\s*Icons\.mode_comment_outlined,\s*yazi:\s*'\$yorumSayisi',\s*tiklama:\s*yorumlariAc\)"
          )
          text, n2 = g_comment.subn(
              "CanliSayacButonu(ref: FirebaseFirestore.instance.collection('videos').doc(icerikId).collection('comments'), ikon: Icons.mode_comment_outlined, tiklama: yorumlariAc)",
              text,
              count=1,
          )

          # Video kartındaki sağ sayaçları canlı yap.
          v_like = re.compile(
              r"IslemButonu\(\s*ikon:\s*begenildi\s*\?\s*Icons\.favorite\s*:\s*Icons\.favorite_border,\s*"
              r"yazi:\s*'\$begeniSayisi',\s*renk:\s*begenildi\s*\?\s*Colors\.pinkAccent\s*:\s*Colors\.white,\s*"
              r"tiklama:\s*begeniyiDegistir,\s*\)",
              re.S,
          )
          text, n3 = v_like.subn(
              """CanliSayacButonu(
                  ref: FirebaseFirestore.instance.collection('videos').doc(videoId).collection('likes'),
                  ikon: begenildi ? Icons.favorite : Icons.favorite_border,
                  renk: begenildi ? Colors.pinkAccent : Colors.white,
                  tiklama: begeniyiDegistir,
                )""",
              text,
              count=1,
          )
          v_comment = re.compile(
              r"IslemButonu\(\s*ikon:\s*Icons\.mode_comment_outlined,\s*"
              r"yazi:\s*'\$yorumSayisi',\s*tiklama:\s*yorumlariAc,\s*\)",
              re.S,
          )
          text, n4 = v_comment.subn(
              """CanliSayacButonu(
                  ref: FirebaseFirestore.instance.collection('videos').doc(videoId).collection('comments'),
                  ikon: Icons.mode_comment_outlined,
                  tiklama: yorumlariAc,
                )""",
              text,
              count=1,
          )

          if (n1, n2, n3, n4) != (1, 1, 1, 1):
              raise SystemExit(f'Canli sag sayaclar duzeltilemedi: {(n1, n2, n3, n4)}')

          # v23'ün eklediği alttaki özetleri de canlı sayaç widget'ına çevir.
          ozet_pattern = re.compile(
              r"const SizedBox\(height:\s*8\),\s*"
              r"Row\(children:\s*\[\s*"
              r"const Icon\(Icons\.favorite_rounded.*?"
              r"if \(yorumSayisi > 0\) \.\.\.\[\s*"
              r"const SizedBox\(height:\s*5\),\s*"
              r"GestureDetector\(\s*onTap:\s*yorumlariAc,\s*"
              r"child:\s*const Text\('Yorumları gör'.*?\),\s*\),\s*\],",
              re.S,
          )

          # İlk eşleşme görsel/yazı kartı, ikincisi video kartı.
          text, m1 = ozet_pattern.subn(
              "const SizedBox(height: 8),\n              CanliEtkilesimOzet(icerikId: icerikId, yorumlariAc: yorumlariAc),",
              text,
              count=1,
          )
          text, m2 = ozet_pattern.subn(
              "const SizedBox(height: 8),\n                CanliEtkilesimOzet(icerikId: videoId, yorumlariAc: yorumlariAc),",
              text,
              count=1,
          )

          if (m1, m2) != (1, 1):
              raise SystemExit(f'Canli ozetler duzeltilemedi: {(m1, m2)}')

          main.write_text(text, encoding='utf-8')

          pub = Path('app/pubspec.yaml')
          pub_text = pub.read_text(encoding='utf-8')
          pub_text = re.sub(
              r'^version:\s*[^\n]+$',
              'version: 1.0.13+188',
              pub_text,
              count=1,
              flags=re.M,
          )
          pub.write_text(pub_text, encoding='utf-8')
          PY


      - name: Akis final ozelliklerini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          main = Path('app/lib/main.dart')
          text = main.read_text(encoding='utf-8')

          # ------------------------------------------------------------
          # 1) Ortak yardımcılar: kalp animasyonu + zaman + son yorum
          # ------------------------------------------------------------
          helpers = textwrap.dedent(r"""
          String akisKisaZaman(dynamic ham) {
            if (ham is! Timestamp) return 'Şimdi';
            final fark = DateTime.now().difference(ham.toDate());
            if (fark.inSeconds < 45) return 'Şimdi';
            if (fark.inMinutes < 60) return '${fark.inMinutes} dk önce';
            if (fark.inHours < 24) return '${fark.inHours} sa önce';
            if (fark.inDays == 1) return 'Dün';
            if (fark.inDays < 7) return '${fark.inDays} gün önce';
            final d = ham.toDate();
            return '${d.day}.${d.month}.${d.year}';
          }

          class KalpPatlama extends StatelessWidget {
            const KalpPatlama({super.key});

            @override
            Widget build(BuildContext context) {
              return IgnorePointer(
                child: TweenAnimationBuilder<double>(
                  tween: Tween(begin: .55, end: 1.15),
                  duration: const Duration(milliseconds: 420),
                  curve: Curves.easeOutBack,
                  builder: (_, value, child) => Transform.scale(
                    scale: value,
                    child: Opacity(
                      opacity: (1.25 - value).clamp(0.0, 1.0),
                      child: child,
                    ),
                  ),
                  child: const Icon(
                    Icons.favorite_rounded,
                    size: 112,
                    color: Colors.white,
                    shadows: [
                      Shadow(color: Colors.black45, blurRadius: 18),
                    ],
                  ),
                ),
              );
            }
          }

          class AkisMetaSatiri extends StatelessWidget {
            final String icerikId;
            final VoidCallback yorumlariAc;

            const AkisMetaSatiri({
              super.key,
              required this.icerikId,
              required this.yorumlariAc,
            });

            @override
            Widget build(BuildContext context) {
              if (icerikId.isEmpty || icerikId.startsWith('ornek_')) {
                return const SizedBox.shrink();
              }
              final ref =
                  FirebaseFirestore.instance.collection('videos').doc(icerikId);
              return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                stream: ref.snapshots(),
                builder: (_, belge) {
                  final zaman = akisKisaZaman(belge.data?.data()?['createdAt']);
                  return Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        zaman,
                        style: const TextStyle(
                          color: Colors.white60,
                          fontSize: 11,
                          fontWeight: FontWeight.w600,
                        ),
                      ),
                      const SizedBox(height: 4),
                      StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                        stream: ref
                            .collection('comments')
                            .orderBy('createdAt', descending: true)
                            .limit(1)
                            .snapshots(),
                        builder: (_, yorumSnap) {
                          final docs = yorumSnap.data?.docs ?? const [];
                          if (docs.isEmpty) return const SizedBox.shrink();
                          final y = docs.first.data();
                          final ad = (y['username'] ?? 'ngelx').toString();
                          final metin = (y['text'] ??
                                  y['message'] ??
                                  y['content'] ??
                                  '')
                              .toString()
                              .trim();
                          return GestureDetector(
                            onTap: yorumlariAc,
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text.rich(
                                  TextSpan(
                                    children: [
                                      TextSpan(
                                        text: '@$ad ',
                                        style: const TextStyle(
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                      TextSpan(
                                        text: metin.isEmpty
                                            ? 'Yorum'
                                            : metin,
                                      ),
                                    ],
                                  ),
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(
                                    color: Colors.white,
                                    fontSize: 12,
                                  ),
                                ),
                                const SizedBox(height: 2),
                                const Text(
                                  'Tüm yorumları gör',
                                  style: TextStyle(
                                    color: Colors.white70,
                                    fontSize: 11,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                    ],
                  );
                },
              );
            }
          }

          """)

          marker = '\nclass CanliSayacButonu extends StatelessWidget'
          if marker not in text:
              marker = '\nclass IslemButonu extends StatelessWidget'
          if marker not in text:
              raise SystemExit('Yardimci widget ekleme noktasi bulunamadi')
          text = text.replace(marker, '\n' + helpers + marker, 1)

          # ------------------------------------------------------------
          # 2) Gorsel/Yazi karti: çift dokun beğen + kalp animasyonu
          # ------------------------------------------------------------
          g_state_old = """  bool kaydedildi = false;
          bool indiriliyor = false;
          int begeniSayisi = 0;"""
          g_state_new = """  bool kaydedildi = false;
          bool indiriliyor = false;
          bool kalpAnimasyonu = false;
          int begeniSayisi = 0;"""
          if g_state_old not in text:
              raise SystemExit('Gorsel kart state alani bulunamadi')
          text = text.replace(g_state_old, g_state_new, 1)

          g_method_marker = "  Future<void> begeniyiDegistir() async {"
          g_method = r"""  Future<void> ciftTikBegen() async {
          if (!begenildi) await begeniyiDegistir();
          if (!mounted) return;
          setState(() => kalpAnimasyonu = true);
          await Future.delayed(const Duration(milliseconds: 520));
          if (mounted) setState(() => kalpAnimasyonu = false);
          }

          """
          first = text.find(g_method_marker)
          if first < 0:
              raise SystemExit('Gorsel begeni metodu bulunamadi')
          text = text[:first] + g_method + text[first:]

          # Gorsel beğeni bildirimi.
          g_like_old = """    if (yeni) {
          await ref.set({'userId': user.uid, 'createdAt': FieldValue.serverTimestamp()});
          } else {
          await ref.delete();
          }"""
          g_like_new = """    if (yeni) {
          await ref.set({'userId': user.uid, 'createdAt': FieldValue.serverTimestamp()});
          final hedefUid = (widget.veri['ownerId'] ?? '').toString();
          if (hedefUid.isNotEmpty) {
          await uygulamaBildirimiGonder(
          toUid: hedefUid,
          fromUid: user.uid,
          tur: 'interaction',
          metin: 'Gönderini beğendi',
          belgeId: icerikId,
          );
          }
          } else {
          await ref.delete();
          }"""
          if g_like_old not in text:
              raise SystemExit('Gorsel begeni blogu bulunamadi')
          text = text.replace(g_like_old, g_like_new, 1)

          g_gesture_old = """    return GestureDetector(
          onLongPress: uzunBasmaMenusu,
          child: Container("""
          g_gesture_new = """    return GestureDetector(
          onLongPress: uzunBasmaMenusu,
          onDoubleTap: ciftTikBegen,
          child: Container("""
          if g_gesture_old not in text:
              raise SystemExit('Gorsel GestureDetector bulunamadi')
          text = text.replace(g_gesture_old, g_gesture_new, 1)

          # Kalp animasyonunu görsel/yazı Stack'ine ekle.
          g_pos_marker = """          Positioned(
            left: 20,
            bottom: 28,"""
          if g_pos_marker not in text:
              raise SystemExit('Gorsel kalp animasyon ekleme noktasi bulunamadi')
          text = text.replace(
              g_pos_marker,
              """          if (kalpAnimasyonu)
            const Center(child: KalpPatlama()),
          Positioned(
            left: 20,
            bottom: 28,""",
              1,
          )

          # Zaman + son yorum önizleme.
          g_meta = "CanliEtkilesimOzet(icerikId: icerikId, yorumlariAc: yorumlariAc),"
          if g_meta not in text:
              raise SystemExit('Gorsel canli ozet bulunamadi')
          text = text.replace(
              g_meta,
              g_meta + """
              const SizedBox(height: 6),
              AkisMetaSatiri(icerikId: icerikId, yorumlariAc: yorumlariAc),""",
              1,
          )

          # ------------------------------------------------------------
          # 3) Video karti: kalp animasyonu + ses aç/kapat + bildirim
          # ------------------------------------------------------------
          v_state_old = """  bool duraklatildi = false;
          bool indiriliyor = false;
          String profilFoto = '';"""
          v_state_new = """  bool duraklatildi = false;
          bool indiriliyor = false;
          bool sessiz = false;
          bool kalpAnimasyonu = false;
          String profilFoto = '';"""
          if v_state_old not in text:
              raise SystemExit('Video state alani bulunamadi')
          text = text.replace(v_state_old, v_state_new, 1)

          # İkinci begeniyiDegistir metodundan önce video cift-tik metodunu ekle.
          occurrences = [m.start() for m in re.finditer(re.escape(g_method_marker), text)]
          if len(occurrences) < 2:
              raise SystemExit(f'Video begeni metodu bulunamadi: {len(occurrences)}')
          second = occurrences[1]
          v_methods = r"""  Future<void> ciftTikBegenVideo() async {
          if (!begenildi) await begeniyiDegistir();
          if (!mounted) return;
          setState(() => kalpAnimasyonu = true);
          await Future.delayed(const Duration(milliseconds: 520));
          if (mounted) setState(() => kalpAnimasyonu = false);
          }

          void sesiDegistir() {
          if (!hazir) return;
          setState(() => sessiz = !sessiz);
          kontrol.setVolume(sessiz ? 0 : 1);
          }

          """
          text = text[:second] + v_methods + text[second:]

          # Video beğeni bildirimi.
          v_like_old = """    if (yeniDurum) {
          await begeni.set({
          'userId': kullanici.uid,
          'createdAt': FieldValue.serverTimestamp(),
          });
          } else {
          await begeni.delete();
          }"""
          v_like_new = """    if (yeniDurum) {
          await begeni.set({
          'userId': kullanici.uid,
          'createdAt': FieldValue.serverTimestamp(),
          });
          if (widget.ownerId.isNotEmpty) {
          await uygulamaBildirimiGonder(
          toUid: widget.ownerId,
          fromUid: kullanici.uid,
          tur: 'interaction',
          metin: 'Videonu beğendi',
          belgeId: videoId,
          );
          }
          } else {
          await begeni.delete();
          }"""
          if v_like_old not in text:
              raise SystemExit('Video begeni blogu bulunamadi')
          text = text.replace(v_like_old, v_like_new, 1)

          # Mevcut çift tık davranışını animasyonlu metoda bağla.
          v_double_pattern = re.compile(
              r"onDoubleTap:\s*\(\)\s*\{\s*"
              r"if\s*\(!begenildi\)\s*begeniyiDegistir\(\);\s*"
              r"\},",
              re.S,
          )
          text, nd = v_double_pattern.subn(
              "onDoubleTap: ciftTikBegenVideo,",
              text,
              count=1,
          )
          if nd != 1:
              raise SystemExit(f'Video double tap duzeltilemedi: {nd}')

          # Video Stack içine kalp + ses düğmesi.
          pause_marker = """          if (hazir && duraklatildi)
            const Center("""
          if pause_marker not in text:
              raise SystemExit('Video pause ekleme noktasi bulunamadi')
          text = text.replace(
              pause_marker,
              """          if (kalpAnimasyonu)
            const Center(child: KalpPatlama()),
          Positioned(
            top: 88,
            right: 16,
            child: Material(
              color: Colors.black45,
              shape: const CircleBorder(),
              child: IconButton(
                onPressed: sesiDegistir,
                icon: Icon(
                  sessiz ? Icons.volume_off_rounded : Icons.volume_up_rounded,
                  color: Colors.white,
                  size: 22,
                ),
              ),
            ),
          ),
          if (hazir && duraklatildi)
            const Center(""",
              1,
          )

          v_meta = "CanliEtkilesimOzet(icerikId: videoId, yorumlariAc: yorumlariAc),"
          if v_meta not in text:
              raise SystemExit('Video canli ozet bulunamadi')
          text = text.replace(
              v_meta,
              v_meta + """
                const SizedBox(height: 6),
                AkisMetaSatiri(icerikId: videoId, yorumlariAc: yorumlariAc),""",
              1,
          )

          # ------------------------------------------------------------
          # 4) Yorum / yanıt bildirimleri
          # ------------------------------------------------------------
          comment_tail = """        'likedBy': <String>[],
          'createdAt': FieldValue.serverTimestamp(),
          });
          yorum.clear();"""
          comment_new = """        'likedBy': <String>[],
          'createdAt': FieldValue.serverTimestamp(),
          });

          final icerikBelgesi = await FirebaseFirestore.instance
          .collection('videos')
          .doc(widget.videoId)
          .get();
          final icerikSahibi =
          (icerikBelgesi.data()?['ownerId'] ?? '').toString();

          if (yanitlananId != null && yanitlananId!.isNotEmpty) {
          final anaYorum = await ref.doc(yanitlananId!).get();
          final hedefUid = (anaYorum.data()?['userId'] ?? '').toString();
          if (hedefUid.isNotEmpty) {
          await uygulamaBildirimiGonder(
            toUid: hedefUid,
            fromUid: user.uid,
            tur: 'interaction',
            metin: 'Yorumuna yanıt verdi',
            belgeId: widget.videoId,
          );
          }
          } else if (icerikSahibi.isNotEmpty) {
          await uygulamaBildirimiGonder(
          toUid: icerikSahibi,
          fromUid: user.uid,
          tur: 'interaction',
          metin: 'Gönderine yorum yaptı',
          belgeId: widget.videoId,
          );
          }

          yorum.clear();"""
          if comment_tail not in text:
              raise SystemExit('Yorum bildirim ekleme noktasi bulunamadi')
          text = text.replace(comment_tail, comment_new, 1)

          # ------------------------------------------------------------
          # 5) Akışta sağa/sola kaydırarak önceki/sonraki paylaşım
          # ------------------------------------------------------------
          akis_state_old = """class _VideoAkisiState extends State<VideoAkisi> {
          int aktif = 0;
          bool takipSekmesi = false;"""
          akis_state_new = """class _VideoAkisiState extends State<VideoAkisi> {
          final PageController akisKontrol = PageController();
          int aktif = 0;
          bool takipSekmesi = false;"""
          if akis_state_old not in text:
              raise SystemExit('VideoAkisi state bulunamadi')
          text = text.replace(akis_state_old, akis_state_new, 1)

          init_block = """  @override
          void initState() {
          super.initState();
          takipListesiniGetir();
          }

          """
          dispose_block = init_block + """  @override
          void dispose() {
          akisKontrol.dispose();
          super.dispose();
          }

          """
          if init_block not in text:
              raise SystemExit('VideoAkisi initState bulunamadi')
          text = text.replace(init_block, dispose_block, 1)

          pageview_old = """            return PageView.builder(
              scrollDirection: Axis.vertical,
              itemCount: videolar.length,
              onPageChanged: (i) => setState(() => aktif = i),
              itemBuilder: (_, i) {
                final item = videolar[i];
                final tur = item['type'] ?? 'video';
                if (tur == 'video') {
                  return VideoKarti(
                    adres: item['videoUrl'] ?? item['mediaUrl'] ?? '',
                    videoId: item['id']!,
                    kullaniciAdi: item['username']!,
                    ownerId: item['ownerId']!,
                    indirilebilir: item['allowDownload'] != 'false',
                    aktif: widget.gorunur && aktif == i,
                  );
                }
                return GorselYaziKarti(
                  veri: item,
                  aktif: widget.gorunur && aktif == i,
                );
              },
            );"""
          pageview_new = """            return PageView.builder(
              controller: akisKontrol,
              scrollDirection: Axis.vertical,
              itemCount: videolar.length,
              onPageChanged: (i) => setState(() => aktif = i),
              itemBuilder: (_, i) {
                final item = videolar[i];
                final tur = item['type'] ?? 'video';
                final Widget kart = tur == 'video'
                    ? VideoKarti(
                        adres: item['videoUrl'] ?? item['mediaUrl'] ?? '',
                        videoId: item['id']!,
                        kullaniciAdi: item['username']!,
                        ownerId: item['ownerId']!,
                        indirilebilir: item['allowDownload'] != 'false',
                        aktif: widget.gorunur && aktif == i,
                      )
                    : GorselYaziKarti(
                        veri: item,
                        aktif: widget.gorunur && aktif == i,
                      );

                return GestureDetector(
                  behavior: HitTestBehavior.translucent,
                  onHorizontalDragEnd: (detay) {
                    final hiz = detay.primaryVelocity ?? 0;
                    if (hiz < -250 && i < videolar.length - 1) {
                      akisKontrol.nextPage(
                        duration: const Duration(milliseconds: 260),
                        curve: Curves.easeOut,
                      );
                    } else if (hiz > 250 && i > 0) {
                      akisKontrol.previousPage(
                        duration: const Duration(milliseconds: 260),
                        curve: Curves.easeOut,
                      );
                    }
                  },
                  child: kart,
                );
              },
            );"""
          if pageview_old not in text:
              raise SystemExit('Akis PageView blogu bulunamadi')
          text = text.replace(pageview_old, pageview_new, 1)

          # Yeni içerik sıralaması zaten createdAt descending; doğrula.
          if ".orderBy('createdAt', descending: true)" not in text:
              raise SystemExit('Akis yeni->eski siralamasi bulunamadi')

          main.write_text(text, encoding='utf-8')

          pub = Path('app/pubspec.yaml')
          pub_text = pub.read_text(encoding='utf-8')
          pub_text = re.sub(
              r'^version:\s*[^\n]+$',
              'version: 1.0.13+188',
              pub_text,
              count=1,
              flags=re.M,
          )
          pub.write_text(pub_text, encoding='utf-8')
          PY

      - name: Kodu dogrula
        run: |
          set -euo pipefail
          cd app
          dart format lib/main.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: APK olustur
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: APK artifactini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v25-AKIS-FINAL
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
