name: NgelX DIAG463 Dry Run Community Rules

on:
  push:
    branches:
      - work/diag463-production-rule-version
    paths:
      - '.github/workflows/NgelX-DIAG463-COMMUNITY-DRY-RUN.yml'
      - 'tools/dry_run_build463_production_rules.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dry run dependencies
        run: |
          python3 -m pip install --disable-pip-version-check google-auth requests
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Compose candidate from current LIVE rule state without deploying
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/dry_run_build463_production_rules.py
      - name: Run real Firestore emulator regression suite on LIVE-based candidate
        run: |
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build450_rules_test.mjs && node tools/build455_rules_test.mjs && node tools/build457_cover_rules_test.mjs"
      - name: Report safeguards
        run: echo 'Read-only production inspection and local emulator tests only. NO live rules deployed and NO user records read or changed.'
