name: Publish tested NgelX Build572 Ludo APK
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-PUBLISH572-UPDATE.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require tested Build572 before publishing
        run: |
          set -euo pipefail
          gh run watch 40241297810 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40241297810 --jq .conclusion)" = success
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40241297810 --jq .head_sha)" = 46919dee1059e1a89b711b9e643b1418d6b42df0
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build572-Review-APK
          run-id: 40241297810
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate the exact tested APK and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();sha=hashlib.sha256(raw).hexdigest()
          assert 40_000_000<len(raw)<100_000_000
          with __import__('zipfile').ZipFile(files[0]) as z:
              assert z.testzip() is None and 'assets/flutter_assets/AssetManifest.bin' in z.namelist()
          name='NgelX-1.0.342-Build572.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(sha+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.342','build':572,'size':len(raw),'sha256':sha,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.342-build572-test/'+name,'notes':'Ludo Klasik/Power görsel iyileştirmeleri, daha büyük ve kesilmeyen taşlar, aynı karede taşların ayrılması, zara ve güçlere dokunma uyarıları, Power hediyelerinin başka kareye taşınması, geliştirilmiş makine zekası; önceki 571 özellikleri korunur.','testedSource':'46919dee1059e1a89b711b9e643b1418d6b42df0','buildRun':40241297810}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('notes.md').write_text('NgelX 1.0.342 / Build572 TEST.\\n\\nKlasik ve Power Ludo, izleyici sayacı, 2/4 oyuncu, 3 zar başlangıç hakkı, sesli odaya katılma sesi, sohbet performansı ve özel/grup sohbetinde Ludo daveti.\\n\\nCI testleri, APK imzası ve önceki görseller doğrulandı; gerçek cihaz oyun ve ses kontrolleri ayrıca gereklidir.\\n')
          PY
      - name: Preserve tested source using the existing trusted release workflow tree
        run: |
          gh api repos/Nnentx/Ngelx/git/trees/main > main-tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          trusted=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'46919dee1059e1a89b711b9e643b1418d6b42df0','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE572_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('commit.json').write_text(json.dumps({'message':'Build572 tested source snapshot for updater release','tree':json.load(open('tree-result.json'))['sha'],'parents':['46919dee1059e1a89b711b9e643b1418d6b42df0']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish APK and verify the public download bytes
        run: |
          if gh release view v1.0.342-build572-test >/dev/null 2>&1; then
            gh release download v1.0.342-build572-test --pattern NgelX-1.0.342-Build572.apk --dir existing
            cmp NgelX-1.0.342-Build572.apk existing/NgelX-1.0.342-Build572.apk
          else
            target=$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")
            gh release create v1.0.342-build572-test NgelX-1.0.342-Build572.apk NgelX-1.0.342-Build572.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.342 / Build572 test' --notes-file notes.md
            gh release download v1.0.342-build572-test --pattern NgelX-1.0.342-Build572.apk --dir existing
            cmp NgelX-1.0.342-Build572.apk existing/NgelX-1.0.342-Build572.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build572-Published-Update-Manifest
          path: android-update.json

