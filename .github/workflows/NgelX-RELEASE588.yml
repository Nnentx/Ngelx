name: NgelX Build588 scoped backend release
on:
  push:
    branches: [ops/build588-rules-inspection]
    paths: ['.github/workflows/NgelX-RELEASE588.yml','tools/build588*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-production-worker-deployment
  cancel-in-progress: false
jobs:
  scoped-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f99ff01dc298102ce5e285f93144fb11edaa631d
          path: tested
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install google-auth requests
      - name: Read latest rules and preserve all unrelated production permissions
        run: |
          python3 tools/read_build588_current_rules.py
          python3 tools/build588_scope_rules.py
      - run: node --test tested/server/livekit443/*.test.mjs tested/server/ludo565/*.test.mjs tested/cloudflare/live-moderation/test/*.test.mjs
      - run: npm install --no-save --package-lock=false firebase@11 @firebase/rules-unit-testing@4 firebase-tools@13.35.1
      - name: Verify the exact current-production rule delta in emulator
        run: npx firebase emulators:exec --project demo-ngelx --only firestore 'node tested/tools/build588_rules_test.mjs'
      - name: Require the exact successful application analysis tests and signed APK
        run: |
          node --input-type=module <<'JS'
          let accepted=false;
          for(let attempt=0;attempt<90;attempt++){
            const r=await fetch('https://api.github.com/repos/Nnentx/Ngelx/actions/runs/41358497846',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'}});
            if(!r.ok)throw Error('Cannot verify APK acceptance');const d=await r.json();
            if(d.head_sha!=='f99ff01dc298102ce5e285f93144fb11edaa631d')throw Error('Unexpected application source');
            if(d.status==='completed'){if(d.conclusion!=='success')throw Error('Application QA did not pass');accepted=true;break;}
            if(attempt%6===0)console.log('Waiting for exact signed APK acceptance');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!accepted)throw Error('Signed APK acceptance timed out');
          JS
      - name: Record prior Worker checkpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build588_deployment_guard.mjs prepare
      - name: Deploy only tested Worker code with existing routes and secrets
        id: deploy
        working-directory: tested/cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy
      - name: Verify both hostnames and new PK authentication boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build588_deployment_guard.mjs record
      - name: Publish only the emulator-tested rule delta if baseline is unchanged
        run: python3 tools/build588_publish_rules.py publish
      - name: Verify real concurrent PK settlement and immutable WIN statistics
        run: python3 tools/build588_pk_smoke.py
      - name: Accept exact deployment
        id: accept
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build588_deployment_guard.mjs accept
      - name: Restore previous rules if acceptance failed
        if: failure() && steps.deploy.outcome != 'skipped' && steps.accept.outcome != 'success'
        run: python3 tools/build588_publish_rules.py rollback
      - name: Restore previous Worker if acceptance failed
        if: failure() && steps.deploy.outcome != 'skipped' && steps.accept.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build588_deployment_guard.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build588-Scoped-Release-Evidence
          path: |
            build588-current.rules
            firestore.rules
            build588-rules-state.json
            ${{ runner.temp }}/build588-worker-state.json
