name: NgelX Build535 Consented Rejoin Screen QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build535-consented-rejoin-preflight-20261019
  pull_request:
    branches:
      - qa/ngelx-build534-explicit-group-rejoin-20261019
    paths:
      - 'tools/apply_build535_consented_group_rejoin.py'
      - 'tools/test_build535_consented_rejoin_preflight.py'
      - '.github/workflows/NgelX-BUILD535-REJOIN-SCREEN-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rejoin-screen-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generated call screen anchor and consent source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_build535_consented_rejoin_preflight.py
          python3 tools/test_build534_explicit_rejoin.py
          python3 tools/test_build533_concurrent_helpers.py
          python3 tools/test_build530_group_exit_guard.py
          python3 -m py_compile tools/apply_build535_consented_group_rejoin.py
          node --test server/livekit443/room-policy.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Install local Firebase emulator dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Build535 retained group lifecycle security regression suite
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build534_explicit_rejoin_rules_test.mjs && node tools/build533_group_terminal_rules_test.mjs && node tools/build532_group_room_rules_test.mjs && node tools/build531_group_exit_rules_test.mjs && node tools/build517_group_leave_rules_test.mjs && node tools/build526_atomic_group_timeout_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs"
      - name: Production isolation and device-acceptance gate
        run: echo 'No merged code, live rules, LiveKit changes, signed APK or real 3-device acceptance; QA source transform only.'
