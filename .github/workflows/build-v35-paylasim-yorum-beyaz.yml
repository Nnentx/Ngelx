name: NgelX v35 PAYLASIM YORUM BEYAZ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v35-paylasim-yorum-beyaz.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: v34 tabanini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-v34-akis-final-verified.yml').read_text()

          def extract_run(step_name):
              lines = workflow.splitlines()
              target = f'      - name: {step_name}'
              if target not in lines:
                  raise SystemExit(f'v34 adimi bulunamadi: {step_name}')
              i = lines.index(target) + 1
              while i < len(lines) and lines[i].strip() != 'run: |':
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f'run blogu bulunamadi: {step_name}')
              i += 1
              script = []
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      script.append(line[10:])
                  elif line.strip() == '':
                      script.append('')
                  else:
                      break
                  i += 1
              return '\n'.join(script) + '\n'

          script = extract_run('v31 dogrulanmis adimlarini ve final duzeltmeyi uygula')
          subprocess.run(['bash'], input=script, text=True, check=True)
          PY

      - name: Paylasim yorum ve beyaz menuleri uygula
