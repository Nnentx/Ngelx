name: NgelX BUILD 386 APPLY DEVICE FIXES
# retry compile repair

on:
  push:
    branches:
      - work/build-386-open-issues
    paths:
      - '.github/workflows/NgelX-BUILD-386-APPLY-FIXES.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build-386-open-issues
          fetch-depth: 0

      - name: Apply consolidated Build 386 fixes
        run: python3 tools/fix_build386_compile.py

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "class EtkilesimDetayPage" app/lib/main.dart
          git diff --check

      - name: Commit consolidated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NgelX Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair Build 386 interaction detail compile error"
          git push origin HEAD:work/build-386-open-issues
