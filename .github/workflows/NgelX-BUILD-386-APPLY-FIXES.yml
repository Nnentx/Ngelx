name: NgelX BUILD 386 APPLY DEVICE FIXES
# retry 2

on:
  push:
    branches:
      - work/build-386-open-issues
    paths:
      - '.github/workflows/NgelX-BUILD-386-APPLY-FIXES.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build-386-open-issues
          fetch-depth: 0

      - name: Apply consolidated Build 386 fixes
        run: python3 tools/apply_build386_device_fixes.py

      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "backgroundUrl':url" app/lib/main.dart
          grep -q "backgroundOpacity':oran" app/lib/main.dart
          grep -q "mentionZamanlayici" app/lib/main.dart
          grep -q "useSafeArea:true" app/lib/main.dart
          grep -q "class EtkilesimDetayPage" app/lib/main.dart
          grep -q "Hikâye silinsin mi?" app/lib/story_v66.dart
          grep -q "Öne çıkanlara ekle" app/lib/story_v66.dart
          grep -q "Arşive taşı" app/lib/story_v66.dart
          git diff --check

      - name: Commit consolidated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NgelX Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart app/lib/story_v66.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: consolidate Build 386 device findings"
          git push origin HEAD:work/build-386-open-issues
