name: Ngel X BUILD 357 PRIVATE CALL FIX

on:
  workflow_dispatch:
  push:
    branches:
      - work/build357-private-call-fix
    paths:
      - '.github/workflows/NgelX-BUILD-357-PRIVATE-CALL-FIX.yml'
      - 'app/lib/main.dart'
      - 'app/pubspec.yaml'
      - 'firestore.rules'
      - 'WORK_PACKAGE_TEST_NOTES.md'

permissions:
  contents: read

concurrency:
  group: ngelx-build357-private-call-fix
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          ref: work/build357-private-call-fix
          fetch-depth: 0

      - name: Build 357 kritik regresyonlari kontrol et
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          grep -F "version: 1.0.136+357" app/pubspec.yaml
          grep -F "defaultValue: '1.0.136'" app/lib/main.dart
          grep -F "defaultValue: '357'" app/lib/main.dart

          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/lib/main.dart').read_text(encoding='utf-8')

          # Ozel sohbet arama baslatma: mevcut members sirasi degistirilmez.
          chat_class=s.index('class _SohbetPageState extends State<SohbetPage>')
          a=s.index('  Future<void> aramaBaslat(bool goruntulu)async{',chat_class)
          b=s.index('  void bilgi()=>',a)
          block=s[a:b]
          assert 'mesajGonderimHazirligi(zorla:true)' in block
          assert "private_chat_members_invalid" in block
          assert "'callGroup':false" in block
          assert "'callRoomName':odaAdi" in block
          assert "dedupeKey:'private_call_" in block
          unsafe="'members':<String>[ben,widget.digerUid],\n        'lastMessage':goruntulu?"
          assert unsafe not in block, 'Private call mevcut sohbetin members sirasini yeniden yaziyor.'

          # Yeni sohbet icin ana chat belgesi mesajdan once olusur.
          create_pos=block.index("if(!hazirlik.sohbetMevcut)")
          batch_pos=block.index("final batch=FirebaseFirestore.instance.batch()")
          assert create_pos < batch_pos

          # Biten arama sohbetin altinda kaldiginda alttaki call route kaldirilir.
          assert 'void _aramaRotasiniGuvenliKapat' in s
          assert 'navigator.removeRoute(aramaRotasi);' in s
          assert "_aramaRotasiniGuvenliKapat(false);" in s
          assert "widget.aramaRef.get().timeout(const Duration(seconds:6))" in s

          # Onceki Build 354/355 davranisi korunur.
          assert 'final toplamSaniye=grupAramasi?120:45;' in s
          assert "callAutoEndedReason':'no_participants_2m'" in s

          # Build 356: ozel sohbet AppBar'da ayri yenile ikonu geri gelmemeli.
          appbar=s[s.index('class _SohbetPageState extends State<SohbetPage>'):]
          actions=appbar[appbar.index('      actions:['):appbar.index('    ),\n    body:',appbar.index('      actions:['))]
          assert "Icons.refresh_rounded" not in actions
          assert "onRefresh:_ozelSohbetiYenile" in appbar
          print('Build 357 private call/navigation checks OK')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz ve test
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; Flutter test adimi atlandi."
          fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.136-Build-357-PRIVATE-CALL-FIX
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
