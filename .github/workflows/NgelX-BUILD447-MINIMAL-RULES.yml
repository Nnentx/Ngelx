name: NgelX Build447 verified minimal rules
on:
  push:
    branches: [work/build-447-story-call-fixes]
    paths: ['.github/workflows/NgelX-BUILD447-MINIMAL-RULES.yml', 'tools/deploy_build447_minimal_rules.py', 'tools/build447_live_rules.patch', 'tools/build447_live_member_test.mjs']
  workflow_dispatch:
concurrency:
  group: ngelx447-minimal-rules
  cancel-in-progress: false
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install google-auth requests
      - run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Validate minimal changes then deploy with unchanged-baseline guard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: python3 tools/deploy_build447_minimal_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: Build447-tested-live-rules
          path: firestore.rules
