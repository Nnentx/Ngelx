name: NgelX BUILD 391 BLOCKED CHAT MODEL

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-391-blocked-chat-model
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'QA/**'
      - '.github/workflows/NgelX-BUILD-391-BLOCKED-CHAT-MODEL.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 391 engelleme kapisi
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: 1.0.167+391' app/pubspec.yaml
          grep -Fq "defaultValue: '391'" app/lib/main.dart
          grep -Fq "defaultValue: '1.0.167'" app/lib/main.dart

          # Build 390'da gecen davranislar korunacak.
          grep -Fq "final aranabilir=d.id==aktifUid||v['discoverableProfile']!=false;" app/lib/main.dart
          grep -Fq "final beniEngelledi=aktifUid!=null&&List<String>.from(v['blocked']??const[]).contains(aktifUid);" app/lib/main.dart
          grep -Fq "final benEngelledim=engellenenler.contains(other);" app/lib/main.dart
          ! grep -Fq "if(engellenenler.contains(other))return const SizedBox.shrink();" app/lib/main.dart
          grep -Fq "icerikSahibiGizliKelimeFiltresi" app/lib/main.dart
          grep -Fq "NgelX içinde özele gönder" app/lib/main.dart
          grep -Fq "Video hikâye en fazla 80 MB olabilir." app/lib/main.dart
          grep -Fq "resizeToAvoidBottomInset:true" app/lib/main.dart
          grep -Fq "'deletedForEveryone':true" app/lib/main.dart
          grep -Fq "batch.set(bildirimRef" app/lib/main.dart

          # Yeni Messenger benzeri engelleme modeli.
          grep -Fq "Daha önceki sohbet geçmişi silinmez." app/lib/main.dart
          grep -Fq "Future<bool> ngelxEngeliKaldir" app/lib/main.dart
          grep -Fq "Daha Fazla Bilgi Al" app/lib/main.dart
          grep -Fq "kişisini engelledin" app/lib/main.dart
          grep -Fq "Eski sohbet geçmişin burada kalır." app/lib/main.dart
          grep -Fq "Engellemeyi Kaldır" app/lib/main.dart
          grep -Fq "Bir sorun var" app/lib/main.dart
          grep -Fq "_engelDurumuDinle" app/lib/main.dart
          grep -Fq "_sohbetEngelPaneli" app/lib/main.dart
          grep -Fq "if(benEngelledim||oBeniEngelledi)return const SizedBox.shrink();" app/lib/main.dart
          grep -Fq "ngelxDurumMesaji(context,hazirlik.engel!,tip:'uyari');" app/lib/main.dart

          git diff --check

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Gercek APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.167 --build-number=391
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL.apk > build/app/outputs/flutter-apk/NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.167-Build-391-BLOCKED-CHAT-MODEL.apk.sha256
          if-no-files-found: error
          retention-days: 14
