name: NgelX Build465 Feedback Fast QA
on:
  push:
    branches:
      - qa/ngelx-build465-feedback-fixes-20261016
    paths:
      - 'tools/*465*'
      - 'app/lib/build448_incoming_calls.dart'
      - 'app/lib/build454_widgets.dart'
      - '.github/workflows/NgelX-BUILD465-FEEDBACK-UNIT.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile device follow-up Python patches
        run: python3 -m py_compile tools/apply_build465_inbox_recovery.py tools/apply_build465_safe_media.py tools/apply_build465_reaction_alignment.py
 tools/apply_build465_ringtone_channel.py      - name: Run synthetic layout and notification regression tests
        run: python3 -m unittest discover -s tools -p 'test_build465_*.py' -v
