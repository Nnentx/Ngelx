name: NgelX Community Fixes QA (no deploy)

on:
  pull_request:
    branches:
      - fix/community450-rules-permissions-20261015
    paths:
      - 'app/lib/**'
      - 'app/test/**'
      - 'firestore.rules'
      - 'tools/firestore_rules_communities_test.mjs'
      - 'tools/verify_community_invite_ui.py'
      - '.github/workflows/community-fixes-qa.yml'

permissions:
  contents: read

jobs:
  static-guards:
    name: Static regression guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check member menu, invitation picker and founder filter
        run: python3 tools/verify_community_invite_ui.py
      - name: Verify no automated production deployment is configured
        shell: bash
        run: |
          set -euo pipefail
          test -f firestore.rules
          grep -q 'match /communities450/{cid}' firestore.rules
          grep -q 'match /communityInvites450/{code}' firestore.rules
          ! grep -q 'firebase deploy' .github/workflows/community-fixes-qa.yml
          ! grep -q 'upload-artifact' .github/workflows/community-fixes-qa.yml

  firestore-emulator:
    name: Firestore role and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator testing dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Run isolated community role, comments, invitation and privacy tests
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx-community450 --only firestore --non-interactive "node tools/firestore_rules_communities_test.mjs"

  flutter-check:
    name: Flutter analyzer and community widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Dart packages
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test small-screen community layout
        working-directory: app
        run: flutter test --timeout 60s test/build450_responsive_test.dart
