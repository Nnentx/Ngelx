                  builder:(_,s)=>ListView(reverse:true,padding:const EdgeInsets.all(12),children:(s.data?.docs??[]).map((d){final v=d.data(),ben=v['senderId']==uid,photo=v['type']=='photo';return Align(alignment:ben?Alignment.centerRight:Alignment.centerLeft,child:Container(constraints:const BoxConstraints(maxWidth:280),margin:const EdgeInsets.all(4),padding:EdgeInsets.all(photo?4:12),decoration:BoxDecoration(color:ben?Colors.blue:panel,borderRadius:BorderRadius.circular(18)),child:photo?ClipRRect(borderRadius:BorderRadius.circular(15),child:Image.network((v['mediaUrl']??'').toString(),width:220,fit:BoxFit.cover)):Text((v['text']??'').toString())));}).toList()),
