name: Ngel X APK v17 Tum Ozellikler WIP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Uygulamayi hazirla
        run: |
          rm -rf ngelx_app
          flutter create --platforms=android --org com.nnentx ngelx_app
          cd ngelx_app
          sed -i 's/version: 1.0.0+1/version: 1.0.4+170/' pubspec.yaml
          cp ../google-services.json android/app/google-services.json
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add supabase_flutter
          flutter pub add shared_preferences
          flutter pub add flutter_secure_storage
          flutter pub add video_player
          flutter pub add image_picker
          flutter pub add share_plus
          flutter pub add gal
          flutter pub add dio
          flutter pub add path_provider
          flutter pub add file_selector
          flutter pub add just_audio
          flutter pub add livekit_client
          flutter pub add device_info_plus
          sed -i '/id("com.android.application")/i\\    id("com.google.gms.google-services") version "4.4.4" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\
              <uses-feature android:name="android.hardware.camera" />\
              <uses-feature android:name="android.hardware.camera.autofocus" />\
              <uses-permission android:name="android.permission.CAMERA" />\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' \
              android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="ngelx_app"/android:label="Ngel X"/' android/app/src/main/AndroidManifest.xml
          base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png <<'ICON'
