name: Publish verified Build557 for website downloads
on:
  push:
    branches: [fix/build556-community-chat-quality]
    paths: ['.github/workflows/NgelX-PUBLISH557-WEB.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - name: Require exact successfully tested source and immutable artifact
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/actions/runs/40014721841 > run.json
          gh api repos/Nnentx/Ngelx/actions/artifacts/12528008764 > artifact.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'));a=json.load(open('artifact.json'))
          assert r['conclusion']=='success' and r['head_sha']=='4bee5ef3854dc211a6ce6d98103ee2a05075b47d'
          assert not a['expired'] and a['workflow_run']['id']==40014721841
          assert a['digest']=='sha256:4c8d2b931aa1e9383b3cca503c6e8d8e762fabdfe1536c32482eb0a6cc0a97ea'
          PY
          gh api repos/Nnentx/Ngelx/actions/artifacts/12528008764/zip > artifact.zip
      - name: Verify and extract unchanged signed APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          raw=Path('artifact.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4c8d2b931aa1e9383b3cca503c6e8d8e762fabdfe1536c32482eb0a6cc0a97ea'
          with zipfile.ZipFile('artifact.zip') as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.endswith('.apk')]
              assert len(names)==1
              apk=z.read(names[0])
          digest=hashlib.sha256(apk).hexdigest()
          assert len(apk)==47482799 and digest=='fc5441928ee84cde91e7c7c4f36b5e20860a80b53be81f64856b2c443f112582'
          name='NgelX-1.0.327-Build-557.apk'
          Path(name).write_bytes(apk)
          Path(name+'.sha256').write_text(digest+'  '+name+'\n')
          print('Exact tested APK verified:',len(apk),'bytes',digest)
          PY
      - name: Preserve tested source with trusted existing workflow tree
        run: |
          set -euo pipefail
          gh api repos/Nnentx/Ngelx/commits/main > main.json
          gh api repos/Nnentx/Ngelx/git/trees/$(python3 -c "import json;print(json.load(open('main.json'))['sha'])") > main-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          main=json.load(open('main.json'))['sha']
          github=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          manifest={'testedSource':'4bee5ef3854dc211a6ce6d98103ee2a05075b47d','buildRun':40014721841,'artifact':12528008764,'apkSha256':'fc5441928ee84cde91e7c7c4f36b5e20860a80b53be81f64856b2c443f112582','workflowTreeFromMain':main,'note':'APK unchanged; all tested source retained except trusted main workflow directory, to support release-tag API authorization.'}
          tree={'base_tree':manifest['testedSource'],'tree':[{'path':'.github','mode':'040000','type':'tree','sha':github},{'path':'RELEASE557_MANIFEST.json','mode':'100644','type':'blob','content':json.dumps(manifest,indent=2)+'\n'}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('commit.json').write_text(json.dumps({'message':'Build557 verified release source snapshot; retain trusted main workflows','tree':json.load(open('tree-result.json'))['sha'],'parents':['4bee5ef3854dc211a6ce6d98103ee2a05075b47d']}))
          Path('notes.md').write_text('NgelX Android 1.0.327 / Build557 test sürümü.\n\nTopluluk tasarımı, sohbet, etiketleme, yorum sayaçları, uygulama içi paylaşım ve hikâye düzeltmeleri; eksik medya/kapak verileri için ekran korumaları ve onaylanan gönderilerin topluluk bildirimleri.\n\nMevcut uygulamayı silmeden üzerine güncelleyebilirsiniz. APK yeniden derlenmeden başarılı 40014721841 çalışmasından alınmış, SHA256 ve mevcut güncelleme imzası doğrulanmıştır. Gerçek iki telefonla ses/kamera/bildirim ve aralıklı gri ekran kabul kontrolleri henüz tamamlanmadı.\n\nTest edilen kaynak: 4bee5ef3854dc211a6ce6d98103ee2a05075b47d. Sürüm kaynağı ayrıntıları RELEASE557_MANIFEST.json dosyasındadır.\n')
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish owner-authorized test download without replacing other versions
        run: |
          set -euo pipefail
          if gh release view v1.0.327-build557-test >/dev/null 2>&1; then
            gh release view v1.0.327-build557-test --json assets > existing.json
            python3 - <<'PY'
          import json
          assets=json.load(open('existing.json'))['assets']
          apk=next(a for a in assets if a['name']=='NgelX-1.0.327-Build-557.apk')
          assert apk['size']==47482799
          PY
            gh release download v1.0.327-build557-test --pattern NgelX-1.0.327-Build-557.apk --dir verify-existing
            echo 'fc5441928ee84cde91e7c7c4f36b5e20860a80b53be81f64856b2c443f112582  verify-existing/NgelX-1.0.327-Build-557.apk' | sha256sum -c -
          else
            gh release create v1.0.327-build557-test NgelX-1.0.327-Build-557.apk NgelX-1.0.327-Build-557.apk.sha256 --target "$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")" --prerelease --title 'NgelX 1.0.327 / Build557 test' --notes-file notes.md
          fi
