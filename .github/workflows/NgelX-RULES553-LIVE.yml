name: NgelX live553 scoped rules validation
on:
  push:
    branches: [qa/ngelx-build553-live-video-20261022]
    paths: ['.github/workflows/NgelX-RULES553-LIVE.yml','tools/apply_build553_live_rules.py','tools/build553_live_rules_test.mjs']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: python3 -m pip install --disable-pip-version-check google-auth requests
      - env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/diagnose_build553_live.py
      - run: |
          cp live553-current.rules live553-candidate.rules
          python3 tools/apply_build553_live_rules.py live553-candidate.rules
          python3 tools/apply_build553_live_rules.py live553-candidate.rules
          npm install --no-save @firebase/rules-unit-testing firebase firebase-tools
          echo '{"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}},"firestore":{"rules":"live553-candidate.rules"}}' > firebase553-emulator.json
          npx firebase emulators:exec --only firestore --project demo-ngelx --config firebase553-emulator.json 'node tools/build553_live_rules_test.mjs'
      - name: Publish only the tested live-stream rule delta
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/publish_build553_live_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build553-Validated-Live-Rules
          path: |
            live553-current.rules
            live553-candidate.rules
            live553-rule-release.json
            live553-publication.json
          retention-days: 7
