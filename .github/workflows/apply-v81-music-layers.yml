name: Apply V81 music layers

on:
  push:
    branches:
      - work/v81-music-layers
    paths:
      - .github/workflows/apply-v81-music-layers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v81-music-layers
          fetch-depth: 0
      - name: Apply V81 music patch
        run: git apply --check tools/v81_music_layers.patch && git apply tools/v81_music_layers.patch
      - name: Run regression checks
        run: |
          for test_file in tools/verify_*.py; do
            python3 "$test_file"
          done
          node --check cloudflare/worker/src/index.js
          python3 -m py_compile tools/verify_v81_music_layers.py
      - name: Commit verified changes
        run: |
          git config user.name "ngelx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart app/lib/create_music_editor.dart tools/verify_v65_work.py tools/verify_v81_music_layers.py
          git commit -m "feat: add photo and video music layers"
          git push origin work/v81-music-layers
