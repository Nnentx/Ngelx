name: Work P1 Apply Build 350 Fixes

on:
  push:
    branches:
      - work/final-consolidated-p1
    paths:
      - '.github/workflows/work-p1-apply-build350.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: work-p1-apply-build350
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/final-consolidated-p1
          fetch-depth: 0

      - name: Paket 1 duzeltmelerini uygula
        run: python .github/scripts/p1_build350_patch.py

      - name: Degisiklikleri dogrula
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/lib/main.dart | sed -n '1,260p'
          grep -F "_sonMesajIdSirasi" app/lib/main.dart
          grep -F "_gizliMesajIdleri" app/lib/main.dart
          grep -F "_grupMesajaGit" app/lib/main.dart
          grep -F "Sahte bulanıklık bu test sürümünde kapatıldı." app/lib/main.dart

      - name: Duzeltmeleri dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/lib/main.dart; then
            echo "main.dart degismedi" >&2
            exit 1
          fi
          git config user.name "ngelx-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart
          git commit -m "fix(p1): repair search privacy and blur safety"
          git push origin HEAD:work/final-consolidated-p1
