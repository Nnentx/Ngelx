name: NgelX BUILD 438 READ ONLY SOCIAL DIAGNOSTIC
on:
  workflow_dispatch:
  push:
    branches: [work/build-438-phone-qa]
    paths: ['.github/workflows/NgelX-BUILD-438-SOCIAL-DIAGNOSTIC.yml']
permissions:
  contents: read
jobs:
  social-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read active rule source only
        env:
          NGELX_SERVICE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          pip install google-auth requests
          python3 tools/read_build438_deployed_rules.py
      - name: Install emulator test dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Test active rules using fake emulator accounts
        run: npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build438_deployed_social_test.mjs"
