              replacement = "  uses-material-design: true\n\n  assets:\n    - assets/ngelx_logo.png\n    - assets/ngelx_logo_horizontal.png"
              if target not in pub_text:
                  raise SystemExit("pubspec uses-material-design satırı bulunamadı")
              pub_text = pub_text.replace(target, replacement, 1)
          pub.write_text(pub_text, encoding="utf-8")
