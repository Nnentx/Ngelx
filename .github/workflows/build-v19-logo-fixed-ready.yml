      - name: Kodu dogrula
        run: |
          set -euo pipefail
          cd app
          dart format lib/main.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: APK olustur
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: APK artifactini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v19-YENI-LOGO-FIXED
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
