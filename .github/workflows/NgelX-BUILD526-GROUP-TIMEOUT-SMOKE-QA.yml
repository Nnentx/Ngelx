name: NgelX Build526 Group Timeout Firestore Smoke QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build526-atomic-group-timeout-20261019
  pull_request:
    branches:
      - qa/ngelx-build525-integrated-call-live-20261019
    paths:
      - 'app/lib/build526_atomic_group_timeout.dart'
      - 'tools/*526*'
      - '.github/workflows/NgelX-BUILD526-GROUP-TIMEOUT-SMOKE-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeout-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Build526 source and emulator test syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_build526_atomic_group_timeout.py tools/test_build526_atomic_group_timeout.py
          node --check tools/build526_atomic_group_timeout_rules_test.mjs
      - name: Run isolated group missed timeout and 3-to-2 leave regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
          python3 tools/apply_build511_gift_rules.py
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build517_group_leave_rules_test.mjs && node tools/build526_atomic_group_timeout_rules_test.mjs" || { tail -100 firestore-debug.log; exit 1; }
      - name: Confirm no production mutation
        run: echo 'Local emulator only; no production Firebase or LiveKit mutation.'
