name: Build429 source inspection
on:
  push:
    branches:
      - work/build-429-46-fixes
    paths:
      - .github/workflows/inspect-build429-source.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate existing implementations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['app/lib/main.dart', 'app/lib/story_v66.dart', 'firestore.rules']:
              p=Path(name); lines=p.read_text(encoding='utf-8').splitlines()
              print('===== '+name+' lines='+str(len(lines))+' =====')
              if name.endswith('main.dart'):
                  for i,line in enumerate(lines,1):
                      if re.search(r'^(class |Future<.*>|Widget .*\(|int .*\()',line) and re.search(r'Mesaj|Bildirim|Aktivite|Arsiv|SonGor|Presence|Profil|Hikaye|Hikâye',line,re.I):
                          print(f'{i}:{line[:200]}')
                  for i,line in enumerate(lines,1):
                      if re.search(r'FirebaseStorage|storage\.ref|\.ref\(\)|refFromURL|lastSeenAt|lastSeen|Son görül|son görül|arsiv|arşiv|unreadCount',line,re.I):
                          print(f'{i}:{line[:220]}')
              elif name.endswith('story_v66.dart'):
                  for i,line in enumerate(lines,1):
                      if re.search(r'FirebaseStorage|storage\.ref|\.ref\(\)|refFromURL|delete\(|archive|expiresAt|mediaUrl|storyUrl',line,re.I):
                          print(f'{i}:{line[:220]}')
              else:
                  for i,line in enumerate(lines,1):
                      if re.search(r'match /(videos|notifications|users|posts|comments|chats|messages)',line):
                          print(f'{i}:{line[:200]}')
          PY
