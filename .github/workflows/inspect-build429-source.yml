name: Build429 source inspection
on:
  push:
    branches:
      - work/build-429-46-fixes
    paths:
      - .github/workflows/inspect-build429-source.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate message, story, profile and Firebase code
        shell: bash
        run: |
          set -euo pipefail
          for file in app/lib/main.dart app/lib/story_v66.dart firestore.rules; do
            echo "===== $file ====="
            rg -n -i "bildirim|notification|istek|unread|okunm|hikaye|story|last.?seen|son.?gor|son.?gör|cevrimici|çevrimiçi|FirebaseStorage|deleteObject|\.delete\(" "$file" | head -n 220 || true
          done
