name: Build429 notification source inspection
on:
  push:
    branches:
      - work/build-429-46-fixes
    paths:
      - .github/workflows/inspect-build429-source.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print notification and profile navigation anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('app/lib/main.dart').read_text(encoding='utf-8').splitlines()
          ranges=[(11057,11578),(22541,23290),(26839,27930)]
          pat=re.compile(r'initialFilter|filtre|Bildirimler|AktivitePage|MesajPage|notification|Icons\.notifications|notificationCount|unread',re.I)
          for a,b in ranges:
              print(f'===== main.dart:{a}-{b} =====')
              for n in range(a,min(b,len(lines))+1):
                  if pat.search(lines[n-1]):
                      lo=max(a,n-1); hi=min(b,n+1)
                      for k in range(lo,hi+1):
                          print(f'{k}: {lines[k-1]}')
                      print('--')
          PY
