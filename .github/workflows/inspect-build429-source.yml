name: Build429 source inspection
on:
  push:
    branches:
      - work/build-429-46-fixes
    paths:
      - .github/workflows/inspect-build429-source.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant implementation blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def show(path, ranges):
              lines=Path(path).read_text(encoding='utf-8').splitlines()
              for a,b in ranges:
                  print(f'===== {path}:{a}-{b} =====')
                  for n in range(a,min(b,len(lines))+1): print(f'{n}: {lines[n-1]}')
          show('app/lib/main.dart',[(2928,3050),(23288,23332),(26610,26706),(26490,26590)])
          show('firestore.rules',[(211,263),(731,743)])
          p=Path('app/lib/main.dart'); lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines,1):
              if 'FirebaseStorage' in line or 'refFromURL' in line or 'storage.ref' in line:
                  print(f'STORAGE {i}: {line[:200]}')
          PY
