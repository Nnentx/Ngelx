name: Ngel X v62 BUILD 347 AUDIO ADMIN STAGE BUBBLES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build347-audio-admin-stage-bubbles
    paths:
      - '.github/workflows/NgelX-v62-BUILD-347-AUDIO-ADMIN-STAGE-BUBBLES.yml'
      - '.github/scripts/build347_audio_admin_stage_patch.py'
      - 'app/lib/audio_live_rooms.dart'
      - 'app/lib/audio_live_rooms_pro.dart'
      - 'app/lib/audio_live_rooms_extras.dart'
      - 'firestore.rules'

permissions:
  contents: write

concurrency:
  group: ngelx-build347-audio-admin-stage-bubbles
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build347-audio-admin-stage-bubbles
          fetch-depth: 0

      - name: Build 347 kaynaklarini uygula ve kontrol et
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build347_audio_admin_stage_patch.py
          python3 .github/scripts/build347_audio_admin_stage_patch.py
          git diff --check

          grep -F "version: 1.0.128+347" app/pubspec.yaml
          grep -F "defaultValue: '1.0.128'" app/lib/main.dart
          grep -F "defaultValue: '347'" app/lib/main.dart
          grep -F "return 'ADMIN'" app/lib/audio_live_rooms_pro.dart
          grep -F "return 'YÖNETİCİ'" app/lib/audio_live_rooms_pro.dart
          grep -F "ADMIN hesabı yönetilemez." app/lib/audio_live_rooms_pro.dart
          grep -F "Odadan çıkar" app/lib/audio_live_rooms_pro.dart
          grep -F "Yönetici yap" app/lib/audio_live_rooms_pro.dart
          grep -F "ADMIN veya yönetici seni sohbetten susturdu." app/lib/audio_live_rooms_pro.dart
          grep -F "isSpeaking" app/lib/audio_live_rooms.dart
          grep -F "isMicrophoneEnabled" app/lib/audio_live_rooms.dart
          grep -F "mesaj:id.isEmpty?'':(son[id]??'')" app/lib/audio_live_rooms.dart
          grep -F "Yeniden bağlan" app/lib/audio_live_rooms.dart
          grep -F "NgelxSesliInlineSohbet" app/lib/audio_live_rooms.dart
          grep -F "members.length!=2" app/lib/audio_live_rooms_extras.dart
          grep -F "Arkadaş, takipçi veya takip ettiğin kişiyi seç" app/lib/audio_live_rooms_extras.dart
          ! grep -F "Özel sohbet veya grup seç" app/lib/audio_live_rooms_extras.dart
          grep -F "chatMutedUserIds" firestore.rules

      - name: Build 347 surum kaynaklarini dala yaz
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/lib/main.dart app/pubspec.yaml; then
            echo "Kaynaklar zaten Build 347 seviyesinde."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/lib/main.dart app/pubspec.yaml
            git commit -m "Build 347: set app version"
            git push origin HEAD:work/build347-audio-admin-stage-bubbles
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.128-Build-347-AUDIO-ADMIN-STAGE-BUBBLES
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build347-audio-admin-stage-bubbles

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI kur
        run: npm install --global firebase-tools

      - name: Sesli oda yonetici Firestore kurallarini yayinla
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          PROJECT_ID="ngelx-44eed"
          SA="${FIREBASE_SERVICE_ACCOUNT_NGELX_44EED:-${FIREBASE_SERVICE_ACCOUNT:-${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}}}"

          if [ -n "$SA" ]; then
            if printf '%s' "$SA" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$SA" > /tmp/ngelx-firebase-sa.json
            else
              printf '%s' "$SA" | base64 --decode > /tmp/ngelx-firebase-sa.json
              jq -e . /tmp/ngelx-firebase-sa.json >/dev/null
            fi
            chmod 600 /tmp/ngelx-firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ngelx-firebase-sa.json
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Firebase deploy kimligi ayarli degil."
            exit 20
          fi
