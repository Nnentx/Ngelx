name: NgelX Build576 guarded live Worker acceptance (no APK publication)
on:
  push:
    branches: [feat/build575-ludo-auto-premium-rewards]
    paths:
      - '.github/workflows/NgelX-BUILD576-LIVE-ACCEPTANCE.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-production-worker-deployment
  cancel-in-progress: false
jobs:
  guarded-live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the same tested Worker runtime and run its regression suite
        run: |
          git diff --exit-code 0552e4b1eeb99bcb261879d1fc12180fea4a7ad6 -- cloudflare/live-moderation/src cloudflare/live-moderation/wrangler.toml server/ludo565
          node --test tools/build576_deployment_guard.test.mjs
          node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs cloudflare/call-push/test/auth.test.mjs
      - name: Check successful APK and isolated acceptance; record rollback checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build576_deployment_guard.mjs prepare
      - name: Deploy only the existing Worker with original hostname and secrets
        id: deploy
        working-directory: cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy
      - name: Record exact deployment and check old core boundaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build576_deployment_guard.mjs record
      - name: Verify live game API, starter chips, gift CAS and old request shape with temporary accounts
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NGELX_GAME_ENDPOINT: https://oyun.ngelxsocial.com/ludo
          NGELX_PRODUCTION_SMOKE: '576'
        run: node tools/build576_live_smoke.mjs
      - name: Record live API acceptance without publishing APK or manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build576_deployment_guard.mjs accept
      - name: Restore checkpoint if deployment or acceptance failed
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build576_deployment_guard.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build576-Worker-Deployment-Evidence
          path: ${{ runner.temp }}/build576-worker-state.json
          if-no-files-found: ignore
