name: Check Firebase Deploy Auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-firebase-deploy-auth.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Firebase deployment credentials
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          check() {
            if [ -n "$2" ]; then
              echo "$1=present"
            else
              echo "$1=missing"
            fi
          }
          check FIREBASE_TOKEN "$FIREBASE_TOKEN"
          check FIREBASE_SERVICE_ACCOUNT "$FIREBASE_SERVICE_ACCOUNT"
          check FIREBASE_SERVICE_ACCOUNT_NGELX_44EED "$FIREBASE_SERVICE_ACCOUNT_NGELX_44EED"
          check GOOGLE_APPLICATION_CREDENTIALS_JSON "$GOOGLE_APPLICATION_CREDENTIALS_JSON"
