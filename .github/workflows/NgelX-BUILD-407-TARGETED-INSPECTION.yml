name: NgelX BUILD 407 TARGETED INSPECTION
on:
  push:
    branches: [work/build-407-consolidated-fixes]
    paths: ['.github/workflows/NgelX-BUILD-407-TARGETED-INSPECTION.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply existing Build 395-406 safely to inspection copy
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/apply_build395_final_login_inbox_ui.py
          python3 -u tools/apply_build396_inbox_final_polish.py
          python3 -u tools/apply_build397_inbox_complete_fixes.py
          python3 -u tools/apply_build398_login_story_polish.py
          python3 -u tools/apply_build399_registration_profile_cover.py
          python3 -u tools/apply_build399_explore_reference_ui.py
          python3 -u tools/apply_build399_create_reference_ui.py
          python3 -u tools/apply_build399_profile_reference_ui.py
          python3 -u tools/check_build399_regression.py
          python3 -u tools/apply_build400_cover_upload_hotfix.py
          python3 -u tools/check_build400_cover_upload.py
          python3 -u tools/apply_build401_profile_stability.py
          python3 -u tools/check_build401_profile_regression.py
          python3 -u tools/apply_build402_profile_reference_polish.py
          python3 -u tools/check_build402_profile_regression.py
          python3 -u tools/apply_build403_profile_live_audio.py
          python3 -u tools/check_build403_regression.py
          python3 -u tools/apply_build404_profile_live_voice_fixes.py
          python3 -u tools/check_build404_regression.py
          python3 -u tools/apply_build405_single_device_final.py
          python3 -u tools/check_build405_regression.py
          python3 -u tools/apply_build406_final_eight.py
          python3 -u tools/check_build406_regression.py
      - name: Print targeted UI and Firestore slices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("app/lib/main.dart").read_text(encoding="utf-8").splitlines()
          terms={
           "INBOX":["sana arkadaşlık isteği gönderdi","seni takip etmek istiyor","gelenKutusu","_gelenKutusu","class _Gelen","_bildirimBasligi"],
           "FEED":["Sana Özel","Sana özel","'Takip'","'NgelX'","NgelXLogo","NgelXLogoWidget","seekTo(","onChangeEnd:","_videoSeek","Slider("],
           "CREATE":["Anket aracı hazırlanıyor","Fotoğraf","Efektler","Paylaşım yayınlandı","Canlı Ya","Taslak otomatik kaydedildi"],
           "SEARCH":["class _KesfetArama","class _Arama","araSonuclari","aramaSonuclari","Video arama"],
           "GROUP":["class _GrubaKatilPageState","if(onayGerekli)","status':'autojoin'","group_join_request","_grupKatil","joinApproval"],
          }
          print("MAIN_TOTAL_LINES",len(s))
          for section,needles in terms.items():
           matches=[i for i,line in enumerate(s) if any(v.casefold() in line.casefold() for v in needles)]
           print("SECTION",section,"COUNT",len(matches))
           for i in matches[:90]:print(str(i+1)+": "+s[i][:195])
          ranges=[("INBOX_NOTIF",11675,11875),("FEED_EARLY",6420,6560),("FEED_HEADER",8080,8160),("POST_TIME",6840,6980)]
          for label,start,end in ranges:
           print("DETAIL",label)
           for i in range(start-1,end):
            print(str(i+1)+": "+s[i][:340])
          print("TIME_AND_POLL_ANCHORS")
          for i,line in enumerate(s):
           if "class AkisMetaSatiri" in line or "Widget _finalUretKart" in line or "taslakVar" in line and 10200<i<11200:
            print("ANCHOR",i+1)
            for k in range(max(0,i-4),min(len(s),i+65)):print(str(k+1)+": "+s[k][:300])
          print("DYNAMIC HEADERS")
          for i,line in enumerate(s):
           if "followingTab" in line or "forYou" in line or "NgelXLogo" in line or "Image.asset(" in line and (6200<i<10000):
            print("ANCHOR",i+1,line[:220])
            for k in range(max(0,i-6),min(len(s),i+7)): print(str(k+1)+": "+s[k][:260])
          PY
