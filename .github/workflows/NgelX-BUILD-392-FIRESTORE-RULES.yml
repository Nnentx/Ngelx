name: NgelX BUILD 392 FIRESTORE RULES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-392-chat-safety-links-performance
    paths:
      - 'firestore.rules'
      - '.github/workflows/NgelX-BUILD-392-FIRESTORE-RULES.yml'

permissions:
  contents: read

concurrency:
  group: ngelx-build392-firestore-rules
  cancel-in-progress: true

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Build 392 mesaj silme kurallarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'deletedForEveryone', 'deletedAt', 'deletedBy'" firestore.rules
          grep -F "'videoUrl'" firestore.rules
          grep -F "'linkUrl'" firestore.rules
          grep -F "relationshipUpdate()" firestore.rules

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI kur
        run: npm install --global firebase-tools

      - name: Firestore kurallarini yayinla
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          PROJECT_ID="ngelx-44eed"
          SA="${FIREBASE_SERVICE_ACCOUNT_NGELX_44EED:-${FIREBASE_SERVICE_ACCOUNT:-${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}}}"

          if [ -n "$SA" ]; then
            if printf '%s' "$SA" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$SA" > /tmp/ngelx-firebase-sa.json
            else
              printf '%s' "$SA" | base64 --decode > /tmp/ngelx-firebase-sa.json
              jq -e . /tmp/ngelx-firebase-sa.json >/dev/null
            fi
            chmod 600 /tmp/ngelx-firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ngelx-firebase-sa.json
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Firebase deploy kimligi ayarli degil."
            exit 20
          fi
