name: NgelX Build529 Live Guest Moderation Capacity QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build529-live-guest-moderation-cap-20261019
  pull_request:
    branches:
      - qa/ngelx-build528-safe-missed-call-age-20261019
    paths:
      - 'server/livekit443/live-moderation*.mjs'
      - 'server/livekit443/firestore-adapters*.mjs'
      - 'server/livekit443/room-policy*.mjs'
      - '.github/workflows/NgelX-BUILD529-GUEST-MODERATION-CAP-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and server-authorized ten-guest policy regression
        shell: bash
        run: |
          set -euo pipefail
          for f in server/livekit443/live-moderation.mjs server/livekit443/live-moderation-adapters.mjs server/livekit443/live-moderation.test.mjs server/livekit443/live-moderation-adapters.test.mjs server/livekit443/room-policy.mjs server/livekit443/firestore-adapters.mjs; do node --check "$f"; done
          node --test server/livekit443/live-moderation.test.mjs server/livekit443/live-moderation-adapters.test.mjs server/livekit443/room-policy.test.mjs server/livekit443/firestore-adapters.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Ensure no backend deployment or production secrets
        run: |
          echo 'Build529: Node-only QA; no Firebase deployment, secrets, or LiveKit writes.'
