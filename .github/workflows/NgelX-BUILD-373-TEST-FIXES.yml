name: NgelX BUILD 373 TEST FIXES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-373-tested-fixes
    paths:
      - 'app/**'
      - '.github/workflows/NgelX-BUILD-373-TEST-FIXES.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 373 kaynak kontrolu
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: 1.0.152+373' app/pubspec.yaml
          grep -q "defaultValue: '373'" app/lib/main.dart
          grep -q 'Arkadaşların, takip ettiklerin ve takipçilerin arasından seç.' app/lib/main.dart
          grep -q 'shared_profile' app/lib/main.dart
          grep -q 'Önizlemek ve düzenlemek için dokun' app/lib/main.dart
          grep -q 'sourceLanguage' app/lib/main.dart
          grep -q 'ScrollViewKeyboardDismissBehavior.manual' app/lib/create_music_editor.dart
          grep -q 'HitTestBehavior.opaque' app/lib/create_music_editor.dart
          grep -q 'startVideoRecording().timeout' app/lib/camera_studio.dart

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.152 --build-number=373
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.152-Build-373-TEST-FIXES.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.152-Build-373-TEST-FIXES.apk > build/app/outputs/flutter-apk/NgelX-1.0.152-Build-373-TEST-FIXES.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.152-Build-373-TEST-FIXES
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.152-Build-373-TEST-FIXES.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.152-Build-373-TEST-FIXES.apk.sha256
          if-no-files-found: error
          retention-days: 14
