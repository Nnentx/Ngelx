name: Publish tested Build587 backend APK and in-app update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/NgelX-RELEASE587-TRUSTED.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ngelx-production-worker-deployment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b996a43665323126ba6016879fa45fd7902bef2c
          path: tested
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact successful tested source and regressions
        run: |
          set -euo pipefail
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/41346489478 --jq .head_sha)" = b996a43665323126ba6016879fa45fd7902bef2c
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/41346489478 --jq .conclusion)" = success
          node --test tools/build587_deployment_guard.test.mjs
          node --test tested/server/ludo565/*.test.mjs tested/cloudflare/live-moderation/test/*.test.mjs
      - name: Record existing production Worker checkpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build587_deployment_guard.mjs prepare
      - name: Deploy only the tested Worker with its existing routes and secrets
        id: deploy
        working-directory: tested/cloudflare/live-moderation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 deploy
      - name: Record deployment and verify both hostnames and auth boundaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build587_deployment_guard.mjs record
      - name: Verify live fifteen-second turns Auto pacing gifts and stale departure
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NGELX_GAME_ENDPOINT: https://oyun.ngelxsocial.com/ludo
          NGELX_PRODUCTION_SMOKE: '576'
        run: node tools/build587_live_smoke.mjs
      - name: Accept the exact live deployment
        id: accept
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build587_deployment_guard.mjs accept
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build587-Review-APK
          run-id: 41346489478
          github-token: ${{ github.token }}
          path: verified-apk
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build587-Assembled-Source
          run-id: 41346489478
          github-token: ${{ github.token }}
          path: verified-source
      - name: Preserve the exact assembled application source
        run: |
          test -f verified-source/lib/build587_effects.dart
          grep -F 'version: 1.0.357+587' verified-source/pubspec.yaml
          (cd verified-source && zip -q -r ../NgelX-Build587-Source.zip .)
      - name: Prepare exact APK and immutable updater metadata
        run: python3 tools/build587_prepare_release.py
      - name: Preserve tested runtime with the current trusted release workflow tree
        run: |
          set -euo pipefail
          if gh release view v1.0.357-build587 >/dev/null 2>&1; then exit 0; fi
          gh api repos/Nnentx/Ngelx/git/trees/"$GITHUB_SHA" > trusted-tree587.json
          gh api repos/Nnentx/Ngelx/git/commits/b996a43665323126ba6016879fa45fd7902bef2c > tested-commit587.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          trusted=next(e['sha'] for e in json.load(open('trusted-tree587.json'))['tree'] if e['path']=='.github')
          base=json.load(open('tested-commit587.json'))['tree']['sha']
          tree={'base_tree':base,'tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE587_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('release-tree587.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input release-tree587.json > release-tree-result587.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('release-commit587.json').write_text(json.dumps({'message':'Build587 exact tested runtime and APK with trusted release metadata','tree':json.load(open('release-tree-result587.json'))['sha'],'parents':['b996a43665323126ba6016879fa45fd7902bef2c']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input release-commit587.json > release-commit-result587.json
      - name: Publish the verified APK and verify anonymous download bytes
        run: |
          set -euo pipefail
          if gh release view v1.0.357-build587 >/dev/null 2>&1; then
            mkdir -p existing587
            gh release download v1.0.357-build587 --pattern NgelX-1.0.357-Build587.apk --dir existing587
            cmp NgelX-1.0.357-Build587.apk existing587/NgelX-1.0.357-Build587.apk
          else
            target=$(python3 -c "import json;print(json.load(open('release-commit-result587.json'))['sha'])")
            gh release create v1.0.357-build587 NgelX-1.0.357-Build587.apk NgelX-1.0.357-Build587.apk.sha256 NgelX-Build587-Source.zip android-update.json --target "$target" --title 'NgelX 1.0.357 / Build587' --notes-file release-notes.md
          fi
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --silent --show-error https://github.com/Nnentx/Ngelx/releases/download/v1.0.357-build587/NgelX-1.0.357-Build587.apk --output public-download587.apk
          cmp NgelX-1.0.357-Build587.apk public-download587.apk
      - name: Restore prior Worker if deployment acceptance failed
        if: failure() && steps.deploy.outcome != 'skipped' && steps.accept.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/build587_deployment_guard.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NgelX-Build587-Publication-Evidence
          path: |
            android-update.json
            release-commit-result587.json
            ${{ runner.temp }}/build587-worker-state.json
          if-no-files-found: ignore
