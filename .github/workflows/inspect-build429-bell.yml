name: Inspect Build429 profile activity button
on:
  push:
    branches: [work/build-429-46-fixes]
    paths:
      - '.github/workflows/inspect-build429-bell.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source anchors for the 46 item audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          terms=re.compile(r"(?i)class .*?(?:Arsiv|Archive|Activity|Aktivite|Live|Yayin)|collection\(['\"](?:live|lives|broadcasts|streams|videos|posts|comments|messages|notifications)|lastSeenAt|showActivityStatus|deleteForEveryone|deletedFor|hiddenFor|FirebaseStorage|ngelxMedyaSil|purge|retention|archive")
          roots=[Path('app/lib')]
          count=0
          for root in roots:
              for p in sorted(root.rglob('*.dart')):
                  try: lines=p.read_text(encoding='utf-8').splitlines()
                  except Exception: continue
                  context=''
                  for i,line in enumerate(lines):
                      if line.lstrip().startswith('class '): context=line.strip()[:150]
                      if terms.search(line):
                          print(f'{p}:{i+1} [{context}] {line.strip()[:500]}')
                          count+=1
                          if count>=220: break
                  if count>=220: break
          print('TOTAL_MATCHES_PRINTED',count)
          PY
