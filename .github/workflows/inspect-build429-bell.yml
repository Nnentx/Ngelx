name: Inspect Build429 profile activity button
on:
  push:
    branches: [work/build-429-46-fixes]
    paths:
      - '.github/workflows/inspect-build429-bell.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source anchors for archives, presence and deletes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/lib')
          for p in [root/'main.dart',root/'live_broadcast_studio.dart',root/'live_feed_card.dart',root/'story_v66.dart']:
              lines=p.read_text(encoding='utf-8').splitlines()
              print('FILE',p)
              patterns=[r'^class .*?(?:Profil|Hikaye|Story|Arsiv|Aktivite|Yayin|Live|Presence)',
                        r'(?i)lastSeenAt|showActivityStatus|ngelxPresenceOnline|presence',
                        r"(?i)collection\(['\"]live_streams['\"]\)|collection\(['\"]videos['\"]\).*delete|\.delete\(\)|ngelxMedyaSil|FirebaseStorage|deletedForEveryone|deletedFor|hiddenFor",
                        r'(?i)arsiv|archive|retention|saklama']
              hits=[]
              for pat in patterns:
                  for i,line in enumerate(lines):
                      if re.search(pat,line):
                          hits.append(i)
              for i in sorted(set(hits)):
                  print(f'{i+1}: {lines[i].strip()[:750]}')
          PY
