name: Inspect Build429 profile activity button
on:
  push:
    branches: [work/build-429-46-fixes]
    paths:
      - '.github/workflows/inspect-build429-bell.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print history, notification and message delete paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/lib/main.dart')
          lines=p.read_text(encoding='utf-8').splitlines()
          targets=[
            'class _AktivitePageState',
            'class CanliYayinGecmisiPage',
            'class HikayeArsiviPage',
            'Future<void> ngelxMedyaSil',
            'class _MesajPageState',
            'class _GrupSohbetPageState',
            'class _YeniYorumlarState',
          ]
          for target in targets:
              i=next((i for i,l in enumerate(lines) if target in l),None)
              print('BLOCK',target,'LINE',i+1 if i is not None else 'missing')
              if i is None: continue
              length=190 if target=='class _AktivitePageState' else 145 if target=='class CanliYayinGecmisiPage' else 85
              end=min(len(lines),i+length)
              for j in range(i,end):
                  if j>i+6 and lines[j].startswith('class '): break
                  print(f'{j+1}: {lines[j]}')
          PY
