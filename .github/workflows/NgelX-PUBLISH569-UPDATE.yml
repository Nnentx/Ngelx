name: Publish verified NgelX Build569 updater APK
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-PUBLISH568-UPDATE.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live six-digit rooms and bot mode before publishing
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/build566_ludo_smoke.mjs
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build569-Review-APK
          run-id: 40221574819
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate the exact tested APK and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();sha=hashlib.sha256(raw).hexdigest()
          assert sha=='4689a4fc187087f0fdf0aabf35ac077fbe1d2c4ba235906c24774d1fc5e14af6'
          assert len(raw)==47601247
          name='NgelX-1.0.339-Build569.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(sha+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.339','build':569,'size':len(raw),'sha256':sha,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.339-build569-test/'+name,'notes':'Ludo tahtası genişletildi ve renkleri belirginleştirildi. Hamle süresi 10 saniye; süre dolunca otomatik oynanır. Mesajlar 3 saniyede kapanır, taşlar hızlandırıldı ve alt taşmalar düzeltildi. Yeni oda kodları 6 rakamdır.','testedSource':'73779722c46e11494608ae58592754eb292c5d44','buildRun':40221574819}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('notes.md').write_text('NgelX 1.0.339 / Yapı 569 test sürümü.\n\nLudo tahtası genişletildi, renkler belirginleştirildi, taşlar hızlandırıldı. Zar ve hamle süresi 10 saniyedir; süre dolunca normal oyun kurallarıyla otomatik hareket edilir. Mesaj balonları 3 saniyede kapanır. Gelen Kutusu menüsü ve Ludo davet listesi alt boşlukları düzeltildi. Yeni odalar yalnızca 6 rakamlı kod kullanır.\n\nFlutter ekran testleri, kod analizi, APK imzası ve mevcut görsel/ses dosyaları doğrulandı. Makine ve 6 rakamlı oda kodları canlı servis kontrolünden sonra yayımlanır.\n')
          PY
      - name: Preserve tested source using the existing trusted release workflow tree
        run: |
          gh api repos/Nnentx/Ngelx/git/trees/main > main-tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          trusted=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'73779722c46e11494608ae58592754eb292c5d44','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE568_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('commit.json').write_text(json.dumps({'message':'Build569 tested source snapshot for updater release','tree':json.load(open('tree-result.json'))['sha'],'parents':['73779722c46e11494608ae58592754eb292c5d44']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish APK and verify the public download bytes
        run: |
          if gh release view v1.0.339-build569-test >/dev/null 2>&1; then
            gh release download v1.0.339-build569-test --pattern NgelX-1.0.339-Build569.apk --dir existing
            cmp NgelX-1.0.339-Build569.apk existing/NgelX-1.0.339-Build569.apk
          else
            target=$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")
            gh release create v1.0.339-build569-test NgelX-1.0.339-Build569.apk NgelX-1.0.339-Build569.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.339 / Build569 test' --notes-file notes.md
            gh release download v1.0.339-build569-test --pattern NgelX-1.0.339-Build569.apk --dir existing
            cmp NgelX-1.0.339-Build569.apk existing/NgelX-1.0.339-Build569.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build569-Published-Update-Manifest
          path: android-update.json
