name: NgelX Build577 3D reference pawns and departure fix review
on:
  push:
    branches: [feat/build575-ludo-auto-premium-rewards]
    paths:
      - 'server/ludo565/**'
      - 'tools/ludo575_moderator_cli.mjs'
      - 'cloudflare/live-moderation/src/ludo565.mjs'
      - 'tools/apply_build575_ludo.py'
      - 'tools/test_build575_ludo.py'
      - 'tools/apply_build575_ads.py'
      - 'tools/build575_rewarded_ads.dart'
      - 'cloudflare/live-moderation/src/index.mjs'
      - 'tools/build575_widget_test.dart'
      - 'tools/build577_widget_test.dart'
      - 'tools/assets/ludo577_pawns.png'
      - 'tools/verify_build575_apk.py'
      - 'tools/test_verify_build575_apk.py'
      - '.github/workflows/NgelX-BUILD575-LUDO.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ngelx-build575-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ludo game, Auto, XP and wallet tests
        run: node --test server/ludo565/*.test.mjs cloudflare/live-moderation/test/*.test.mjs
  android-review:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified Build574 assembled source
        uses: actions/download-artifact@v4
        with:
          name: NgelX-Build574-Assembled-Source
          run-id: 40291524551
          github-token: ${{ github.token }}
          path: assembled
      - name: Preserve original Build574 imagery and audio
        uses: actions/download-artifact@v4
        with:
          name: NgelX-Build574-Review-APK
          run-id: 40291524551
          github-token: ${{ github.token }}
          path: previous-apk
      - name: Apply isolated Auto and premium pawn patch
        run: |
          set -euo pipefail
          cp -a assembled/. app/
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import zipfile
          apks=list(Path('previous-apk').rglob('*.apk'))
          assert len(apks)==1,'Expected one signed Build574 review APK'
          with zipfile.ZipFile(apks[0]) as z:
            for name in z.namelist():
              prefix='assets/flutter_assets/assets/'
              if not name.startswith(prefix) or name.endswith('/'):continue
              relative=PurePosixPath(name[len(prefix):])
              assert not relative.is_absolute() and '..' not in relative.parts
              out=Path('app/assets')/str(relative)
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(z.read(name))
          PY
          python3 -m py_compile tools/apply_build575_ludo.py
          python3 -m py_compile tools/apply_build575_ads.py
          python3 tools/apply_build575_ludo.py
          python3 tools/apply_build575_ads.py
          python3 tools/test_build575_ludo.py
          cp tools/build570_join_test.dart app/test/build570_join_test.dart
          cp tools/build570_perf_test.dart app/test/build570_perf_test.dart
          cp tools/build572_fast_visual_test.dart app/test/build572_fast_visual_test.dart
          cp tools/build575_widget_test.dart app/test/build575_widget_test.dart
          cp tools/build577_widget_test.dart app/test/build577_widget_test.dart
      - name: Test APK identity and demo-ad exclusion verifier
        timeout-minutes: 3
        run: python3 -m unittest tools.test_verify_build575_apk -v
      - name: Resolve Flutter packages
        working-directory: app
        timeout-minutes: 12
        run: flutter pub get
      - name: Analyze existing Flutter app
        working-directory: app
        timeout-minutes: 18
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run old and new Ludo widget tests
        working-directory: app
        timeout-minutes: 18
        run: flutter test --concurrency=1 --timeout=35s --reporter expanded test/build570_join_test.dart test/build570_perf_test.dart test/build572_fast_visual_test.dart test/build575_widget_test.dart test/build577_widget_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build577-Actual-Flutter-Previews
          path: app/build577-previews/
          if-no-files-found: error
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true
      - name: Check original updater signing fingerprint
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'
      - name: Compile Build575 review APK (not published)
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.347 --build-number=577 --dart-define=NGELX_VERSION_NAME=1.0.347 --dart-define=NGELX_BUILD_NUMBER=577 --dart-define=NGELX_VERIFICATION_EMAIL_URL=https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email --dart-define=NGELX_COMMUNITY_DELETE_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/community/delete --dart-define=NGELX_LIVEKIT_GUEST_MODERATION_URL=https://ngelx-live-moderation.alihancaglar76.workers.dev/moderate --dart-define=NGELX_CALL_PUSH_URL=https://ngelx-call-push.alihancaglar76.workers.dev
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > signature.txt
          grep -iF 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' signature.txt
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.347-Build577-REVIEW.apk
      - name: Verify Build575 APK identity, ARM64 content and demo ad exclusion
        timeout-minutes: 5
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          python3 tools/verify_build575_apk.py \
            app/build/app/outputs/flutter-apk/NgelX-1.0.347-Build577-REVIEW.apk \
            --aapt "$AAPT"
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build577-Review-APK
          path: app/build/app/outputs/flutter-apk/NgelX-1.0.347-Build577-REVIEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build577-Assembled-Source
          path: |
            app/lib
            app/pubspec.yaml
            app/pubspec.lock
            app/assets/
            app/android/app/src/main/
            app/android/app/build.gradle.kts
            app/android/app/google-services.json
            app/android/build.gradle.kts
            app/android/settings.gradle.kts
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Compile-check optional AdMob Flutter integration with Google TEST IDs (never published)
        timeout-minutes: 12
        env:
          NGELX_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
          NGELX_ADMOB_REWARDED_UNIT: ca-app-pub-3940256099942544/5224354917
        run: |
          set -euo pipefail
          # All real review artifacts above are uploaded WITHOUT the ads SDK.
          python3 tools/apply_build575_ads.py
          cd app
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          app=Path('lib/build575_rewarded_ads.dart').read_text()
          assert 'ca-app-pub-3940256099942544~3347511713' in manifest
          assert 'setServerSideOptions' in app
          assert 'ad_status' in app
          print('AdMob demo-only SDK compile and manifest wiring verified')
          PY
