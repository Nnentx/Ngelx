name: NgelX free verification email
on:
  push:
    branches: [fix/free-verification-email]
    paths: ['cloudflare/verification-email/**', '.github/workflows/NgelX-FREE-VERIFICATION-EMAIL.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngelx-free-verification-email
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate approved template and test isolated Worker
        run: |
          node cloudflare/verification-email/prepare.mjs
          node --test cloudflare/verification-email/worker.test.mjs server/verification561/verification.test.mjs
      - name: Verify Free plan and Firebase permissions before any deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          NGELX_EMAIL_API_KEY: ${{ secrets.NGELX_EMAIL_API_KEY }}
        run: node cloudflare/verification-email/preflight.mjs
      - name: Install deployment tool in isolated directory
        working-directory: cloudflare/verification-email
        run: npm install --no-package-lock --ignore-scripts
      - name: Deploy new Worker only and encrypted secrets
        working-directory: cloudflare/verification-email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          npx wrangler secret bulk .secrets-email.json
      - name: Check deployed endpoint without sending mail
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://ngelx-verification-email.alihancaglar76.workers.dev/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const j=await r.json();if(r.status!==401||j.error!=='unauthenticated')throw Error('Worker check failed: '+r.status);
          console.log('New Worker rejects unauthenticated sends. No email sent.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-email-public-preflight
          path: free-email-preflight.json
          if-no-files-found: ignore
      - name: Remove temporary secrets
        if: always()
        run: rm -f cloudflare/verification-email/.secrets-email.json
