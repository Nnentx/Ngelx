name: Deploy NgelX R2 Media Worker

on:
  push:
    branches: [ngelx-v53-r2-reliability]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/deploy-r2-media.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: R2 bucket olustur
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: r2 bucket create ngelx-media

      - name: Cloudflare R2 Worker deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy
