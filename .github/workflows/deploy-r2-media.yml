name: Deploy NgelX R2 Media Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-r2-media.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: NgelX R2 prod kaynaklarini al
        uses: actions/checkout@v4
        with:
          ref: ngelx-v53-r2-reliability

      - name: Cloudflare R2 Worker deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy
