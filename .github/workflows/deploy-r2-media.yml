name: Deploy NgelX R2 Media Worker

on:
  push:
    branches: [main, work/v65-consolidated-qa, work/v72-combined, work/build-374-feed-crop-caption, work/build-377-autoscroll-caption-fix]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/deploy-r2-media.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Worker bagimliliklarini kur
        working-directory: cloudflare/worker
        run: npm install

      - name: Worker unit testleri
        working-directory: cloudflare/worker
        run: npm test

      - name: R2 bucket olustur
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: r2 bucket create ngelx-media

      - name: Gecerli R2 S3 kimligini Cloudflare tokeninden turet
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          verify="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" || true)"
          token_id="$(jq -r '.result.id // empty' <<<"$verify")"
          if [ -z "$token_id" ]; then
            verify="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify")"
            token_id="$(jq -r '.result.id // empty' <<<"$verify")"
          fi
          if [ -z "$token_id" ]; then
            echo "Cloudflare token ID bulunamadi."
            exit 2
          fi
          r2_secret="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$token_id"
          echo "::add-mask::$r2_secret"
          echo "R2_ACCESS_KEY_ID=$token_id" >> "$GITHUB_ENV"
          echo "R2_SECRET_ACCESS_KEY=$r2_secret" >> "$GITHUB_ENV"
          echo "R2_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Turetilen R2 S3 kimligini gercek PUT GET DELETE ile dogrula
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { AwsClient } from 'aws4fetch';
          const account=process.env.R2_ACCOUNT_ID;
          const key='__ngelx_ci/deploy-credential-'+Date.now()+'.txt';
          const encoded=key.split('/').map(encodeURIComponent).join('/');
          const url=`https://${account}.r2.cloudflarestorage.com/ngelx-media/${encoded}`;
          const client=new AwsClient({
            service:'s3',
            region:'auto',
            accessKeyId:process.env.R2_ACCESS_KEY_ID,
            secretAccessKey:process.env.R2_SECRET_ACCESS_KEY,
          });
          const body='ngelx-r2-deploy-credential-test';
          const put=await client.fetch(url,{method:'PUT',headers:{'Content-Type':'text/plain'},body});
          console.log('R2 credential PUT='+put.status);
          if(!put.ok){console.log((await put.text()).slice(0,500));process.exit(3);}
          const get=await client.fetch(url,{method:'GET'});
          const text=await get.text();
          console.log('R2 credential GET='+get.status);
          if(!get.ok||text!==body)process.exit(4);
          const del=await client.fetch(url,{method:'DELETE'});
          console.log('R2 credential DELETE='+del.status);
          if(!del.ok)process.exit(5);
          NODE

      - name: Cloudflare R2 Worker deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy
          secrets: |
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_ACCOUNT_ID

      - name: Yedek Worker direct R2 secretlerini kur
        working-directory: cloudflare/worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ngelx-upload-secrets.json
          import json, os
          print(json.dumps({
            "R2_ACCESS_KEY_ID": os.environ["R2_ACCESS_KEY_ID"],
            "R2_SECRET_ACCESS_KEY": os.environ["R2_SECRET_ACCESS_KEY"],
            "R2_ACCOUNT_ID": os.environ["R2_ACCOUNT_ID"],
          }))
          PY
          npx wrangler secret bulk /tmp/ngelx-upload-secrets.json \
            --config wrangler-backup.toml \
            --name ngelx-upload
          rm -f /tmp/ngelx-upload-secrets.json

      - name: Yedek R2 Worker deploy
        working-directory: cloudflare/worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler-backup.toml

      - name: Medya servislerini dogrula
        shell: bash
        run: |
          set -e
          echo "Worker yayilimi icin bekleniyor..."
          sleep 15
          for url in \
            "https://ngelx-media.alihancaglar76.workers.dev/health" \
            "https://ngelx-upload.alihancaglar76.workers.dev/health"; do
            echo "Kontrol: $url"
            body="$(curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 3 \
              --connect-timeout 10 --max-time 20 "$url")"
            echo "$body"
            if [[ "$body" != *'"directUpload":true'* ]] || [[ "$body" != *'"ai":true'* ]] || [[ "$body" != *'"mediaTransform":true'* ]]; then
              echo "Worker caption/media binding veya direct R2 signer aktif degil: $url"
              exit 1
            fi
          done


      - name: R2 byte-range medya yanitini dogrula
        working-directory: cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { AwsClient } from 'aws4fetch';

          const account=process.env.R2_ACCOUNT_ID;
          const key='__ngelx_ci/range-'+Date.now()+'.txt';
          const encoded=key.split('/').map(encodeURIComponent).join('/');
          const r2Url=`https://${account}.r2.cloudflarestorage.com/ngelx-media/${encoded}`;
          const body='0123456789abcdefghijklmnopqrstuvwxyz';
          const client=new AwsClient({
            service:'s3',
            region:'auto',
            accessKeyId:process.env.R2_ACCESS_KEY_ID,
            secretAccessKey:process.env.R2_SECRET_ACCESS_KEY,
          });

          const put=await client.fetch(r2Url,{method:'PUT',headers:{'Content-Type':'text/plain'},body});
          if(!put.ok){
            console.log('Range test PUT='+put.status);
            console.log((await put.text()).slice(0,500));
            process.exit(10);
          }

          try {
            for (const base of [
              'https://ngelx-media.alihancaglar76.workers.dev',
              'https://ngelx-upload.alihancaglar76.workers.dev',
            ]) {
              let response=null;
              for(let attempt=1;attempt<=10;attempt++){
                response=await fetch(base+'/media/'+encoded,{headers:{Range:'bytes=5-9'}});
                if(response.status===206)break;
                await new Promise(resolve=>setTimeout(resolve,3000));
              }
              const text=await response.text();
              const contentRange=response.headers.get('content-range')||'';
              console.log(base+' range status='+response.status+' content-range='+contentRange+' body='+text);
              if(response.status!==206)process.exit(11);
              if(text!=='56789')process.exit(12);
              if(contentRange!==`bytes 5-9/${body.length}`)process.exit(13);
            }
          } finally {
            const del=await client.fetch(r2Url,{method:'DELETE'});
            console.log('Range test cleanup DELETE='+del.status);
          }
          NODE
