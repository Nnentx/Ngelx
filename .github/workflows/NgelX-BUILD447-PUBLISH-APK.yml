name: Publish verified NgelX Build447 APK
on:
  push:
    branches: [work/build-447-story-call-fixes]
    paths: ['.github/workflows/NgelX-BUILD447-PUBLISH-APK.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: Nnentx/Ngelx
          run-id: 38288313895
          github-token: ${{ github.token }}
          name: NgelX-1.0.222-Build-447-CANDIDATE
          path: release447
      - name: Verify exact approved APK and publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          task_apk=$(find release447 -type f -name 'NgelX-1.0.222-Build-447-CANDIDATE.apk')
          test -n "$task_apk"
          task_sha=$(sha256sum "$task_apk" | cut -d ' ' -f 1)
          test "$task_sha" = '76f147a41a9b3dd4795a89bcd52dc767bf40199e6c18923292172570b2d53cf7'
          cat > release447-notes.txt <<'NOTES'
          Android test sürümü: v1.0.222 / Build447.
          Mevcut NgelX üzerine güncelleme olarak kurulabilir.
          Gelen Kutusu tasarımı korunmuştur. Hikâye yanıtı/silme ve görüşme düzeltmeleri, kare katılımcı kartları, yeşil konuşma halkası ve yönetici susturma/görüşmeden çıkarma menüsü içerir.
          Arka planda ses ve kamera davranışının iki telefonla testi devam etmektedir.
          NOTES
          gh release create v1.0.222-build447-test "$task_apk" --repo Nnentx/Ngelx --target 22402455c6f61141385e1d07743180f9755029e5 --title 'NgelX 1.0.222 • Build447 — Android test' --notes-file release447-notes.txt --prerelease
