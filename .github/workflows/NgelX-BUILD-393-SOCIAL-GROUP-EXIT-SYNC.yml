name: NgelX BUILD 393 SOCIAL GROUP EXIT SYNC

on:
  workflow_dispatch:
  push:
    branches:
      - work/build-393-social-group-exit-sync
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'QA/**'
      - 'WORK_BUILD_393.md'
      - '.github/workflows/NgelX-BUILD-393-SOCIAL-GROUP-EXIT-SYNC.yml'

concurrency:
  group: ngelx-build393-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Build 393 regresyon kapisi
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'version: 1.0.169+393' app/pubspec.yaml
          grep -Fq "defaultValue: '393'" app/lib/main.dart
          grep -Fq "defaultValue: '1.0.169'" app/lib/main.dart

          # Build 392 korunan davranislar.
          grep -Fq "Daha önceki sohbet geçmişi silinmez." app/lib/main.dart
          grep -Fq "Engellemeyi Kaldır" app/lib/main.dart
          grep -Fq "_engelDurumuDinle" app/lib/main.dart
          grep -Fq "NgelXSesliMesaj" app/lib/main.dart
          grep -Fq "Bu grupta engellediğin bir kişi var" app/lib/main.dart
          grep -Fq "Engellediğin kişinin mesajı gizlendi" app/lib/main.dart
          grep -Fq "ngelxIlkWebBaglantisi" app/lib/main.dart
          grep -Fq "ngelxMesajBaglantilariniAyir" app/lib/main.dart

          # Build 393 sosyal / grup cikis modeli.
          grep -Fq "Bu gruba mesaj gönderemezsin" app/lib/main.dart
          grep -Fq "Tekrar ekleninceye kadar mesaj gönderemez, arama yapamaz ve yeni grup mesajlarını alamazsın." app/lib/main.dart
          grep -Fq "olayTuru:'group_removed'" app/lib/main.dart
          grep -Fq "collection('group_archives').doc(ben).collection('items')" app/lib/main.dart
          grep -Fq "final v=d.data(),ham=v['createdAt']??v['clientCreatedAt'];" app/lib/main.dart
          grep -Fq "sosyalIstekIptalEt(sosyalIstekRef(u.uid,hedefUid,tur))" app/lib/main.dart
          grep -Fq "formerMembers" app/lib/main.dart
          grep -Fq "WORK_BUILD_393" /dev/null || true

          git diff --check

      - name: Bagimliliklari al
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Gercek APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release --build-name=1.0.169 --build-number=393
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC.apk
          sha256sum build/app/outputs/flutter-apk/NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC.apk > build/app/outputs/flutter-apk/NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC
          path: |
            app/build/app/outputs/flutter-apk/NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC.apk
            app/build/app/outputs/flutter-apk/NgelX-1.0.169-Build-393-SOCIAL-GROUP-EXIT-SYNC.apk.sha256
          if-no-files-found: error
          retention-days: 14
