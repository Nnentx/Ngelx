name: Publish verified NgelX Build541 Android test APK
on:
  push:
    branches: [qa/ngelx-publish541-android-20261019]
    paths: ['.github/workflows/NgelX-PUBLISH541-WEB.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for exact reviewed candidate and require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39317293792 --jq .head_sha)" = "d2d5ce1906bc1a8379091ded5231b29f4df50c62"
          gh run watch 39317293792 --repo Nnentx/Ngelx --interval 20 --exit-status
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/39317293792 --jq .conclusion)" = success
          if gh release view v1.0.311-build541-test --repo Nnentx/Ngelx >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release.'
            exit 1
          fi
      - name: Download only the verified candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39317293792 --repo Nnentx/Ngelx --name NgelX-Build541-REAL-INPLACE-SIGNED-REVIEW-ONLY --dir candidate
      - name: Verify checksum, package, version and original update signer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          name='NgelX-1.0.311-Build541-INPLACE-CANDIDATE.apk'
          files=list(Path('candidate').rglob(name));sums=list(Path('candidate').rglob(name+'.sha256'))
          assert len(files)==len(sums)==1
          apk=files[0];assert 40_000_000<apk.stat().st_size<200_000_000
          digest=hashlib.sha256(apk.read_bytes()).hexdigest();assert digest==sums[0].read_text().split()[0]
          shutil.copyfile(apk,'NgelX-1.0.311-Build-541.apk')
          Path('NgelX-1.0.311-Build-541.apk.sha256').write_text(digest+'  NgelX-1.0.311-Build-541.apk\n')
          print('Verified candidate SHA256:',digest)
          PY
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$tools"
          "$tools" verify --verbose --print-certs NgelX-1.0.311-Build-541.apk > signature.txt
          grep -Fi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' signature.txt
          aapt="$(dirname "$tools")/aapt"
          "$aapt" dump badging NgelX-1.0.311-Build-541.apk > manifest.txt
          grep -F "package: name='com.nnentx.ngelx_app' versionCode='541' versionName='1.0.311'" manifest.txt
      - name: Publish Android test download without backend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          NgelX 1.0.311 / Build541 Android test sürümü.

          PR #172 üzerine canlı yayın, arama küçültme/geri dönüş ve sesli oda geliştirmeleri. Mevcut paket kimliği ve güncelleme imzası korunmuştur. Kaynak koruma testleri, Flutter testleri, analiz, APK sürüm ve imza kontrolleri başarılı derleme 39317293792 içinde doğrulanmıştır.

          İki gerçek cihazda medya davranışı ayrıca test edilmelidir. Sanal hediyeler mevcut test ortamı sınırını korur. Firebase/LiveKit sunucularına production dağıtımı yapılmamıştır. Önceki Build539/540 dosyaları değiştirilmemiştir.
          Kaynak adayı d2d5ce1906bc1a8379091ded5231b29f4df50c62; yayın kaynak dışa aktarımı 380af7eccc61cd384520b495cbcc78b529644329. Uygulama kodu/testler aynıdır; yayın kaynak dalında CI iş akışları varsayılan dal ile aynen korunur.
          EOF
          test "$(gh api 'repos/Nnentx/Ngelx/git/trees/380af7eccc61cd384520b495cbcc78b529644329?recursive=1' --jq '.tree[] | select(.path==".github/workflows") | .sha')" = 097102c0a68a0161f87410c61d5706c0baeab51d
          gh release create v1.0.311-build541-test NgelX-1.0.311-Build-541.apk NgelX-1.0.311-Build-541.apk.sha256 --repo Nnentx/Ngelx --target 380af7eccc61cd384520b495cbcc78b529644329 --prerelease --title 'NgelX 1.0.311 / Build541 test' --notes-file notes.md
