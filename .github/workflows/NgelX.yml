name: NgelX APK v3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Uygulamayi hazirla
        run: |
          rm -rf ngelx_app
          flutter create --platforms=android --org com.nnentx ngelx_app
          cd ngelx_app
          flutter pub add video_player
          flutter pub add image_picker

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              android/app/src/main/AndroidManifest.xml

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';

          void main() => runApp(const NgelXApp());

          const mor = Color(0xFF8B5CF6);
          const mavi = Color(0xFF22D3EE);
          const panel = Color(0xFF17171F);

          class NgelXApp extends StatelessWidget {
            const NgelXApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'NgelX',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF08080D),
                  colorScheme: const ColorScheme.dark(
                    primary: mor,
                    secondary: mavi,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: panel,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(18),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const GirisPage(),
              );
            }
          }

          class GirisPage extends StatefulWidget {
            const GirisPage({super.key});

            @override
            State<GirisPage> createState() => _GirisPageState();
          }

          class _GirisPageState extends State<GirisPage> {
            final email = TextEditingController();
            final sifre = TextEditingController();
            bool gizli = true;

            void girisYap() {
              if (!email.text.contains('@') || sifre.text.length < 4) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Geçerli e-posta ve şifre gir.'),
                  ),
                );
                return;
              }

              Navigator.pushReplacement(
                context,
                MaterialPageRoute(builder: (_) => const AnaEkran()),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const SizedBox(height: 45),
                        const Logo(),
                        const SizedBox(height: 55),
                        const Text(
                          'Tekrar hoş geldin',
                          style: TextStyle(
                            fontSize: 31,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'İzle, keşfet ve kendi dünyanı paylaş.',
                          style: TextStyle(color: Colors.white60),
                        ),
                        const SizedBox(height: 32),
                        TextField(
                          controller: email,
                          keyboardType: TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            prefixIcon: Icon(Icons.alternate_email),
                            hintText: 'E-posta adresi',
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: sifre,
                          obscureText: gizli,
                          decoration: InputDecoration(
                            prefixIcon: const Icon(Icons.lock_outline),
                            hintText: 'Şifre',
                            suffixIcon: IconButton(
                              onPressed: () {
                                setState(() => gizli = !gizli);
                              },
                              icon: Icon(
                                gizli
                                    ? Icons.visibility_off_outlined
                                    : Icons.visibility_outlined,
                              ),
                            ),
                          ),
                        ),
                        Align(
                          alignment: Alignment.centerRight,
                          child: TextButton(
                            onPressed: () {},
                            child: const Text('Şifremi unuttum'),
                          ),
                        ),
                        RenkliButon(
                          yazi: 'Giriş Yap',
                          tiklama: girisYap,
                        ),
                        const SizedBox(height: 18),
                        OutlinedButton.icon(
                          onPressed: () {
                            Navigator.pushReplacement(
                              context,
                              MaterialPageRoute(
                                builder: (_) => const AnaEkran(),
                              ),
                            );
                          },
                          icon: const Icon(Icons.person_outline),
                          label: const Text('Misafir olarak keşfet'),
                          style: OutlinedButton.styleFrom(
                            minimumSize: const Size.fromHeight(54),
                          ),
                        ),
                        const SizedBox(height: 22),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text(
                              'Hesabın yok mu?',
                              style: TextStyle(color: Colors.white60),
                            ),
                            TextButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const KayitPage(),
                                  ),
                                );
                              },
                              child: const Text('Hesap oluştur'),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class KayitPage extends StatelessWidget {
            const KayitPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  title: const Text('Yeni hesap'),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Logo(),
                      const SizedBox(height: 35),
                      const TextField(
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.person_outline),
                          hintText: 'Kullanıcı adı',
                        ),
                      ),
                      const SizedBox(height: 14),
                      const TextField(
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.alternate_email),
                          hintText: 'E-posta adresi',
                        ),
                      ),
                      const SizedBox(height: 14),
                      const TextField(
                        obscureText: true,
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.lock_outline),
                          hintText: 'Şifre',
                        ),
                      ),
                      const SizedBox(height: 24),
                      RenkliButon(
                        yazi: 'Hesap Oluştur',
                        tiklama: () {
                          Navigator.pushAndRemoveUntil(
                            context,
                            MaterialPageRoute(
                              builder: (_) => const AnaEkran(),
                            ),
                            (_) => false,
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AnaEkran extends StatefulWidget {
            const AnaEkran({super.key});

            @override
            State<AnaEkran> createState() => _AnaEkranState();
          }

          class _AnaEkranState extends State<AnaEkran> {
            int secili = 0;

            final sayfalar = const [
              VideoAkisi(),
              KesfetPage(),
              YuklePage(),
              MesajPage(),
              ProfilPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: secili,
                  children: sayfalar,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: secili,
                  backgroundColor: const Color(0xFF101016),
                  onDestinationSelected: (i) {
                    setState(() => secili = i);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Akış',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.explore_outlined),
                      selectedIcon: Icon(Icons.explore),
                      label: 'Keşfet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.add_box_outlined),
                      selectedIcon: Icon(Icons.add_box),
                      label: 'Üret',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.forum_outlined),
                      selectedIcon: Icon(Icons.forum),
                      label: 'Sohbet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Ben',
                    ),
                  ],
                ),
              );
            }
          }

          class VideoAkisi extends StatefulWidget {
            const VideoAkisi({super.key});

            @override
            State<VideoAkisi> createState() => _VideoAkisiState();
          }

          class _VideoAkisiState extends State<VideoAkisi> {
            int aktif = 0;

            static const videolar = [
              'https://flutter.github.io/assets-for-api-docs/assets/videos/bee.mp4',
              'https://flutter.github.io/assets-for-api-docs/assets/videos/butterfly.mp4',
              'https://media.w3.org/2010/05/sintel/trailer.mp4',
            ];

            @override
            Widget build(BuildContext context) {
              return Stack(
                children: [
                  PageView.builder(
                    scrollDirection: Axis.vertical,
                    itemCount: videolar.length,
                    onPageChanged: (i) {
                      setState(() => aktif = i);
                    },
                    itemBuilder: (_, i) {
                      return VideoKarti(
                        adres: videolar[i],
                        aktif: aktif == i,
                        sira: i,
                      );
                    },
                  ),
                  const SafeArea(
                    child: Padding(
                      padding: EdgeInsets.all(17),
                      child: Row(
                        children: [
                          Logo(kucuk: true),
                          Spacer(),
                          Text(
                            'Takip',
                            style: TextStyle(color: Colors.white60),
                          ),
                          SizedBox(width: 17),
                          Text(
                            'Sana Özel',
                            style: TextStyle(fontWeight: FontWeight.bold),
                          ),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }
          }

          class VideoKarti extends StatefulWidget {
            final String adres;
            final bool aktif;
            final int sira;

            const VideoKarti({
              super.key,
              required this.adres,
              required this.aktif,
              required this.sira,
            });

            @override
            State<VideoKarti> createState() => _VideoKartiState();
          }

          class _VideoKartiState extends State<VideoKarti> {
            late final VideoPlayerController kontrol;
            bool hazir = false;
            bool begenildi = false;
            bool kaydedildi = false;

            @override
            void initState() {
              super.initState();

              kontrol = VideoPlayerController.networkUrl(
                Uri.parse(widget.adres),
              );

              kontrol.initialize().then((_) {
                kontrol.setLooping(true);

                if (widget.aktif) {
                  kontrol.play();
                }

                if (mounted) {
                  setState(() => hazir = true);
                }
              });
            }

            @override
            void didUpdateWidget(covariant VideoKarti oldWidget) {
              super.didUpdateWidget(oldWidget);

              if (!hazir) return;

              if (widget.aktif) {
                kontrol.play();
              } else {
                kontrol.pause();
              }
            }

            @override
            void dispose() {
              kontrol.dispose();
              super.dispose();
            }

            void yorumlariAc() {
              showModalBottomSheet(
                context: context,
                backgroundColor: panel,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(
                    top: Radius.circular(25),
                  ),
                ),
                builder: (_) => const Yorumlar(),
              );
            }

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTap: () {
                  if (!hazir) return;

                  setState(() {
                    if (kontrol.value.isPlaying) {
                      kontrol.pause();
                    } else {
                      kontrol.play();
                    }
                  });
                },
                onDoubleTap: () {
                  setState(() => begenildi = true);
                },
                child: Stack(
                  fit: StackFit.expand,
                  children: [
                    Container(color: Colors.black),
                    if (hazir)
                      FittedBox(
                        fit: BoxFit.cover,
                        child: SizedBox(
                          width: kontrol.value.size.width,
                          height: kontrol.value.size.height,
                          child: VideoPlayer(kontrol),
                        ),
                      )
                    else
                      const Center(
                        child: CircularProgressIndicator(color: mavi),
                      ),
                    const DecoratedBox(
                      decoration: BoxDecoration(
                        gradient: LinearGradient(
                          begin: Alignment.topCenter,
                          end: Alignment.bottomCenter,
                          colors: [
                            Colors.black54,
                            Colors.transparent,
                            Colors.black87,
                          ],
                        ),
                      ),
                    ),
                    Positioned(
                      left: 18,
                      right: 85,
                      bottom: 25,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '@ngelx_${widget.sira + 1}',
                            style: const TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Anı yakala, kendi hikâyeni paylaş ✨',
                          ),
                          const SizedBox(height: 8),
                          const Row(
                            children: [
                              Icon(Icons.graphic_eq, size: 17),
                              SizedBox(width: 6),
                              Text('NgelX • Özgün ses'),
                            ],
                          ),
                        ],
                      ),
                    ),
                    Positioned(
                      right: 14,
                      bottom: 20,
                      child: Column(
                        children: [
                          const CircleAvatar(
                            radius: 25,
                            backgroundColor: Colors.white,
                            child: CircleAvatar(
                              radius: 22,
                              backgroundColor: panel,
                              child: Text(
                                'N',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),
                          ),
                          IslemButonu(
                            ikon: begenildi
                                ? Icons.favorite
                                : Icons.favorite_border,
                            yazi: '18K',
                            renk: begenildi
                                ? Colors.pinkAccent
                                : Colors.white,
                            tiklama: () {
                              setState(() {
                                begenildi = !begenildi;
                              });
                            },
                          ),
                          IslemButonu(
                            ikon: Icons.mode_comment_outlined,
                            yazi: '642',
                            tiklama: yorumlariAc,
                          ),
                          IslemButonu(
                            ikon: kaydedildi
                                ? Icons.bookmark
                                : Icons.bookmark_border,
                            yazi: 'Kaydet',
                            renk: kaydedildi ? mavi : Colors.white,
                            tiklama: () {
                              setState(() {
                                kaydedildi = !kaydedildi;
                              });
                            },
                          ),
                          IslemButonu(
                            ikon: Icons.send_outlined,
                            yazi: 'Paylaş',
                            tiklama: () {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(
                                  content: Text(
                                    'Paylaşım seçenekleri hazırlanıyor.',
                                  ),
                                ),
                              );
                            },
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class IslemButonu extends StatelessWidget {
            final IconData ikon;
            final String yazi;
            final VoidCallback tiklama;
            final Color renk;

            const IslemButonu({
              super.key,
              required this.ikon,
              required this.yazi,
              required this.tiklama,
              this.renk = Colors.white,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: tiklama,
                child: Padding(
                  padding: const EdgeInsets.only(top: 16),
                  child: Column(
                    children: [
                      Icon(ikon, size: 33, color: renk),
                      const SizedBox(height: 3),
                      Text(
                        yazi,
                        style: const TextStyle(
                          fontSize: 10,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class Yorumlar extends StatelessWidget {
            const Yorumlar({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: SizedBox(
                  height: 430,
                  child: Column(
                    children: [
                      const Padding(
                        padding: EdgeInsets.all(16),
                        child: Text(
                          'Yorumlar',
                          style: TextStyle(
                            fontSize: 19,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      const Expanded(
                        child: ListView(
                          children: [
                            ListTile(
                              leading: CircleAvatar(child: Text('A')),
                              title: Text('@ali'),
                              subtitle: Text('Çok iyi olmuş 🔥'),
                            ),
                            ListTile(
                              leading: CircleAvatar(child: Text('M')),
                              title: Text('@mert'),
                              subtitle: Text('NgelX güzel görünüyor 👏'),
                            ),
                          ],
                        ),
                      ),
                      const Padding(
                        padding: EdgeInsets.all(12),
                        child: TextField(
                          decoration: InputDecoration(
                            hintText: 'Yorum yaz...',
                            suffixIcon: Icon(Icons.send),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class KesfetPage extends StatelessWidget {
            const KesfetPage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Column(
                  children: [
                    const Padding(
                      padding: EdgeInsets.all(18),
                      child: Row(
                        children: [
                          Text(
                            'Keşfet',
                            style: TextStyle(
                              fontSize: 29,
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                          Spacer(),
                          Icon(Icons.search),
                        ],
                      ),
                    ),
                    Expanded(
                      child: GridView.builder(
                        padding: const EdgeInsets.all(5),
                        itemCount: 18,
                        gridDelegate:
                            const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 3,
                          childAspectRatio: 0.7,
                          crossAxisSpacing: 5,
                          mainAxisSpacing: 5,
                        ),
                        itemBuilder: (_, i) {
                          return Container(
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(12),
                              color: i.isEven
                                  ? const Color(0xFF292348)
                                  : const Color(0xFF16343B),
                            ),
                            child: const Icon(
                              Icons.play_arrow,
                              color: Colors.white38,
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class YuklePage extends StatelessWidget {
            const YuklePage({super.key});

            Future<void> videoSec(BuildContext context) async {
              final dosya = await ImagePicker().pickVideo(
                source: ImageSource.gallery,
              );

              if (!context.mounted || dosya == null) return;

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('Video seçildi: ${dosya.name}'),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(28),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(
                          Icons.video_call_outlined,
                          size: 75,
                          color: mavi,
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          'Yeni içerik üret',
                          style: TextStyle(
                            fontSize: 25,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'Galerinden bir video seç.',
                          style: TextStyle(color: Colors.white54),
                        ),
                        const SizedBox(height: 25),
                        RenkliButon(
                          yazi: 'Galeriden Video Seç',
                          tiklama: () => videoSec(context),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class MesajPage extends StatelessWidget {
            const MesajPage({super.key});

            @override
            Widget build(BuildContext context) {
              return const BosEkran(
                ikon: Icons.forum_outlined,
                baslik: 'Sohbetlerin',
                aciklama: 'Yeni bağlantıların burada görünecek.',
              );
            }
          }

          class ProfilPage extends StatefulWidget {
            const ProfilPage({super.key});

            @override
            State<ProfilPage> createState() => _ProfilPageState();
          }

          class _ProfilPageState extends State<ProfilPage> {
            String ad = 'NgelX Creator';
            String kullanici = '@ngelx';
            String bio = 'Kendi ritmim, kendi dünyam ✦';

            void duzenle() {
              final adKontrol = TextEditingController(text: ad);
              final kullaniciKontrol = TextEditingController(
                text: kullanici.replaceFirst('@', ''),
              );
              final bioKontrol = TextEditingController(text: bio);

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: panel,
                builder: (ctx) {
                  return Padding(
                    padding: EdgeInsets.fromLTRB(
                      20,
                      25,
                      20,
                      MediaQuery.of(ctx).viewInsets.bottom + 25,
                    ),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(
                          controller: adKontrol,
                          decoration: const InputDecoration(
                            labelText: 'Görünen ad',
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: kullaniciKontrol,
                          decoration: const InputDecoration(
                            prefixText: '@',
                            labelText: 'Kullanıcı adı',
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: bioKontrol,
                          decoration: const InputDecoration(
                            labelText: 'Biyografi',
                          ),
                        ),
                        const SizedBox(height: 20),
                        RenkliButon(
                          yazi: 'Kaydet',
                          tiklama: () {
                            setState(() {
                              ad = adKontrol.text;
                              kullanici = '@${kullaniciKontrol.text}';
                              bio = bioKontrol.text;
                            });
                            Navigator.pop(ctx);
                          },
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: CustomScrollView(
                  slivers: [
                    SliverToBoxAdapter(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Column(
                          children: [
                            const Row(
                              children: [
                                Logo(kucuk: true),
                                Spacer(),
                                Icon(Icons.settings_outlined),
                              ],
                            ),
                            const SizedBox(height: 25),
                            Container(
                              width: 105,
                              height: 105,
                              padding: const EdgeInsets.all(4),
                              decoration: const BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: LinearGradient(
                                  colors: [mavi, mor],
                                ),
                              ),
                              child: const CircleAvatar(
                                backgroundColor: Color(0xFF24222E),
                                child: Text(
                                  'N',
                                  style: TextStyle(
                                    fontSize: 45,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 14),
                            Text(
                              ad,
                              style: const TextStyle(
                                fontSize: 23,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            Text(
                              kullanici,
                              style: const TextStyle(color: Colors.white54),
                            ),
                            const SizedBox(height: 13),
                            Text(bio),
                            const SizedBox(height: 23),
                            const Row(
                              mainAxisAlignment:
                                  MainAxisAlignment.spaceEvenly,
                              children: [
                                Istatistik('128', 'Takip'),
                                Istatistik('24,8 B', 'Takipçi'),
                                Istatistik('182 B', 'Etkileşim'),
                              ],
                            ),
                            const SizedBox(height: 23),
                            RenkliButon(
                              yazi: 'Profili Düzenle',
                              tiklama: duzenle,
                            ),
                            const SizedBox(height: 25),
                            const Row(
                              mainAxisAlignment:
                                  MainAxisAlignment.spaceAround,
                              children: [
                                Icon(Icons.grid_view),
                                Icon(
                                  Icons.bookmark_border,
                                  color: Colors.white38,
                                ),
                                Icon(
                                  Icons.favorite_border,
                                  color: Colors.white38,
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    SliverPadding(
                      padding: const EdgeInsets.all(5),
