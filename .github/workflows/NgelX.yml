name: NgelX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Uygulamayi hazirla
        run: |
          flutter create --platforms=android --org com.nnentx ngelx_app
          cd ngelx_app

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() => runApp(const NgelXApp());

          const mor = Color(0xFF8B5CF6);
          const mavi = Color(0xFF22D3EE);
          const panel = Color(0xFF17171F);

          class NgelXApp extends StatelessWidget {
            const NgelXApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'NgelX',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF08080D),
                  colorScheme: const ColorScheme.dark(
                    primary: mor,
                    secondary: mavi,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: panel,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(18),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const LoginPage(),
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});

            @override
            State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            final email = TextEditingController();
            final password = TextEditingController();
            bool gizli = true;

            void giris() {
              if (!email.text.contains('@') || password.text.length < 4) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Geçerli e-posta ve en az 4 karakterli şifre gir.',
                    ),
                  ),
                );
                return;
              }

              Navigator.pushReplacement(
                context,
                MaterialPageRoute(builder: (_) => const AnaEkran()),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const SizedBox(height: 45),
                        const Logo(),
                        const SizedBox(height: 60),
                        const Text(
                          'Tekrar hoş geldin',
                          style: TextStyle(
                            fontSize: 31,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'İzle, keşfet ve kendi dünyanı paylaş.',
                          style: TextStyle(color: Colors.white60),
                        ),
                        const SizedBox(height: 35),
                        TextField(
                          controller: email,
                          keyboardType: TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            prefixIcon: Icon(Icons.alternate_email),
                            hintText: 'E-posta adresi',
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: password,
                          obscureText: gizli,
                          decoration: InputDecoration(
                            prefixIcon: const Icon(Icons.lock_outline),
                            hintText: 'Şifre',
                            suffixIcon: IconButton(
                              onPressed: () {
                                setState(() => gizli = !gizli);
                              },
                              icon: Icon(
                                gizli
                                    ? Icons.visibility_off_outlined
                                    : Icons.visibility_outlined,
                              ),
                            ),
                          ),
                        ),
                        Align(
                          alignment: Alignment.centerRight,
                          child: TextButton(
                            onPressed: () {},
                            child: const Text('Şifremi unuttum'),
                          ),
                        ),
                        RenkliButon(
                          yazi: 'Giriş Yap',
                          tiklama: giris,
                        ),
                        const SizedBox(height: 18),
                        OutlinedButton.icon(
                          onPressed: () {
                            Navigator.pushReplacement(
                              context,
                              MaterialPageRoute(
                                builder: (_) => const AnaEkran(),
                              ),
                            );
                          },
                          icon: const Icon(Icons.person_outline),
                          label: const Text('Misafir olarak keşfet'),
                          style: OutlinedButton.styleFrom(
                            minimumSize: const Size.fromHeight(54),
                          ),
                        ),
                        const SizedBox(height: 22),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text(
                              'Hesabın yok mu?',
                              style: TextStyle(color: Colors.white60),
                            ),
                            TextButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const KayitPage(),
                                  ),
                                );
                              },
                              child: const Text('Hesap oluştur'),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class KayitPage extends StatelessWidget {
            const KayitPage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  title: const Text('Yeni hesap'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Logo(),
                      const SizedBox(height: 35),
                      const TextField(
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.person_outline),
                          hintText: 'Adın veya kullanıcı adın',
                        ),
                      ),
                      const SizedBox(height: 14),
                      const TextField(
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.alternate_email),
                          hintText: 'E-posta adresi',
                        ),
                      ),
                      const SizedBox(height: 14),
                      const TextField(
                        obscureText: true,
                        decoration: InputDecoration(
                          prefixIcon: Icon(Icons.lock_outline),
                          hintText: 'Şifre',
                        ),
                      ),
                      const SizedBox(height: 24),
                      RenkliButon(
                        yazi: 'Hesap Oluştur',
                        tiklama: () {
                          Navigator.pushAndRemoveUntil(
                            context,
                            MaterialPageRoute(
                              builder: (_) => const AnaEkran(),
                            ),
                            (_) => false,
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AnaEkran extends StatefulWidget {
            const AnaEkran({super.key});

            @override
            State<AnaEkran> createState() => _AnaEkranState();
          }

          class _AnaEkranState extends State<AnaEkran> {
            int sayfa = 0;

            final ekranlar = const [
              AkisPage(),
              KesfetPage(),
              YuklePage(),
              MesajPage(),
              ProfilPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: sayfa,
                  children: ekranlar,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: sayfa,
                  onDestinationSelected: (i) {
                    setState(() => sayfa = i);
                  },
                  backgroundColor: const Color(0xFF101016),
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Akış',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.explore_outlined),
                      selectedIcon: Icon(Icons.explore),
                      label: 'Keşfet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.add_box_outlined),
                      selectedIcon: Icon(Icons.add_box),
                      label: 'Üret',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.forum_outlined),
                      selectedIcon: Icon(Icons.forum),
                      label: 'Sohbet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Ben',
                    ),
                  ],
                ),
              );
            }
          }

          class AkisPage extends StatelessWidget {
            const AkisPage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Column(
                  children: [
                    const Padding(
                      padding: EdgeInsets.all(17),
                      child: Row(
                        children: [
                          Logo(kucuk: true),
                          Spacer(),
                          Icon(Icons.notifications_none),
                        ],
                      ),
                    ),
                    Expanded(
                      child: PageView.builder(
                        scrollDirection: Axis.vertical,
                        itemCount: 5,
                        itemBuilder: (_, i) {
                          return Container(
                            margin: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(28),
                              gradient: LinearGradient(
                                begin: Alignment.topLeft,
                                end: Alignment.bottomRight,
                                colors: i.isEven
                                    ? const [
                                        Color(0xFF312E81),
                                        Color(0xFF111827),
                                      ]
                                    : const [
                                        Color(0xFF155E75),
                                        Color(0xFF18181B),
                                      ],
                              ),
                            ),
                            child: Stack(
                              children: [
                                const Center(
                                  child: Icon(
                                    Icons.play_circle_fill,
                                    size: 75,
                                    color: Colors.white30,
                                  ),
                                ),
                                Positioned(
                                  left: 20,
                                  bottom: 25,
                                  child: Column(
                                    crossAxisAlignment:
                                        CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        '@ngelx_${i + 1}',
                                        style: const TextStyle(
                                          fontSize: 18,
                                          fontWeight: FontWeight.bold,
                                        ),
                                      ),
                                      const SizedBox(height: 7),
                                      const Text(
                                        'Yeni anları kendi tarzınla keşfet ✨',
                                      ),
                                    ],
                                  ),
                                ),
                                const Positioned(
                                  right: 18,
                                  bottom: 20,
                                  child: Column(
                                    children: [
                                      YanButon(
                                        ikon: Icons.favorite_border,
                                        yazi: '18K',
                                      ),
                                      YanButon(
                                        ikon: Icons.comment_outlined,
                                        yazi: '642',
                                      ),
                                      YanButon(
                                        ikon: Icons.send_outlined,
                                        yazi: 'Paylaş',
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class KesfetPage extends StatelessWidget {
            const KesfetPage({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Column(
                  children: [
                    const Padding(
                      padding: EdgeInsets.all(18),
                      child: Row(
                        children: [
                          Text(
                            'Keşfet',
                            style: TextStyle(
                              fontSize: 29,
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                          Spacer(),
                          Icon(Icons.search),
                        ],
                      ),
                    ),
                    Expanded(
                      child: GridView.builder(
                        padding: const EdgeInsets.all(5),
                        itemCount: 18,
                        gridDelegate:
                            const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 3,
                          childAspectRatio: 0.7,
                          crossAxisSpacing: 5,
                          mainAxisSpacing: 5,
                        ),
                        itemBuilder: (_, i) {
                          return Container(
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(12),
                              color: i.isEven
                                  ? const Color(0xFF292348)
                                  : const Color(0xFF16343B),
                            ),
                            child: const Icon(
                              Icons.play_arrow,
                              color: Colors.white38,
                            ),
                          );
                        },
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class ProfilPage extends StatefulWidget {
            const ProfilPage({super.key});

            @override
            State<ProfilPage> createState() => _ProfilPageState();
          }

          class _ProfilPageState extends State<ProfilPage> {
            String ad = 'NgelX Creator';
            String kullanici = '@ngelx';
            String bio = 'Kendi ritmim, kendi dünyam ✦';

            void duzenle() {
              final adKontrol = TextEditingController(text: ad);
              final kullaniciKontrol = TextEditingController(
                text: kullanici.replaceFirst('@', ''),
              );
              final bioKontrol = TextEditingController(text: bio);

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: panel,
                builder: (ctx) {
                  return Padding(
                    padding: EdgeInsets.fromLTRB(
                      20,
                      25,
                      20,
                      MediaQuery.of(ctx).viewInsets.bottom + 25,
                    ),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const Text(
                          'Profilini düzenle',
                          style: TextStyle(
                            fontSize: 23,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 20),
                        TextField(
                          controller: adKontrol,
                          decoration: const InputDecoration(
                            labelText: 'Görünen ad',
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: kullaniciKontrol,
                          decoration: const InputDecoration(
                            prefixText: '@',
                            labelText: 'Kullanıcı adı',
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: bioKontrol,
                          decoration: const InputDecoration(
                            labelText: 'Biyografi',
                          ),
                        ),
                        const SizedBox(height: 20),
                        RenkliButon(
                          yazi: 'Kaydet',
                          tiklama: () {
                            setState(() {
                              ad = adKontrol.text;
                              kullanici = '@${kullaniciKontrol.text}';
                              bio = bioKontrol.text;
                            });
                            Navigator.pop(ctx);
                          },
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: CustomScrollView(
                  slivers: [
                    SliverToBoxAdapter(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Column(
                          children: [
                            const Row(
                              children: [
                                Logo(kucuk: true),
                                Spacer(),
                                Icon(Icons.settings_outlined),
                              ],
                            ),
                            const SizedBox(height: 25),
                            Container(
                              width: 105,
                              height: 105,
                              padding: const EdgeInsets.all(4),
                              decoration: const BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: LinearGradient(
                                  colors: [mavi, mor],
                                ),
                              ),
                              child: const CircleAvatar(
                                backgroundColor: Color(0xFF24222E),
                                child: Text(
                                  'N',
                                  style: TextStyle(
                                    fontSize: 45,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 14),
                            Text(
                              ad,
                              style: const TextStyle(
                                fontSize: 23,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            Text(
                              kullanici,
                              style: const TextStyle(color: Colors.white54),
                            ),
                            const SizedBox(height: 13),
                            Text(bio),
                            const SizedBox(height: 23),
                            const Row(
                              mainAxisAlignment:
                                  MainAxisAlignment.spaceEvenly,
                              children: [
                                Istatistik('128', 'Takip'),
                                Istatistik('24,8 B', 'Takipçi'),
                                Istatistik('182 B', 'Etkileşim'),
                              ],
                            ),
                            const SizedBox(height: 23),
                            RenkliButon(
                              yazi: 'Profili Düzenle',
                              tiklama: duzenle,
                            ),
                            const SizedBox(height: 25),
                            const Row(
                              mainAxisAlignment:
                                  MainAxisAlignment.spaceAround,
                              children: [
                                Icon(Icons.grid_view),
                                Icon(
                                  Icons.bookmark_border,
                                  color: Colors.white38,
                                ),
                                Icon(
                                  Icons.favorite_border,
                                  color: Colors.white38,
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    SliverPadding(
                      padding: const EdgeInsets.all(5),
                      sliver: SliverGrid(
                        delegate: SliverChildBuilderDelegate(
                          (_, i) => Container(
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(12),
                              color: i.isEven
                                  ? const Color(0xFF28233F)
                                  : const Color(0xFF173036),
                            ),
                            child: const Icon(
                              Icons.play_arrow,
                              color: Colors.white30,
                            ),
                          ),
                          childCount: 15,
                        ),
                        gridDelegate:
                            const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 3,
                          childAspectRatio: 0.72,
                          crossAxisSpacing: 5,
                          mainAxisSpacing: 5,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class YuklePage extends StatelessWidget {
            const YuklePage({super.key});

            @override
            Widget build(BuildContext context) {
              return const BosEkran(
                ikon: Icons.video_call_outlined,
                baslik: 'Yeni içerik üret',
                aciklama: 'Galerinden video seç veya kamerayı aç.',
              );
            }
          }

          class MesajPage extends StatelessWidget {
            const MesajPage({super.key});

            @override
            Widget build(BuildContext context) {
              return const BosEkran(
                ikon: Icons.forum_outlined,
                baslik: 'Sohbetlerin',
                aciklama: 'Yeni bağlantıların burada görünecek.',
              );
            }
          }

          class Logo extends StatelessWidget {
            final bool kucuk;

            const Logo({super.key, this.kucuk = false});

            @override
            Widget build(BuildContext context) {
              return Row(
                mainAxisSize: MainAxisSize.min,
                mainAxisAlignment: kucuk
                    ? MainAxisAlignment.start
                    : MainAxisAlignment.center,
                children: [
                  Container(
                    width: kucuk ? 35 : 50,
                    height: kucuk ? 35 : 50,
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(14),
                      gradient: const LinearGradient(
                        colors: [mavi, mor],
                      ),
                    ),
                    child: const Icon(Icons.bolt),
                  ),
                  const SizedBox(width: 10),
                  Text(
                    'NgelX',
                    style: TextStyle(
                      fontSize: kucuk ? 22 : 35,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ],
              );
            }
          }

          class RenkliButon extends StatelessWidget {
            final String yazi;
            final VoidCallback tiklama;

            const RenkliButon({
              super.key,
              required this.yazi,
              required this.tiklama,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: tiklama,
                child: Ink(
                  height: 54,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(18),
                    gradient: const LinearGradient(
                      colors: [mavi, mor],
                    ),
                  ),
                  child: Center(
                    child: Text(
                      yazi,
                      style: const TextStyle(
                        fontSize: 16,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class YanButon extends StatelessWidget {
            final IconData ikon;
            final String yazi;

            const YanButon({
              super.key,
              required this.ikon,
              required this.yazi,
            });

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.only(top: 16),
                child: Column(
                  children: [
                    Icon(ikon, size: 32),
                    Text(yazi, style: const TextStyle(fontSize: 11)),
                  ],
                ),
              );
            }
          }

          class Istatistik extends StatelessWidget {
            final String sayi;
            final String yazi;

            const Istatistik(this.sayi, this.yazi, {super.key});

            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  Text(
                    sayi,
                    style: const TextStyle(
                      fontSize: 19,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  Text(
                    yazi,
                    style: const TextStyle(
                      color: Colors.white54,
                      fontSize: 12,
                    ),
                  ),
                ],
              );
            }
          }

          class BosEkran extends StatelessWidget {
            final IconData ikon;
            final String baslik;
            final String aciklama;

            const BosEkran({
              super.key,
              required this.ikon,
              required this.baslik,
              required this.aciklama,
            });

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Center(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(ikon, size: 65, color: mavi),
                      const SizedBox(height: 18),
                      Text(
                        baslik,
                        style: const TextStyle(
                          fontSize: 24,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 7),
                      Text(
                        aciklama,
                        style: const TextStyle(color: Colors.white54),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: APK olustur
        run: |
          cd ngelx_app
          flutter pub get
          flutter build apk --debug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-APK-v2
          path: ngelx_app/build/app/outputs/flutter-apk/app-debug.apk
