name: Ngel X v27 BUILD 312 MEDIA ROOT FIX

on:
  workflow_dispatch:
  push:
    branches:
      - work/build312-media-root-fix-v2
    paths:
      - 'app/**'
      - 'tools/verify_build312_media_root_fix.py'
      - '.github/workflows/NgelX-v27-BUILD-312-MEDIA-ROOT-FIX.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 312 medya kok duzeltmesini uygula ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          PATCH_GZ_B64=''
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress | git apply
          python3 tools/verify_build312_media_root_fix.py
          python3 tools/verify_ngelx_contract.py
          git diff --check

      - name: Medya servis sagligini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://ngelx-media.alihancaglar76.workers.dev/health" "https://ngelx-upload.alihancaglar76.workers.dev/health"; do
            body="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 "$url")"
            echo "$body"
            grep -q '"r2":true' <<<"$body"
            grep -q '"directUpload":true' <<<"$body"
          done

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/ngelx-key.txt
          grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA' /tmp/ngelx-key.txt

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then exit 1; fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: Build 312 kaynagini dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NgelX Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart app/pubspec.yaml app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt
          git commit -m "Build 312: apply Android media root fix [skip ci]"
          git push origin HEAD:work/build312-media-root-fix-v2

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.93-Build-312-MEDIA-ROOT-FIX
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
