name: NgelX Build530 Group Exit Rejoin Guard QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build530-group-exit-rejoin-guard-20261019
  pull_request:
    branches:
      - qa/ngelx-build529-live-guest-moderation-cap-20261019
    paths:
      - 'app/lib/build517_group_leave.dart'
      - 'app/lib/build527_group_join_transaction.dart'
      - 'server/livekit443/room-policy*.mjs'
      - 'tools/test_build530_group_exit_guard.py'
      - '.github/workflows/NgelX-BUILD530-GROUP-EXIT-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exit-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, server policy and cross-feature regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_build530_group_exit_guard.py
          python3 tools/test_build527_group_join_transaction.py
          node --check server/livekit443/room-policy.mjs
          node --check server/livekit443/room-policy.test.mjs
          node --test server/livekit443/room-policy.test.mjs server/livekit443/live-moderation.test.mjs server/livekit443/live-moderation-adapters.test.mjs server/livekit443/firestore-adapters.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Confirm no deployment or production credential use
        run: echo 'Build530 is source/server QA only; no deploy, production Firebase/LiveKit writes, or APK claims.'
