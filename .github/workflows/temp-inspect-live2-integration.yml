name: NgelX TEMP inspect LIVE2 integration

on:
  workflow_dispatch:
  push:
    branches:
      - work/live2-full-package
    paths:
      - '.github/workflows/temp-inspect-live2-integration.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/live2-full-package
      - name: Extract focused integration contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('app/lib/main.dart').read_text(encoding='utf-8').splitlines()
          needles=[
            'addIntroVideo','changeIntroVideo','introVideo','intro_video','tanitim','tanıtım',
            'KullaniciProfilPage','ProfilPage','Profilim','profileVideo',
            'AktivitePage','sourceId','targetKind','eventKind','eventAction',
            'uygulamaBildirimiGonder','photoUrl','CircleAvatar','_yayinIzle'
          ]
          hit=set()
          for i,line in enumerate(lines):
            low=line.lower()
            if any(n.lower() in low for n in needles):
              for j in range(max(0,i-45),min(len(lines),i+75)):
                hit.add(j)
          # Also include exact fixed ranges we already know are relevant.
          for a,b in [(2320,2520),(5550,5880),(7150,7650),(8850,9100),(16300,18500),(18500,21500)]:
            for j in range(max(0,a-1),min(len(lines),b)):
              if any(n.lower() in lines[j].lower() for n in needles) or a in (2320,5550,7150,8850):
                for k in range(max(0,j-35),min(len(lines),j+55)): hit.add(k)
          ordered=sorted(hit)
          out=[]
          last=None
          for j in ordered:
            if last is None or j>last+1:
              out.append(f'===== LINES {j+1} =====')
            out.append(f'{j+1:06d}: {lines[j]}')
            last=j
          Path('/tmp/build325-focused-context.txt').write_text('\n'.join(out),encoding='utf-8')
          print('exported',len(ordered))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build325-focused-context
          path: /tmp/build325-focused-context.txt
          retention-days: 1
