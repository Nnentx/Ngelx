name: Ngel X v22 BUILD 306 GUNCEL KAYNAK MEDYA FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Guncel kaynak ve medya kok fix kontrolu
        shell: bash
        run: |
          set -euo pipefail
          test -s app/lib/main.dart
          test -s app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt
          grep -q '^version: 1.0.87+306$' app/pubspec.yaml
          grep -q 'ACTION_GET_CONTENT' app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt
          grep -q '"pickDocument", "pickDocuments"' app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt
          grep -q 'Future<XFile?> ngelxResimSec' app/lib/main.dart
          grep -q 'Future<XFile?> ngelxVideoSec' app/lib/main.dart
          grep -q 'Future<List<XFile>> ngelxCokluResimSec' app/lib/main.dart
          grep -q 'Future<XFile?> ngelxDosyaSec' app/lib/main.dart
          test "$(grep -o 'ImagePicker().pickImage(' app/lib/main.dart | wc -l)" -eq 1
          test "$(grep -o 'ImagePicker().pickVideo(' app/lib/main.dart | wc -l)" -eq 1
          test "$(grep -o 'ImagePicker().pickMultiImage(' app/lib/main.dart | wc -l)" -eq 1
          test "$(grep -o 'openFile(' app/lib/main.dart | wc -l)" -eq 2
          grep -q 'android.intent.action.GET_CONTENT' app/android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ngelx_launcher_mark"' app/android/app/src/main/AndroidManifest.xml

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Imza anahtarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA'

      - name: Bagimliliklari al ve analiz et
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo 'Gercek Flutter analiz hatasi bulundu.' >&2
            exit 1
          fi

      - name: APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-v22-BUILD-306-GUNCEL-KAYNAK-MEDYA-FIX
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
