name: Ngel X v45 BUILD 330 MEDIA LIVE HOST

on:
  workflow_dispatch:
  push:
    branches:
      - work/build330-media-live-host
    paths:
      - '.github/workflows/NgelX-v45-BUILD-330-MEDIA-LIVE-HOST.yml'
      - 'app/lib/main.dart'
      - 'app/lib/live_broadcast_studio.dart'
      - 'app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt'
      - 'app/pubspec.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build330-media-live-host
          fetch-depth: 0

      - name: Build 330 kaynak sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          grep -F "version: 1.0.111+330" app/pubspec.yaml
          grep -F "defaultValue: '330'" app/lib/main.dart
          grep -F "ngelx_media_staging" app/lib/main.dart
          grep -F "ngelx_media_staging/picker" app/android/app/src/main/kotlin/com/nnentx/ngelx_app/MainActivity.kt
          grep -F "Kişiler yükleniyor..." app/lib/main.dart
          grep -F "'welcomeMessage': 'Hoş geldiniz 👋'" app/lib/live_broadcast_studio.dart
          grep -F "'YAYINCI'" app/lib/live_broadcast_studio.dart
          grep -F "'isHost':widget.yayinSahibi" app/lib/live_broadcast_studio.dart
          git diff --check HEAD~1..HEAD || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: İmza anahtarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/ngelx-key.txt
          grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA' /tmp/ngelx-key.txt

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then exit 1; fi

      - name: APK oluştur ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.111-Build-330-MEDIA-LIVE-HOST
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
