name: Ngel X BUILD 340 SOURCE SNAPSHOT

on:
  push:
    branches:
      - work/build340-audio-live-activity-refresh
    paths:
      - '.github/workflows/NgelX-BUILD-340-SOURCE-SNAPSHOT.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build340-audio-live-activity-refresh
          fetch-depth: 0
      - name: Collect sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/src/app/lib
          cp app/lib/main.dart /tmp/src/app/lib/main.dart
          cp app/lib/live_broadcast_studio.dart /tmp/src/app/lib/live_broadcast_studio.dart
          cp app/lib/live_feed_card.dart /tmp/src/app/lib/live_feed_card.dart
          cp app/lib/live_pk.dart /tmp/src/app/lib/live_pk.dart
          cp app/pubspec.yaml /tmp/src/app/pubspec.yaml
          cp firestore.rules /tmp/src/firestore.rules
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build-340-source-snapshot
          path: /tmp/src
          if-no-files-found: error
          retention-days: 2
