name: NgelX BUILD 411 PROFILE INSPECTION
on:
  push:
    branches: [work/build-411-approved-profile-ui]
    paths:
      - 'tools/apply_build406_final_eight.py'
      - 'tools/apply_build407_consolidated.py'
      - 'tools/apply_build408_defects_first.py'
      - 'tools/apply_build409_search_relevance.py'
      - 'tools/apply_build409_group_notice_fix.py'
      - 'tools/check_build409_search_relevance.py'
      - 'tools/check_build408_defects_first.py'
      - 'tools/check_build407_regression.py'
      - 'tools/check_build406_regression.py'
      - '.github/workflows/NgelX-BUILD-411-PROFILE-INSPECTION.yml'
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Apply Build 395-406 and test source preservation
      shell: bash
      run: |
        set -euo pipefail
        python3 -u tools/apply_build395_final_login_inbox_ui.py
        python3 -u tools/apply_build396_inbox_final_polish.py
        python3 -u tools/apply_build397_inbox_complete_fixes.py
        python3 -u tools/apply_build398_login_story_polish.py
        python3 -u tools/apply_build399_registration_profile_cover.py
        python3 -u tools/apply_build399_explore_reference_ui.py
        python3 -u tools/apply_build399_create_reference_ui.py
        python3 -u tools/apply_build399_profile_reference_ui.py
        python3 -u tools/check_build399_regression.py
        python3 -u tools/apply_build400_cover_upload_hotfix.py
        python3 -u tools/check_build400_cover_upload.py
        python3 -u tools/apply_build401_profile_stability.py
        python3 -u tools/check_build401_profile_regression.py
        python3 -u tools/apply_build402_profile_reference_polish.py
        python3 -u tools/check_build402_profile_regression.py
        python3 -u tools/apply_build403_profile_live_audio.py
        python3 -u tools/check_build403_regression.py
        python3 -u tools/apply_build404_profile_live_voice_fixes.py
        python3 -u tools/check_build404_regression.py
        python3 -u tools/apply_build405_single_device_final.py
        python3 -u tools/check_build405_regression.py
        python3 -u tools/apply_build406_final_eight.py
        python3 -u tools/check_build406_regression.py
        python3 -u tools/apply_build407_consolidated.py
        python3 -u tools/check_build407_regression.py
        python3 -u tools/apply_build408_defects_first.py
        python3 -u tools/check_build408_defects_first.py
        python3 -u tools/apply_build409_group_notice_fix.py
        python3 -u tools/apply_build409_search_relevance.py
        python3 -u tools/check_build409_search_relevance.py
        python3 -m py_compile tools/apply_build407_consolidated.py tools/check_build407_regression.py tools/apply_build408_defects_first.py

    - name: Inspect existing owner other and edit profile contracts
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        s=Path('app/lib/main.dart').read_text(encoding='utf-8').splitlines()
        print('TOTAL',len(s))
        for i,v in enumerate(s):
          if v.lstrip().startswith('class ') and any(q in v.lower() for q in ('profil','profile','duzenl','düzenl')):
            print('CLASS',i+1,v[:180])
        targets=['class _ProfilPageState extends State<ProfilPage>',
                 'class _KullaniciProfilPageState extends State<KullaniciProfilPage>',
                 'class ProfilDuzenlePage',
                 'class _ProfilDuzenle',
                 'kapakFotografiDuzenle()',
                 'Widget _profilGrid()',
                 'coverPhotoUrl',
                 'Profili Düzenle',
                 'class KullaniciProfilPage',
                 'Widget _profilSayac']
        for term in targets:
          hits=[i for i,v in enumerate(s) if term.lower() in v.lower()]
          print('HITS',term,len(hits),[i+1 for i in hits[:18]])
        for title,term,before,after in [
          ('OWNER_BUILD','class _ProfilPageState extends State<ProfilPage>',0,170),
          ('OTHER_BUILD','class _KullaniciProfilPageState extends State<KullaniciProfilPage>',0,115),
          ('OWNER_END','Widget _profilGrid()',-90,60),
          ('OWNER_COVER','Kapak Fotoğrafını',-42,135),
          ('OTHER_COVER','final canliAday',-24,165),
          ('OTHER_STATS','Widget _profilSayac',-120,24)
        ]:
          hits=[i for i,v in enumerate(s) if term.lower() in v.lower()]
          print('SECTION',title,len(hits))
          for i in hits[:1]:
            for n in range(max(0,i+before),min(len(s),i+after)):
              print(f'{n+1}: {s[n][:330]}')
        PY
