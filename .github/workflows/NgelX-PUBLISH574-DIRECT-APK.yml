name: Publish tested Build574 APK
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-PUBLISH574-DIRECT-APK.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful Build574 tests before publishing
        run: |
          set -euo pipefail
          gh run watch 40291524551 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40291524551 --jq .conclusion)" = success
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40291524551 --jq .head_sha)" = 21bc6d539331d456b4bbdf315940a5fe917e913d
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build574-Review-APK
          run-id: 40291524551
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate the exact tested APK and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();sha=hashlib.sha256(raw).hexdigest()
          assert 40_000_000<len(raw)<100_000_000
          assert len(sha)==64
          print('Validated Build574 SHA256:',sha)
          with __import__('zipfile').ZipFile(files[0]) as z:
              assert z.testzip() is None and 'assets/flutter_assets/AssetManifest.bin' in z.namelist()
          name='NgelX-1.0.344-Build574.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(sha+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.344','build':574,'size':len(raw),'sha256':sha,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.344-build574-test/'+name,'notes':'Build574 test: Tek oynanabilir taş otomatik ilerler; +1 alınınca başka kareye taşınır; daha dolgun parlak taşlar, Messenger tarzı küçük güç artıları ve kaldırılan alt sıra yazısı. Test sürümü, canlı güncelleme değişmez.','testedSource':'21bc6d539331d456b4bbdf315940a5fe917e913d','buildRun':40291524551}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('notes.md').write_text('NgelX 1.0.344 / Build574 TEST.\\n\\nKlasik ve Power Ludo, izleyici sayacı, 2/4 oyuncu, 3 zar başlangıç hakkı, sesli odaya katılma sesi, sohbet performansı ve özel/grup sohbetinde Ludo daveti.\\n\\nCI testleri, APK imzası ve önceki görseller doğrulandı; gerçek cihaz oyun ve ses kontrolleri ayrıca gereklidir.\\n')
          PY
      - name: Preserve tested source using the existing trusted release workflow tree
        run: |
          gh api repos/Nnentx/Ngelx/git/trees/main > main-tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          trusted=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'21bc6d539331d456b4bbdf315940a5fe917e913d','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE574_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('commit.json').write_text(json.dumps({'message':'Build574 tested preview source snapshot for APK direct download','tree':json.load(open('tree-result.json'))['sha'],'parents':['21bc6d539331d456b4bbdf315940a5fe917e913d']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish APK and verify the public download bytes
        run: |
          if gh release view v1.0.344-build574-test >/dev/null 2>&1; then
            gh release download v1.0.344-build574-test --pattern NgelX-1.0.344-Build574.apk --dir existing
            cmp NgelX-1.0.344-Build574.apk existing/NgelX-1.0.344-Build574.apk
          else
            target=$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")
            gh release create v1.0.344-build574-test NgelX-1.0.344-Build574.apk NgelX-1.0.344-Build574.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.344 / Build574 test' --notes-file notes.md
            gh release download v1.0.344-build574-test --pattern NgelX-1.0.344-Build574.apk --dir existing
            cmp NgelX-1.0.344-Build574.apk existing/NgelX-1.0.344-Build574.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build574-Release-Metadata
          path: android-update.json

