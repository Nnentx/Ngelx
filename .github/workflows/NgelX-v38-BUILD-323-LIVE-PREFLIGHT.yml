name: Ngel X v38 BUILD 323 LIVE PREFLIGHT

on:
  workflow_dispatch:
  push:
    branches:
      - work/build323-live-preflight
    paths:
      - 'app/**'
      - 'tools/apply_build323_live_preflight.py'
      - 'tools/verify_build323_live_preflight.py'
      - 'tools/verify_ngelx_contract.py'
      - '.github/workflows/NgelX-v38-BUILD-323-LIVE-PREFLIGHT.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build323-live-preflight
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build 323 canlı yayın ön hazırlığını uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_build323_live_preflight.py
          python3 tools/verify_build323_live_preflight.py
          git diff --check

      - name: Sabit NgelX imza anahtarını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: İmza anahtarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/ngelx-key.txt
          grep -F 'SHA256: BE:20:B2:7F:0B:A1:F4:DE:CD:29:41:D4:10:B1:53:6D:E8:9E:48:DC:89:4F:04:F0:38:F9:D2:6B:11:EC:D6:AA' /tmp/ngelx-key.txt

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then exit 1; fi

      - name: APK oluştur ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: Doğrulanmış Build 323 kaynağını dala yaz
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/lib/main.dart app/pubspec.yaml; then
            echo "Build 323 source already committed."
            exit 0
          fi
          git config user.name "NgelX Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/main.dart app/pubspec.yaml
          git commit -m "Build 323: live preflight camera filters and switch"
          git push origin HEAD:work/build323-live-preflight

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.104-Build-323-LIVE-PREFLIGHT
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
