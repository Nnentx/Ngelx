name: NgelX V44 Test ve Hiz Duzeltmeleri

on:
  workflow_dispatch:
  push:
    branches: [ngelx-v44-test-fixes, ngelx-v45-work]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - '.github/workflows/build-v44-test.yml'

concurrency:
  group: ngelx-v44-test
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Debug APK ile tam derleme kontrolu
        working-directory: app
        run: flutter build apk --debug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V44-CI-DEBUG-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
