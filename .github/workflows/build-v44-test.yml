name: NgelX V44 Test ve Hiz Duzeltmeleri

on:
  workflow_dispatch:
  push:
    branches: [ngelx-v44-test-fixes]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - '.github/workflows/build-v44-test.yml'

concurrency:
  group: ngelx-v44-test
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Firestore kurallarini yayinla
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN yok; Firestore kurallari bu calistirmada yayinlanmadi."
            exit 0
          fi
          npx --yes firebase-tools deploy --project ngelx-44eed --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      - name: Test imza anahtarını sabitle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-android-debug-keystore-v1

      - name: Test imza anahtarını hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NGELX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Kalıcı release imzası mevcut; test debug anahtarı kullanılmayacak."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Sabit test imza anahtarı bulunamadı. Yeni anahtar üretmek paket güncellemelerini bozacağı için derleme durduruldu."
            exit 1
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:|Valid from:" || true

      - name: Kalıcı imzayı hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NGELX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NGELX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NGELX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NGELX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kalıcı imza secret'ı yok; release APK debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/ngelx-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ngelx-release.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties

      - name: Release APK olustur
        working-directory: app
        run: flutter build apk --release

      - name: APK imzasını doğrula
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NGELX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if [ -z "$KEYSTORE_BASE64" ]; then
            EXPECTED="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')"
            ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
            echo "Beklenen test sertifikası: $EXPECTED"
            echo "APK sertifikası:          $ACTUAL"
            test "$EXPECTED" = "$ACTUAL"
          fi

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V44-TEST-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
