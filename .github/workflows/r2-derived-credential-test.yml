name: Verify Derived R2 Credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-derived-credential-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Paketleri kur
        working-directory: cloudflare/worker
        run: npm install

      - name: Cloudflare API tokeninden R2 S3 kimligini dogrula
        working-directory: cloudflare/worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERIFY="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" || true)"
          TOKEN_ID="$(jq -r '.result.id // empty' <<<"$VERIFY")"

          if [ -z "$TOKEN_ID" ]; then
            VERIFY="$(curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/user/tokens/verify")"
            TOKEN_ID="$(jq -r '.result.id // empty' <<<"$VERIFY")"
          fi

          if [ -z "$TOKEN_ID" ]; then
            echo "Cloudflare token ID bulunamadi."
            exit 2
          fi

          R2_SECRET="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$TOKEN_ID"
          echo "::add-mask::$R2_SECRET"

          export R2_ACCESS_KEY_ID="$TOKEN_ID"
          export R2_SECRET_ACCESS_KEY="$R2_SECRET"
          export R2_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"

          node --input-type=module <<'NODE'
          import { AwsClient } from 'aws4fetch';
          const account=process.env.R2_ACCOUNT_ID;
          const key='__ngelx_ci/derived-'+Date.now()+'.txt';
          const body=new TextEncoder().encode('ngelx-r2-derived-credential-test');
          const encoded=key.split('/').map(encodeURIComponent).join('/');
          const url=`https://${account}.r2.cloudflarestorage.com/ngelx-media/${encoded}`;
          const client=new AwsClient({
            service:'s3',
            region:'auto',
            accessKeyId:process.env.R2_ACCESS_KEY_ID,
            secretAccessKey:process.env.R2_SECRET_ACCESS_KEY,
          });

          const put=await client.fetch(url,{
            method:'PUT',
            headers:{'Content-Type':'text/plain'},
            body,
          });
          console.log('derived PUT status='+put.status);
          if(!put.ok){
            console.log((await put.text()).slice(0,500));
            process.exit(3);
          }

          const get=await client.fetch(url,{method:'GET'});
          console.log('derived GET status='+get.status);
          const got=await get.text();
          if(!get.ok||got!=='ngelx-r2-derived-credential-test'){
            console.log(got.slice(0,500));
            process.exit(4);
          }

          const del=await client.fetch(url,{method:'DELETE'});
          console.log('derived DELETE status='+del.status);
          if(!del.ok)process.exit(5);
          console.log('DERIVED_R2_CREDENTIALS_PASS');
          NODE
