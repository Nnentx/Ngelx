name: NgelX Build528 Missing Time Guard Smoke QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build528-safe-missed-call-age-20261019
  pull_request:
    branches:
      - qa/ngelx-build527-group-join-transaction-20261019
    paths:
      - 'app/lib/build527_group_join_transaction.dart'
      - 'tools/*527*'
      - 'tools/*528*'
      - 'app/lib/build526_atomic_group_timeout.dart'
      - '.github/workflows/NgelX-BUILD528-SAFE-TIMEOUT-SMOKE-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source and server syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_build527_group_join_transaction.py tools/test_build527_group_join_transaction.py tools/test_build528_group_timeout_age.py
          node --check tools/build527_group_join_rules_test.mjs
          python3 tools/test_build528_group_timeout_age.py
          node --check tools/build528_group_timeout_age_rules_test.mjs
          node --check server/livekit443/room-policy.mjs
      - name: Local Firestore emulator group lifecycle and reconnect safety
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
          python3 tools/apply_build511_gift_rules.py
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build517_group_leave_rules_test.mjs && node tools/build526_atomic_group_timeout_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs" || { tail -100 firestore-debug.log; exit 1; }
      - name: No production changes
        run: echo 'Firestore demo project emulator only. No secrets or deployment.'
