name: NgelX Build447 read current rules
on:
  push:
    branches: [work/build-447-story-call-fixes]
    paths: ['.github/workflows/NgelX-BUILD447-RULES-INSPECT.yml', 'tools/inspect_build447_rules.py']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-auth requests
      - name: Read current rules without changes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: python3 tools/inspect_build447_rules.py
      - uses: actions/upload-artifact@v4
        with:
          name: Build447-current-rules
          path: |
            build447-deployed.rules
            build447-rules-release.json
