name: NgelX V56 Group Parity

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'tools/**'
      - '.github/workflows/build-v55-group-final-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngelx-v56-main-group-parity
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: NgelX sozlesmesini dogrula
        run: python3 tools/verify_ngelx_contract.py

      - name: R2 Worker JavaScript kontrolu
        run: node --check cloudflare/worker/src/index.js

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok."
          fi

      - name: Debug APK derle
        working-directory: app
        run: flutter build apk --debug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V56-GROUP-PARITY-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
