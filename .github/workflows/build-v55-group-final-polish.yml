name: NgelX V64 App Quality Performance

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'tools/**'
      - 'firestore.rules'
      - '.github/workflows/build-v55-group-final-polish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'tools/**'
      - 'firestore.rules'
      - '.github/workflows/build-v55-group-final-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngelx-v64-app-quality-performance
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NGELX_LIVE_API_URL: ${{ vars.NGELX_LIVE_API_URL }}
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kilit dosyasi temizligini dogrula
        run: git diff --exit-code -- app/pubspec.lock

      - name: NgelX sozlesmesini dogrula
        run: python3 tools/verify_ngelx_contract.py

      - name: V63 grup QA ve girdi performans hedeflerini dogrula
        shell: bash
        run: |
          grep -Eq '^version: 1\.0\.[0-9]+\+[0-9]+$' app/pubspec.yaml
          grep -q "bool ngelxPresenceOnline" app/lib/main.dart
          grep -q "Profili görüntüle" app/lib/main.dart
          grep -q "final sadeMedya=" app/lib/main.dart
          grep -q "Grup bilgileri yükleniyor" app/lib/main.dart
          grep -q "en fazla 10 yönetici" app/lib/main.dart
          grep -q "exitActorName_" app/lib/main.dart
          grep -q "member_add" app/lib/main.dart
          grep -q "kişi için onay iste" app/lib/main.dart
          grep -q "Gruptan ayrıldın" app/lib/main.dart
          grep -q "gorulenIds.take(4)" app/lib/main.dart
          grep -q "replyToMediaUrl" app/lib/main.dart
          grep -q "NgelXReplyMediaPreview" app/lib/main.dart
          grep -q "Icons.replay_10_rounded" app/lib/main.dart
          grep -q "Icons.forward_10_rounded" app/lib/main.dart
          grep -q "backgroundVersion" app/lib/main.dart
          grep -q "nickname_changed" app/lib/main.dart
          grep -q "VideoParametersPresets.h360_169" app/lib/main.dart
          grep -q "Mesajı sabitle" app/lib/main.dart
          grep -q "group_archives" app/lib/group_quality.dart
          grep -q "deliveredTo" app/lib/group_quality.dart
          grep -q "seenBy" app/lib/group_quality.dart
          grep -q "match /group_archives/{uid}/items/{chatId}" firestore.rules

      - name: V61 test edilen grup sorunlarini tek tek dogrula
        run: python3 tools/verify_v61_group_qa.py

      - name: V62 performans duzeltmelerini dogrula
        run: python3 tools/verify_v62_performance.py

      - name: V63 girdi performans duzeltmelerini dogrula
        run: python3 tools/verify_v63_input_performance.py

      - name: V64 Akis Uret Kesfet Profil Ayarlar kalite kontrolleri
        run: python3 tools/verify_v64_app_quality.py

      - name: R2 Worker JavaScript kontrolu
        run: node --check cloudflare/worker/src/index.js

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok."
          fi

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore grup kurallarini emulator ile test et
        run: |
          npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
          npx firebase emulators:exec --only firestore --project demo-ngelx "node tools/firestore_rules_test.mjs"

      - name: Sabit debug imzasini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Release APK derle
        working-directory: app
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          BUILD_NAME="${APP_VERSION%%+*}"
          BUILD_NUMBER="${APP_VERSION##*+}"
          test "$NGELX_LIVE_API_URL" = "https://ngelx-live-test.onrender.com/live"
          flutter build apk --release \
            --dart-define=NGELX_LIVE_API_URL="$NGELX_LIVE_API_URL" \
            --dart-define=NGELX_VERSION_NAME="$BUILD_NAME" \
            --dart-define=NGELX_BUILD_NUMBER="$BUILD_NUMBER"

      - name: APK imza parmak izini dogrula
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee apk-signature.txt
          grep -qi "be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa" apk-signature.txt
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging app/build/app/outputs/flutter-apk/app-release.apk | tee apk-manifest.txt
          grep -q "versionCode='349'" apk-manifest.txt
          if grep -q "application-debuggable" apk-manifest.txt; then exit 1; fi

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-BUILD-349-RELEASE-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
