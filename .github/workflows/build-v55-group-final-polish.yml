name: NgelX V57 Group Polish

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'tools/**'
      - 'firestore.rules'
      - '.github/workflows/build-v55-group-final-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngelx-v57-main-group-polish
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kilit dosyasi temizligini dogrula
        run: git diff --exit-code -- app/pubspec.lock

      - name: NgelX sozlesmesini dogrula
        run: python3 tools/verify_ngelx_contract.py

      - name: R2 Worker JavaScript kontrolu
        run: node --check cloudflare/worker/src/index.js

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok."
          fi

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore grup kurallarini emulator ile test et
        run: |
          npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
          npx firebase emulators:exec --only firestore --project demo-ngelx "node tools/firestore_rules_test.mjs"

      - name: Sabit debug imzasini geri yukle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1

      - name: Sabit debug anahtari yoksa olustur
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \\
              -keystore "$HOME/.android/debug.keystore" \\
              -storepass android \\
              -alias androiddebugkey \\
              -keypass android \\
              -dname "CN=Android Debug,O=Android,C=US" \\
              -keyalg RSA \\
              -keysize 2048 \\
              -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Debug APK derle
        working-directory: app
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          BUILD_NAME="${APP_VERSION%%+*}"
          BUILD_NUMBER="${APP_VERSION##*+}"
          flutter build apk --debug \
            --dart-define=NGELX_VERSION_NAME="$BUILD_NAME" \
            --dart-define=NGELX_BUILD_NUMBER="$BUILD_NUMBER"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V57-GROUP-MESSENGER-POLISH-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
