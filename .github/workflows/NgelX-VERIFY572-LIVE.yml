name: Verify NgelX Build572 live update feed
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-VERIFY572-LIVE.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm live in-app updater serves exact Build572 and verified APK
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "https://ngelxsocial.com/android-update.json?verify=572-$attempt" -o /tmp/ng-update.json; then
              if python3 - <<'PY'
          import json
          j=json.load(open('/tmp/ng-update.json'))
          assert j['version']=='1.0.342' and j['build']==572
          assert j['package']=='com.nnentx.ngelx_app' and j['abi']=='arm64-v8a'
          assert j['sha256']=='65818622e57b746405858aa28ef3055102b06c8aa80a968b3fe5819c7164604c'
          assert j['size']==48671470
          assert j['url']=='https://github.com/Nnentx/Ngelx/releases/download/v1.0.342-build572-test/NgelX-1.0.342-Build572.apk'
          print('Verified production in-app update manifest for Build572')
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          echo 'The public app update feed did not report the verified Build572'
          exit 1
