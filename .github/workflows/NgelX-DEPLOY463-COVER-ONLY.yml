name: NgelX DEPLOY463 Cover Only Approved

on:
  push:
    branches:
      - work/diag463-production-rule-version
    paths:
      - '.github/workflows/NgelX-DEPLOY463-COVER-ONLY.yml'

permissions:
  contents: read

concurrency:
  group: ngelx-cover-rules-production
  cancel-in-progress: false

jobs:
  deploy-cover-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Python with Firebase API client
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node for Firebase tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java for Firestore rules emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and API dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check google-auth requests
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Construct cover-only patch against currently deployed rules
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 tools/dry_run_build463_production_rules.py
          python3 -m py_compile tools/deploy_build463_cover_only.py
      - name: Validate production-based candidate in local emulator
        run: |
          set -euo pipefail
          npx --no-install firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build450_rules_test.mjs && node tools/build455_rules_test.mjs && node tools/build457_cover_rules_test.mjs"
      - name: Deploy ONLY the tested cover update rule after concurrency check
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 tools/deploy_build463_cover_only.py
      - name: Confirm scope
        if: always()
        run: echo 'This job does not deploy Firestore indexes, storage rules, functions, hosting or client app, and never edits user records.'
