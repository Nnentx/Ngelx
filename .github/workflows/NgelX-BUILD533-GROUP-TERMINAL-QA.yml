name: NgelX Build533 Group Terminal State Rules QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build533-group-terminal-state-guard-20261019
  pull_request:
    branches:
      - qa/ngelx-build532-group-room-participant-guard-20261019
    paths:
      - 'firestore.rules'
      - 'tools/build533_group_terminal_rules_test.mjs'
      - '.github/workflows/NgelX-BUILD533-GROUP-TERMINAL-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group-terminal-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and server permission regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build533_group_terminal_rules_test.mjs
          python3 tools/test_build530_group_exit_guard.py
          node --test server/livekit443/room-policy.test.mjs
      - name: Local Firestore emulator dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Test Build533 and previous group call rules in local emulator
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build533_group_terminal_rules_test.mjs && node tools/build532_group_room_rules_test.mjs && node tools/build531_group_exit_rules_test.mjs && node tools/build517_group_leave_rules_test.mjs && node tools/build526_atomic_group_timeout_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs"
      - name: Confirm no production changes
        run: echo 'Build533 local-only QA; no production Firebase rules deployment, LiveKit writes, main merge or Build484 update.'
