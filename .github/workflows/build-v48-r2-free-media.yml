name: NgelX V48 R2 Ucretsiz Medya

on:
  push:
    branches: [ngelx-v48-r2-free-media]
    paths:
      - 'app/**'
      - 'cloudflare/worker/**'
      - 'firestore.rules'
      - '.github/workflows/build-v48-r2-free-media.yml'
  workflow_dispatch:

concurrency:
  group: ngelx-v48-r2-free-media
  cancel-in-progress: true

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
      - name: Worker JavaScript kontrolu
        run: node --check cloudflare/worker/src/index.js

  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri kur
        working-directory: app
        run: flutter pub get

      - name: Kod analizi
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testleri calistir
        working-directory: app
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Test klasoru yok; derleme kontrolune geciliyor."
          fi

      - name: Debug APK derle
        working-directory: app
        run: flutter build apk --debug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-V48-R2-UCRETSIZ-MEDYA-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
