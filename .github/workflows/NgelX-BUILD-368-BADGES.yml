name: Ngel X BUILD 368 BADGES

on:
  workflow_dispatch:
  push:
    branches:
      - work/build368-badges-effects-foundation
    paths:
      - '.github/workflows/NgelX-BUILD-368-BADGES.yml'
      - 'app/lib/main.dart'
      - 'app/pubspec.yaml'
      - 'WORK_PACKAGE_TEST_NOTES.md'

permissions:
  contents: read

concurrency:
  group: ngelx-build368-badges
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4
        with:
          ref: work/build368-badges-effects-foundation
          fetch-depth: 0

      - name: Build 368 statik regresyon kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "version: 1.0.147+368" app/pubspec.yaml
          grep -F "defaultValue: '1.0.147'" app/lib/main.dart
          grep -F "defaultValue: '368'" app/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/lib/main.dart').read_text(encoding='utf-8')

          # Profil zil rozeti Activity ile aynı görünürlük filtresinde.
          profile_fragment="d.data()['read']!=true&&ngelxAktiviteBildirimiGosterilir(d.data())"
          assert main.count(profile_fragment) >= 3

          # Mesaj İstekleri kartı canlı pending sayaç kullanıyor.
          assert "var bekleyenIstek=0;" in main
          assert "if(pending)bekleyenIstek++;" in main
          assert "label:Text(_sayacEtiketi(bekleyenIstek))" in main
          assert "v['requestAccepted_$ben']!=true" in main
          assert "v['requestRejected_$ben']!=true" in main

          # Önceki mesaj/aktivite regresyonları korunuyor.
          assert "if(gelenIstek)continue;" in main
          assert "if(!ngelxAktiviteBildirimiGosterilir(v))return false;" in main
          assert "Future<void> ngelxKullaniciSemasiniTamamla(User user)" in main

          print('Build 368 static checks OK')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz ve test
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi
          if [ -d test ]; then flutter test; else echo "Test klasoru yok."; fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.147-Build-368-BADGES
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
