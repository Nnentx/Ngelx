name: NgelX Build543 community permission diagnosis (read only)
on:
  push:
    branches: [qa/ngelx-build543-community-floating-20261020]
    paths: ['.github/workflows/NgelX-DIAG543-COMMUNITY-READONLY.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check google-auth requests
      - name: Inspect deployed rule markers only
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 tools/diagnose_build463_production_rules.py
