name: Ngel X v48 BUILD 333 STABILITY LIVE CAMERA

on:
  workflow_dispatch:
  push:
    branches:
      - work/build333-stability-live-camera
    paths:
      - '.github/workflows/NgelX-v48-BUILD-333-STABILITY-LIVE-CAMERA.yml'
      - 'app/lib/main.dart'
      - 'app/lib/camera_studio.dart'
      - 'app/lib/live_broadcast_studio.dart'
      - 'app/lib/live_feed_card.dart'
      - 'app/lib/story_v66.dart'
      - 'app/lib/group_quality.dart'
      - 'app/pubspec.yaml'
      - 'app/android/app/src/main/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build333-stability-live-camera
          fetch-depth: 0

      - name: Build 333 surum ve regresyon sozlesmesi
        shell: bash
        run: |
          set -euo pipefail
          grep -F "version: 1.0.114+333" app/pubspec.yaml
          grep -F "defaultValue: '1.0.114'" app/lib/main.dart
          grep -F "defaultValue: '333'" app/lib/main.dart
          grep -F "part 'live_feed_card.dart';" app/lib/main.dart

          # Build 332'de düzeltilen çalışan medya omurgası korunmalı.
          grep -F "https://media.ngelxsocial.com" app/lib/main.dart
          grep -F "upload-r2-332" app/lib/main.dart
          grep -F "introVideoUrl" app/lib/main.dart
          grep -F "expiresAt" app/lib/main.dart
          grep -F "groupPhotoUrl" app/lib/main.dart

          # Kamera araçları ve doğal ön kamera işleme katmanı silinmemeli.
          grep -F "otomatikPortre=true" app/lib/camera_studio.dart
          grep -F "_filtrePaneli" app/lib/camera_studio.dart
          grep -F "_retusPaneli" app/lib/camera_studio.dart
          grep -F "Icons.grid_3x3_rounded" app/lib/camera_studio.dart
          grep -F "Icons.timer_outlined" app/lib/camera_studio.dart

          # Canlı paylaşım bildirimi, trend ve Akış entegrasyonu bağlı kalmalı.
          grep -F "olayTuru:'live_share'" app/lib/live_broadcast_studio.dart
          grep -F "tur:'live'" app/lib/live_broadcast_studio.dart
          grep -F "NgelXAkisCanliKarti" app/lib/main.dart
          grep -F "_canliSliverleri(trend:true)" app/lib/main.dart
          grep -F "Canlı yayın sona erdi" app/lib/main.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.114-Build-333-STABILITY-LIVE-CAMERA
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14
