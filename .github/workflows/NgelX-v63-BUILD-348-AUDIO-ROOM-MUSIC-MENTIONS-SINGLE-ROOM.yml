name: Ngel X v63 BUILD 348 AUDIO ROOM MUSIC MENTIONS SINGLE ROOM

on:
  workflow_dispatch:
  push:
    branches:
      - work/build348-audio-mentions-edit-single-room
    paths:
      - '.github/workflows/NgelX-v63-BUILD-348-AUDIO-ROOM-MUSIC-MENTIONS-SINGLE-ROOM.yml'
      - 'app/lib/main.dart'
      - 'app/pubspec.yaml'
      - 'app/lib/audio_live_rooms.dart'
      - 'app/lib/audio_live_rooms_pro.dart'
      - 'app/lib/audio_live_rooms_extras.dart'
      - 'firestore.rules'

permissions:
  contents: read

concurrency:
  group: ngelx-build348-audio-room-music-mentions-single-room
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build348-audio-mentions-edit-single-room
          fetch-depth: 0

      - name: Build 348 kaynaklarini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          grep -F "version: 1.0.129+348" app/pubspec.yaml
          grep -F "defaultValue: '1.0.129'" app/lib/main.dart
          grep -F "defaultValue: '348'" app/lib/main.dart

          grep -F "ngelxSesliSahibinAktifOdaBelgesi" app/lib/audio_live_rooms.dart
          grep -F "audio_room_owner_locks" app/lib/audio_live_rooms.dart
          grep -F "Zaten açık bir sesli odan var" app/lib/audio_live_rooms.dart
          grep -F "WidgetsBindingObserver" app/lib/audio_live_rooms.dart
          grep -F "didChangeAppLifecycleState" app/lib/audio_live_rooms.dart
          grep -F "NgelxSesliMuzikKontrolu" app/lib/audio_live_rooms.dart
          grep -F "CircleAvatar(radius:8" app/lib/audio_live_rooms.dart

          grep -F "class NgelxSesliMuzikKontrolu" app/lib/audio_live_rooms_pro.dart
          grep -F "kind:'music'" app/lib/audio_live_rooms_pro.dart
          grep -F "musicStartedAt" app/lib/audio_live_rooms_pro.dart
          grep -F "audio_room_mention" app/lib/audio_live_rooms_pro.dart
          grep -F "Mesajı düzenle" app/lib/audio_live_rooms_pro.dart
          grep -F "editedAt" app/lib/audio_live_rooms_pro.dart
          grep -F "onTap:()=>_mesajIslem" app/lib/audio_live_rooms_pro.dart

          grep -F "match /audio_room_owner_locks/{uid}" firestore.rules
          grep -F "'musicUrl', 'musicTitle', 'musicPlaying'" firestore.rules
          grep -F "hasOnly(['text', 'editedAt'])" firestore.rules

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sabit NgelX imza anahtarini geri yukle
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: ngelx-stable-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Flutter analiz
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter clean
          flutter pub get
          flutter analyze --machine > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q '^ERROR|' analyze.log; then
            echo "Flutter analyze ERROR buldu."
            exit 1
          fi

      - name: APK olustur ve imzayi dogrula
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee build/app/outputs/flutter-apk/apksigner-certs.txt
          grep -qi 'be20b27f0ba1f4decd2941d410b1536de89e48dc894f04f038f9d26b11ecd6aa' build/app/outputs/flutter-apk/apksigner-certs.txt
          sha256sum "$APK" > "$APK.sha256"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-1.0.129-Build-348-AUDIO-ROOM-MUSIC-MENTIONS-SINGLE-ROOM
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/apksigner-certs.txt
          if-no-files-found: error
          retention-days: 14

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/build348-audio-mentions-edit-single-room

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI kur
        run: npm install --global firebase-tools

      - name: Build 348 Firestore kurallarini yayinla
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          PROJECT_ID="ngelx-44eed"
          SA="${FIREBASE_SERVICE_ACCOUNT_NGELX_44EED:-${FIREBASE_SERVICE_ACCOUNT:-${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}}}"

          if [ -n "$SA" ]; then
            if printf '%s' "$SA" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$SA" > /tmp/ngelx-firebase-sa.json
            else
              printf '%s' "$SA" | base64 --decode > /tmp/ngelx-firebase-sa.json
              jq -e . /tmp/ngelx-firebase-sa.json >/dev/null
            fi
            chmod 600 /tmp/ngelx-firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/ngelx-firebase-sa.json
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            firebase deploy --only firestore:rules --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Firebase deploy kimligi ayarli degil."
            exit 20
          fi
