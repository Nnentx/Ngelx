name: Publish verified NgelX Build571 in-app updater
on:
  push:
    branches: [feat/build568-ludo-modes]
    paths: ['.github/workflows/NgelX-PUBLISH571-UPDATE.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nnentx/Ngelx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact successful Build571 before publishing
        run: |
          set -euo pipefail
          gh run watch 40231403363 --repo Nnentx/Ngelx --exit-status --interval 20
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40231403363 --jq .conclusion)" = success
          test "$(gh api repos/Nnentx/Ngelx/actions/runs/40231403363 --jq .head_sha)" = b2c2ffac4b6f286994bb567553a7c09507a750ab
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build571-Review-APK
          run-id: 40231403363
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Validate the exact tested APK and prepare updater metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          files=list(Path('verified-apk').rglob('*.apk'));assert len(files)==1
          raw=files[0].read_bytes();sha=hashlib.sha256(raw).hexdigest()
          assert 40_000_000<len(raw)<100_000_000
          with __import__('zipfile').ZipFile(files[0]) as z:
              assert z.testzip() is None and 'assets/flutter_assets/AssetManifest.bin' in z.namelist()
          name='NgelX-1.0.341-Build571.apk';Path(name).write_bytes(raw)
          Path(name+'.sha256').write_text(sha+'  '+name+'\n')
          feed={'schema':1,'package':'com.nnentx.ngelx_app','abi':'arm64-v8a','version':'1.0.341','build':571,'size':len(raw),'sha256':sha,'url':'https://github.com/Nnentx/Ngelx/releases/download/v1.0.341-build571-test/'+name,'notes':'Klasik ve Power Ludo, izleyici sayacı, 2/4 oyuncu, 3 başlangıç zar hakkı, sesli odaya katılma sesi, performans iyileştirmeleri ve özel/grup sohbeti + menüsünden Ludo daveti.','testedSource':'b2c2ffac4b6f286994bb567553a7c09507a750ab','buildRun':40231403363}
          Path('android-update.json').write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n')
          Path('notes.md').write_text('NgelX 1.0.341 / Build571 TEST.\\n\\nKlasik ve Power Ludo, izleyici sayacı, 2/4 oyuncu, 3 zar başlangıç hakkı, sesli odaya katılma sesi, sohbet performansı ve özel/grup sohbetinde Ludo daveti.\\n\\nCI testleri, APK imzası ve önceki görseller doğrulandı; gerçek cihaz oyun ve ses kontrolleri ayrıca gereklidir.\\n')
          PY
      - name: Preserve tested source using the existing trusted release workflow tree
        run: |
          gh api repos/Nnentx/Ngelx/git/trees/main > main-tree.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          trusted=next(e['sha'] for e in json.load(open('main-tree.json'))['tree'] if e['path']=='.github')
          tree={'base_tree':'b2c2ffac4b6f286994bb567553a7c09507a750ab','tree':[{'path':'.github','mode':'040000','type':'tree','sha':trusted},{'path':'RELEASE571_MANIFEST.json','mode':'100644','type':'blob','content':Path('android-update.json').read_text()}]}
          Path('tree.json').write_text(json.dumps(tree))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/trees --input tree.json > tree-result.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('commit.json').write_text(json.dumps({'message':'Build571 tested source snapshot for updater release','tree':json.load(open('tree-result.json'))['sha'],'parents':['b2c2ffac4b6f286994bb567553a7c09507a750ab']}))
          PY
          gh api --method POST repos/Nnentx/Ngelx/git/commits --input commit.json > commit-result.json
      - name: Publish APK and verify the public download bytes
        run: |
          if gh release view v1.0.341-build571-test >/dev/null 2>&1; then
            gh release download v1.0.341-build571-test --pattern NgelX-1.0.341-Build571.apk --dir existing
            cmp NgelX-1.0.341-Build571.apk existing/NgelX-1.0.341-Build571.apk
          else
            target=$(python3 -c "import json;print(json.load(open('commit-result.json'))['sha'])")
            gh release create v1.0.341-build571-test NgelX-1.0.341-Build571.apk NgelX-1.0.341-Build571.apk.sha256 android-update.json --target "$target" --prerelease --title 'NgelX 1.0.341 / Build571 test' --notes-file notes.md
            gh release download v1.0.341-build571-test --pattern NgelX-1.0.341-Build571.apk --dir existing
            cmp NgelX-1.0.341-Build571.apk existing/NgelX-1.0.341-Build571.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NgelX-Build571-Published-Update-Manifest
          path: android-update.json

  live-feed:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NgelX-Build571-Published-Update-Manifest
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Publish only new update feed; keep active website unchanged
        env:
          FIREBASE_SERVICE_ACCOUNT_NGELX_44EED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED }}
        run: python3 tools/hosting_update_feed571.py
