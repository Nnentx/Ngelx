name: NgelX Build534 Explicit Self-Rejoin QA (no deploy)
on:
  push:
    branches:
      - qa/ngelx-build534-explicit-group-rejoin-20261019
  pull_request:
    branches:
      - qa/ngelx-build533-group-terminal-state-guard-20261019
    paths:
      - 'firestore.rules'
      - 'app/lib/build534_explicit_group_rejoin.dart'
      - 'tools/build534_explicit_rejoin_rules_test.mjs'
      - 'tools/apply_build534_explicit_rejoin.py'
      - 'tools/test_build534_explicit_rejoin.py'
      - '.github/workflows/NgelX-BUILD534-EXPLICIT-REJOIN-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-rejoin-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Consent helper source contracts and LiveKit token policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_build534_explicit_rejoin.py
          python3 tools/test_build533_concurrent_helpers.py
          python3 tools/test_build530_group_exit_guard.py
          node --check tools/build534_explicit_rejoin_rules_test.mjs
          node --test server/livekit443/room-policy.test.mjs server/livekit441/token-endpoint.test.mjs
      - name: Install offline-demo Firebase emulator dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools
      - name: Build534 consent rejoin plus group call regressions in local Firestore
        shell: bash
        run: |
          set -euo pipefail
          npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build534_explicit_rejoin_rules_test.mjs && node tools/build533_group_terminal_rules_test.mjs && node tools/build532_group_room_rules_test.mjs && node tools/build531_group_exit_rules_test.mjs && node tools/build517_group_leave_rules_test.mjs && node tools/build526_atomic_group_timeout_rules_test.mjs && node tools/build527_group_join_rules_test.mjs && node tools/build528_group_timeout_age_rules_test.mjs"
      - name: Production isolation notice
        run: echo 'QA ONLY no deployment, no signing/production APK, no main merge; Flutter UI call-site and RTC connection rollback still need integration.'
