name: NgelX TEMP inspect live class

on:
  push:
    branches:
      - work/build322-polish-bugfix
    paths:
      - '.github/workflows/ngelx-temp-inspect-live.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print live launch call sites
        shell: python
        run: |
          from pathlib import Path
          text=Path('app/lib/main.dart').read_text(encoding='utf-8')
          needles=['class CanliYayinPage','CanliYayinPage(','live_streams','setCameraEnabled(true)']
          for needle in needles:
              print(f'--- NEEDLE {needle} ---')
              start=0
              count=0
              while True:
                  i=text.find(needle,start)
                  if i<0 or count>=20:
                      break
                  a=max(0,i-2200)
                  b=min(len(text),i+4200)
                  print(f'@@ OCCURRENCE {count+1} INDEX {i} @@')
                  print(text[a:b])
                  start=i+len(needle)
                  count+=1
