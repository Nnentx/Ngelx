name: NgelX TEMP inspect live class

on:
  push:
    branches:
      - work/build322-polish-bugfix
    paths:
      - '.github/workflows/ngelx-temp-inspect-live.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print camera API usages
        shell: python
        run: |
          from pathlib import Path
          text=Path('app/lib/main.dart').read_text(encoding='utf-8')
          for needle in ['switchCamera','CameraPosition','VideoCaptureOptions','LocalVideoTrack','setCameraEnabled(','cameraCapturer']:
              print(f'--- NEEDLE {needle} ---')
              start=0;count=0
              while True:
                  i=text.find(needle,start)
                  if i<0 or count>=30: break
                  print(f'@@ {i} @@')
                  print(text[max(0,i-1200):min(len(text),i+2200)])
                  start=i+len(needle);count+=1
