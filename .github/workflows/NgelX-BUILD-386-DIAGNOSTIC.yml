name: NgelX BUILD 386 DIAGNOSTIC

on:
  push:
    branches:
      - work/build-386-open-issues
    paths:
      - '.github/workflows/NgelX-BUILD-386-DIAGNOSTIC.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted Build 386 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/lib')
          targets=[
            'Hikâyeyi sil','İçerik istatistikleri','Beğeni','Paylaşım','Gönderi',
            'Hesabı ekle ve geç','Sohbet arka planı','backgroundUrl_','quickEmoji_',
            'messageFontSize_','Takipçi kaldırıldı.','Takipçi kaldırılsın mı?'
          ]
          for target in targets:
              print(f'@@LOCATE {target!r}')
              for p in sorted(root.glob('*.dart')):
                  lines=p.read_text(encoding='utf-8').splitlines()
                  hits=[(i+1,l) for i,l in enumerate(lines) if target in l]
                  for n,l in hits[:30]:
                      print(f'{p}:{n:06d}: {l}')
          main=(root/'main.dart').read_text(encoding='utf-8').splitlines()
          ranges=[
            ('SOCIAL_REQUEST_CORE',2960,3190),
            ('ACTIVITY_PAGE',21770,22530),
            ('OTHER_PROFILE',22780,23430),
            ('ACCOUNT_SWITCH',23820,24060),
            ('PRIVATE_CHAT_CUSTOMIZE',17440,17630),
            ('PRIVATE_CHAT_BODY',20480,21320),
            ('PROFILE_ARCHIVE_AREA',25480,25730),
          ]
          for name,a,b in ranges:
              print(f'@@SECTION {name} {a}-{b}')
              for n in range(a-1,min(b,len(main))):
                  print(f'{n+1:06d}: {main[n]}')
          PY
