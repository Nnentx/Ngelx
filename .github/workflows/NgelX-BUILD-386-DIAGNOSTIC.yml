name: NgelX BUILD 386 DIAGNOSTIC
on:
  push:
    branches: [work/build-386-open-issues]
    paths: ['.github/workflows/NgelX-BUILD-386-DIAGNOSTIC.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('app/lib/main.dart').read_text(encoding='utf-8').splitlines()
          needles=['mesajDegisti','yaziyorBaslatZamanlayici','yaziyorZamanlayici','PrivateDraftStore.save','class OzelSohbet','class _OzelSohbet','KullaniciListesiPage','_profilSayac(context']
          for needle in needles:
              print('@@NEEDLE '+needle)
              for i,l in enumerate(lines):
                  if needle in l:
                      print(f'@@HIT {i+1}')
                      for n in range(max(0,i-30),min(len(lines),i+55)):
                          print(f'{n+1:06d}: {lines[n]}')
          PY
