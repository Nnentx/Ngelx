name: NgelX BUILD 386 DIAGNOSTIC

on:
  push:
    branches:
      - work/build-386-open-issues
    paths:
      - '.github/workflows/NgelX-BUILD-386-DIAGNOSTIC.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted Build 386 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('app/lib/main.dart').read_text(encoding='utf-8').splitlines()
          pats=[
            r'sosyalIstekGonder',
            r'sosyalIstek',
            r'follow_request',
            r'Takip İstek',
            r'Takip istek',
            r'takip istek',
            r'Activity|Aktivite',
            r'_yerelTakipciDelta',
            r'Takipçi kaldır',
            r'followers',
            r'class .*Profil',
            r'İçerik istatistikleri',
            r'Etkileşim',
            r'class .*Etk',
            r'Hikâyeyi sil',
            r'Hikaye',
            r'Hikâye',
            r'Öne Çıkan',
            r'arşiv',
            r'Arşiv',
            r'Hesabı ekle ve geç',
            r'Hesap değiştir',
            r'class .*Hesap',
            r'chat.*background|background.*chat',
            r'sohbet.*arka|arka.*sohbet',
            r'conversation',
            r'custom.*background|background.*custom',
            r'TextField\(',
            r'TextFormField\(',
          ]
          for pat in pats:
              rx=re.compile(pat,re.I)
              hits=[(i+1,l) for i,l in enumerate(lines) if rx.search(l)]
              print(f'@@PATTERN {pat} COUNT={len(hits)}')
              for n,l in hits[:120]:
                  print(f'{n:06d}: {l}')
          PY
