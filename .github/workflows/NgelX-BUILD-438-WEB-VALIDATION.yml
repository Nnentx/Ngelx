name: NgelX BUILD 438 WEB ACCOUNT VALIDATION
on:
  workflow_dispatch:
  push:
    branches: [work/build-438-phone-qa]
    paths: ['.github/workflows/NgelX-BUILD-438-WEB-VALIDATION.yml']
permissions:
  contents: read
jobs:
  social-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Parse account page modules
        run: |
          node --check web/account-actions.mjs
          node --check web/account-pages.mjs
          node --check web/account-bootstrap.mjs
      - name: Read active rule source only
        env:
          NGELX_SERVICE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGELX_44EED || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          pip install google-auth requests
          python3 tools/read_build438_deployed_rules.py
      - name: Install emulator test dependencies
        run: npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing firebase-tools playwright
      - name: Test active rules using fake emulator accounts
        run: npx firebase emulators:exec --project demo-ngelx --only firestore --non-interactive "node tools/build438_web_account_test.mjs"
      - name: Install browser for local form tests
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop forms using fake SDK modules
        run: node tools/build438_web_ui_test.mjs
