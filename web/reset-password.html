<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>NgelX • Şifreni yenile</title>
  <style>
    :root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--cyan:#19c7df;--blue:#1687ff;--violet:#7a49f5;--danger:#b42318}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}
    .shell{max-width:560px;margin:auto;padding:38px 22px 70px}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 34px;font-size:28px;font-weight:900}
    .brand img{width:72px;height:72px;object-fit:contain}
    .card{border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 48px #1118270d}
    h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}
    p{color:var(--muted);line-height:1.6}
    label{display:block;font-size:13px;font-weight:800;margin:22px 0 8px}
    .field{display:flex;align-items:center;border:1px solid var(--line);background:#f6f7f9;border-radius:18px;padding:0 14px}
    input{flex:1;border:0;outline:0;background:transparent;padding:16px 0;font-size:17px;color:var(--ink)}
    button{border:0;cursor:pointer;font-weight:850}
    .eye{background:transparent;font-size:20px;padding:8px}
    .primary{width:100%;margin-top:18px;padding:16px;border-radius:18px;color:#fff;font-size:17px;background:linear-gradient(105deg,var(--cyan),var(--blue),var(--violet))}
    .primary:disabled{opacity:.55;cursor:wait}
    .status{margin-top:18px;padding:14px 16px;border-radius:16px;background:#f5f3ff;color:#4c3d84;font-weight:700;display:none}
    .status.error{display:block;background:#fff1f1;color:var(--danger)}
    .status.ok{display:block;background:#ecfdf3;color:#167447}
    .small{text-align:center;font-size:13px;margin-top:18px}
    a{color:#5c46c7;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/Nnentx/Ngelx/main/app/assets/ngelx_logo.png" alt="NgelX">
      <span>NgelX</span>
    </div>
    <section class="card">
      <h1>Şifreni yenile</h1>
      <p id="intro">Yeni şifreni belirle. İşlem tamamlandığında NgelX’e yeni şifrenle giriş yapabilirsin.</p>
      <form id="form">
        <label for="password">Yeni şifre</label>
        <div class="field">
          <input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="En az 8 karakter" required>
          <button class="eye" id="toggle" type="button" aria-label="Şifreyi göster">👁</button>
        </div>
        <label for="again">Yeni şifreyi tekrar yaz</label>
        <div class="field">
          <input id="again" type="password" minlength="8" autocomplete="new-password" placeholder="Şifreyi tekrar yaz" required>
        </div>
        <button class="primary" id="save" type="submit">Şifreyi kaydet</button>
      </form>
      <div id="status" class="status" role="status"></div>
      <p class="small"><a href="/">NgelX ana sayfasına dön</a></p>
    </section>
  </main>

  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {getAuth, verifyPasswordResetCode, confirmPasswordReset} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const app=initializeApp({
      apiKey:"AIzaSyAUH9L6aihwx2tzwpGXupYg4J6wBRiQ_sw",
      authDomain:"ngelx-44eed.firebaseapp.com",
      projectId:"ngelx-44eed",
      storageBucket:"ngelx-44eed.firebasestorage.app",
      messagingSenderId:"1006140921207",
    });
    const auth=getAuth(app);
    auth.languageCode="tr";

    const params=new URLSearchParams(location.search);
    const mode=params.get("mode")||"";
    const code=params.get("oobCode")||"";
    const form=document.querySelector("#form");
    const password=document.querySelector("#password");
    const again=document.querySelector("#again");
    const status=document.querySelector("#status");
    const save=document.querySelector("#save");
    const intro=document.querySelector("#intro");

    function show(message,type){
      status.textContent=message;
      status.className="status "+type;
    }

    document.querySelector("#toggle").addEventListener("click",()=>{
      password.type=password.type==="password"?"text":"password";
    });

    async function validate(){
      if(mode!=="resetPassword"||!code){
        form.hidden=true;
        show("Şifre yenileme bağlantısı geçersiz veya eksik.","error");
        return;
      }
      try{
        const email=await verifyPasswordResetCode(auth,code);
        intro.textContent=email+" hesabın için yeni şifreni belirle.";
      }catch(_){
        form.hidden=true;
        show("Bu şifre yenileme bağlantısının süresi dolmuş veya bağlantı daha önce kullanılmış.","error");
      }
    }

    form.addEventListener("submit",async(e)=>{
      e.preventDefault();
      const a=password.value,b=again.value;
      if(a.length<8){show("Şifre en az 8 karakter olmalı.","error");return;}
      if(a!==b){show("Yazdığın şifreler birbiriyle aynı değil.","error");return;}
      save.disabled=true;
      save.textContent="Kaydediliyor…";
      try{
        await confirmPasswordReset(auth,code,a);
        form.hidden=true;
        show("Şifren değiştirildi. Artık NgelX’e yeni şifrenle giriş yapabilirsin.","ok");
      }catch(_){
        show("Şifre değiştirilemedi. Yeni bir şifre yenileme bağlantısı iste.","error");
        save.disabled=false;
        save.textContent="Şifreyi kaydet";
      }
    });

    validate();
  </script>
</body>
</html>
