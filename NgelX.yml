      - name: APK olustur
        run: |
          cd ngelx_app
          flutter pub get
          flutter build apk --debug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NgelX-APK-v6
          path: ngelx_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
