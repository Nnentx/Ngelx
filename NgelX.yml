name: NgelX APK v6 Gercek Begeni Yorum

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Uygulamayi hazirla
        run: |
          rm -rf ngelx_app
          flutter create --platforms=android --org com.nnentx ngelx_app
          cd ngelx_app
          cp ../google-services.json android/app/google-services.json
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore
          flutter pub add video_player
          flutter pub add image_picker
          sed -i '/id("com.android.application")/i\\    id("com.google.gms.google-services") version "4.4.4" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\\    id("com.google.gms.google-services")' android/app/build.gradle.kts

          sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              android/app/src/main/AndroidManifest.xml

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            runApp(const NgelXApp());
          }

          const mor = Color(0xFF8B5CF6);
          const mavi = Color(0xFF22D3EE);
          const panel = Color(0xFF17171F);

          class NgelXApp extends StatelessWidget {
            const NgelXApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'NgelX',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF08080D),
                  colorScheme: const ColorScheme.dark(
                    primary: mor,
                    secondary: mavi,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: panel,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(18),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: FirebaseAuth.instance.currentUser == null
                    ? const GirisPage()
                    : const AnaEkran(),
              );
            }
          }

          class GirisPage extends StatefulWidget {
            const GirisPage({super.key});

            @override
            State<GirisPage> createState() => _GirisPageState();
          }

          class _GirisPageState extends State<GirisPage> {
            final email = TextEditingController();
            final sifre = TextEditingController();
            bool gizli = true;

            bool yukleniyor = false;

            Future<void> girisYap() async {
              if (!email.text.contains('@') || sifre.text.length < 6) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Geçerli e-posta ve en az 6 karakterli şifre gir.')),
                );
                return;
              }
              setState(() => yukleniyor = true);
              try {
                await FirebaseAuth.instance.signInWithEmailAndPassword(
                  email: email.text.trim(),
                  password: sifre.text,
                );
                if (!mounted) return;
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (_) => const AnaEkran()),
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;
                final mesaj = e.code == 'invalid-credential'
                    ? 'E-posta veya şifre yanlış.'
                    : 'Giriş yapılamadı: ${e.message ?? e.code}';
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(mesaj)));
              } finally {
                if (mounted) setState(() => yukleniyor = false);
              }
            }

            Future<void> misafirGirisi() async {
              setState(() => yukleniyor = true);
              try {
                await FirebaseAuth.instance.signInAnonymously();
                if (!mounted) return;
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (_) => const AnaEkran()),
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Misafir girişi başarısız: ${e.message ?? e.code}')),
                );
              } finally {
                if (mounted) setState(() => yukleniyor = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        const SizedBox(height: 45),
                        const Logo(),
                        const SizedBox(height: 55),
                        const Text(
                          'Tekrar hoş geldin',
                          style: TextStyle(
                            fontSize: 31,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          'İzle, keşfet ve kendi dünyanı paylaş.',
                          style: TextStyle(color: Colors.white60),
                        ),
                        const SizedBox(height: 32),
                        TextField(
                          controller: email,
                          keyboardType: TextInputType.emailAddress,
                          decoration: const InputDecoration(
                            prefixIcon: Icon(Icons.alternate_email),
                            hintText: 'E-posta adresi',
                          ),
                        ),
                        const SizedBox(height: 14),
                        TextField(
                          controller: sifre,
                          obscureText: gizli,
                          decoration: InputDecoration(
                            prefixIcon: const Icon(Icons.lock_outline),
                            hintText: 'Şifre',
                            suffixIcon: IconButton(
                              onPressed: () {
                                setState(() => gizli = !gizli);
                              },
                              icon: Icon(
                                gizli
                                    ? Icons.visibility_off_outlined
                                    : Icons.visibility_outlined,
                              ),
                            ),
                          ),
                        ),
                        Align(
                          alignment: Alignment.centerRight,
                          child: TextButton(
                            onPressed: () {},
                            child: const Text('Şifremi unuttum'),
                          ),
                        ),
                        RenkliButon(
                          yazi: yukleniyor ? 'Bağlanıyor...' : 'Giriş Yap',
                          tiklama: yukleniyor ? () {} : girisYap,
                        ),
                        const SizedBox(height: 18),
                        OutlinedButton.icon(
                          onPressed: yukleniyor ? null : misafirGirisi,
                          icon: const Icon(Icons.person_outline),
                          label: const Text('Misafir olarak keşfet'),
                          style: OutlinedButton.styleFrom(
                            minimumSize: const Size.fromHeight(54),
                          ),
                        ),
                        const SizedBox(height: 22),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text(
                              'Hesabın yok mu?',
                              style: TextStyle(color: Colors.white60),
                            ),
                            TextButton(
                              onPressed: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => const KayitPage(),
                                  ),
                                );
                              },
                              child: const Text('Hesap oluştur'),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class KayitPage extends StatefulWidget {
            const KayitPage({super.key});

            @override
            State<KayitPage> createState() => _KayitPageState();
          }

          class _KayitPageState extends State<KayitPage> {
            final kullanici = TextEditingController();
            final email = TextEditingController();
            final sifre = TextEditingController();
            bool yukleniyor = false;

            Future<void> hesapOlustur() async {
              if (kullanici.text.trim().length < 3 ||
                  !email.text.contains('@') ||
                  sifre.text.length < 6) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Kullanıcı adı, geçerli e-posta ve en az 6 karakterli şifre gir.')),
                );
                return;
              }
              setState(() => yukleniyor = true);
              try {
                final sonuc = await FirebaseAuth.instance.createUserWithEmailAndPassword(
                  email: email.text.trim(),
                  password: sifre.text,
                );
                await sonuc.user!.updateDisplayName(kullanici.text.trim());
                await FirebaseFirestore.instance.collection('users').doc(sonuc.user!.uid).set({
                  'username': kullanici.text.trim(),
                  'email': email.text.trim(),
                  'bio': 'NgelX dünyasına yeni katıldı ✦',
                  'createdAt': FieldValue.serverTimestamp(),
                });
                if (!mounted) return;
                Navigator.pushAndRemoveUntil(
                  context,
                  MaterialPageRoute(builder: (_) => const AnaEkran()),
                  (_) => false,
                );
              } on FirebaseAuthException catch (e) {
                if (!mounted) return;
                final mesaj = e.code == 'email-already-in-use'
                    ? 'Bu e-posta zaten kullanılıyor.'
                    : 'Kayıt başarısız: ${e.message ?? e.code}';
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(mesaj)));
              } finally {
                if (mounted) setState(() => yukleniyor = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  title: const Text('Yeni hesap'),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Logo(),
                      const SizedBox(height: 35),
                      TextField(
                        controller: kullanici,
                        decoration: const InputDecoration(
                          prefixIcon: Icon(Icons.person_outline),
                          hintText: 'Kullanıcı adı',
                        ),
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller: email,
                        keyboardType: TextInputType.emailAddress,
                        decoration: const InputDecoration(
                          prefixIcon: Icon(Icons.alternate_email),
                          hintText: 'E-posta adresi',
                        ),
                      ),
                      const SizedBox(height: 14),
                      TextField(
                        controller: sifre,
                        obscureText: true,
                        decoration: const InputDecoration(
                          prefixIcon: Icon(Icons.lock_outline),
                          hintText: 'Şifre (en az 6 karakter)',
                        ),
                      ),
                      const SizedBox(height: 24),
                      RenkliButon(
                        yazi: yukleniyor ? 'Hesap oluşturuluyor...' : 'Hesap Oluştur',
                        tiklama: yukleniyor ? () {} : hesapOlustur,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AnaEkran extends StatefulWidget {
            const AnaEkran({super.key});

            @override
            State<AnaEkran> createState() => _AnaEkranState();
          }

          class _AnaEkranState extends State<AnaEkran> {
            int secili = 0;

            final sayfalar = const [
              VideoAkisi(),
              KesfetPage(),
              YuklePage(),
              MesajPage(),
              ProfilPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: secili,
                  children: sayfalar,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: secili,
                  backgroundColor: const Color(0xFF101016),
                  onDestinationSelected: (i) {
                    setState(() => secili = i);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Akış',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.explore_outlined),
                      selectedIcon: Icon(Icons.explore),
                      label: 'Keşfet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.add_box_outlined),
                      selectedIcon: Icon(Icons.add_box),
                      label: 'Üret',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.forum_outlined),
                      selectedIcon: Icon(Icons.forum),
                      label: 'Sohbet',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Ben',
                    ),
                  ],
                ),
              );
            }
          }

          class VideoAkisi extends StatefulWidget {
            const VideoAkisi({super.key});

            @override
            State<VideoAkisi> createState() => _VideoAkisiState();
          }

          class _VideoAkisiState extends State<VideoAkisi> {
            int aktif = 0;

            static const videolar = [
              'https://flutter.github.io/assets-for-api-docs/assets/videos/bee.mp4',
              'https://flutter.github.io/assets-for-api-docs/assets/videos/butterfly.mp4',
              'https://media.w3.org/2010/05/sintel/trailer.mp4',
            ];

            @override
            Widget build(BuildContext context) {
              return Stack(
                children: [
                  PageView.builder(
                    scrollDirection: Axis.vertical,
                    itemCount: videolar.length,
                    onPageChanged: (i) {
                      setState(() => aktif = i);
                    },
                    itemBuilder: (_, i) {
                      return VideoKarti(
                        adres: videolar[i],
                        aktif: aktif == i,
                        sira: i,
                      );
                    },
                  ),
                  const SafeArea(
                    child: Padding(
                      padding: EdgeInsets.all(17),
                      child: Row(
                        children: [
                          Logo(kucuk: true),
                          Spacer(),
                          Text(
                            'Takip',
                            style: TextStyle(color: Colors.white60),
                          ),
                          SizedBox(width: 17),
                          Text(
                            'Sana Özel',
                            style: TextStyle(fontWeight: FontWeight.bold),
                          ),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }
          }

          class VideoKarti extends StatefulWidget {
            final String adres;
            final bool aktif;
            final int sira;

            const VideoKarti({
              super.key,
              required this.adres,
              required this.aktif,
              required this.sira,
            });

            @override
            State<VideoKarti> createState() => _VideoKartiState();
          }

          class _VideoKartiState extends State<VideoKarti> {
            late final VideoPlayerController kontrol;
            bool hazir = false;
            bool begenildi = false;
            bool kaydedildi = false;
            int begeniSayisi = 0;
            int yorumSayisi = 0;

            String get videoId => 'ornek_${widget.sira + 1}';

            @override
            void initState() {
              super.initState();

              kontrol = VideoPlayerController.networkUrl(
                Uri.parse(widget.adres),
              );

              etkilesimleriGetir();

              kontrol.initialize().then((_) {
                kontrol.setLooping(true);

                if (widget.aktif) {
                  kontrol.play();
                }

                if (mounted) {
                  setState(() => hazir = true);
                }
              });
            }

            Future<void> etkilesimleriGetir() async {
              final kullanici = FirebaseAuth.instance.currentUser;
              if (kullanici == null) return;
              final video = FirebaseFirestore.instance.collection('videos').doc(videoId);
              final sonuclar = await Future.wait([
                video.collection('likes').doc(kullanici.uid).get(),
                video.collection('likes').count().get(),
                video.collection('comments').count().get(),
              ]);
              if (!mounted) return;
              setState(() {
                begenildi = (sonuclar[0] as DocumentSnapshot).exists;
                begeniSayisi = (sonuclar[1] as AggregateQuerySnapshot).count ?? 0;
                yorumSayisi = (sonuclar[2] as AggregateQuerySnapshot).count ?? 0;
              });
            }

            Future<void> begeniyiDegistir() async {
              final kullanici = FirebaseAuth.instance.currentUser;
              if (kullanici == null) return;
              final video = FirebaseFirestore.instance.collection('videos').doc(videoId);
              final begeni = video.collection('likes').doc(kullanici.uid);
              final yeniDurum = !begenildi;
              setState(() {
                begenildi = yeniDurum;
                begeniSayisi += yeniDurum ? 1 : -1;
                if (begeniSayisi < 0) begeniSayisi = 0;
              });
              if (yeniDurum) {
                await begeni.set({
                  'userId': kullanici.uid,
                  'createdAt': FieldValue.serverTimestamp(),
                });
              } else {
                await begeni.delete();
              }
            }

            @override
            void didUpdateWidget(covariant VideoKarti oldWidget) {
              super.didUpdateWidget(oldWidget);

              if (!hazir) return;

              if (widget.aktif) {
                kontrol.play();
              } else {
                kontrol.pause();
              }
            }

            @override
            void dispose() {
              kontrol.dispose();
              super.dispose();
            }

            void yorumlariAc() {
              showModalBottomSheet(
                context: context,
                backgroundColor: panel,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(
                    top: Radius.circular(25),
                  ),
                ),
                builder: (_) => Yorumlar(videoId: videoId),
              ).whenComplete(etkilesimleriGetir);
            }

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTap: () {
                  if (!hazir) return;

                  setState(() {
                    if (kontrol.value.isPlaying) {
                      kontrol.pause();
                    } else {
                      kontrol.play();
                    }
                  });
                },
                onDoubleTap: () {
                  if (!begenildi) begeniyiDegistir();
                },
                child: Stack(
                  fit: StackFit.expand,
                  children: [
                    Container(color: Colors.black),
                    if (hazir)
                      FittedBox(
                        fit: BoxFit.cover,
                        child: SizedBox(
                          width: kontrol.value.size.width,
                          height: kontrol.value.size.height,
                          child: VideoPlayer(kontrol),
                        ),
                      )
                    else
                      const Center(
                        child: CircularProgressIndicator(color: mavi),
                      ),
                    const DecoratedBox(
                      decoration: BoxDecoration(
                        gradient: LinearGradient(
                          begin: Alignment.topCenter,
                          end: Alignment.bottomCenter,
                          colors: [
                            Colors.black54,
                            Colors.transparent,
                            Colors.black87,
                          ],
                        ),
                      ),
                    ),
                    Positioned(
                      left: 18,
                      right: 85,
                      bottom: 25,
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '@ngelx_${widget.sira + 1}',
                            style: const TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Anı yakala, kendi hikâyeni paylaş ✨',
                          ),
                          const SizedBox(height: 8),
                          const Row(
                            children: [
                              Icon(Icons.graphic_eq, size: 17),
                              SizedBox(width: 6),
                              Text('NgelX • Özgün ses'),
                            ],
                          ),
                        ],
                      ),
                    ),
                    Positioned(
                      right: 14,
                      bottom: 20,
                      child: Column(
                        children: [
                          const CircleAvatar(
                            radius: 25,
                            backgroundColor: Colors.white,
                            child: CircleAvatar(
                              radius: 22,
                              backgroundColor: panel,
                              child: Text(
                                'N',
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),
                          ),
                          IslemButonu(
                            ikon: begenildi
                                ? Icons.favorite
                                : Icons.favorite_border,
                            yazi: '$begeniSayisi',
                            renk: begenildi
                                ? Colors.pinkAccent
                                : Colors.white,
                            tiklama: begeniyiDegistir,
                          ),
                          IslemButonu(
                            ikon: Icons.mode_comment_outlined,
                            yazi: '$yorumSayisi',
                            tiklama: yorumlariAc,
                          ),
                          IslemButonu(
                            ikon: kaydedildi
                                ? Icons.bookmark
                                : Icons.bookmark_border,
                            yazi: 'Kaydet',
                            renk: kaydedildi ? mavi : Colors.white,
                            tiklama: () {
                              setState(() {
                                kaydedildi = !kaydedildi;
                              });
                            },
                          ),
                          IslemButonu(
                            ikon: Icons.send_outlined,
                            yazi: 'Paylaş',
                            tiklama: () {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(
                                  content: Text(
                                    'Paylaşım seçenekleri hazırlanıyor.',
                                  ),
                                ),
                              );
                            },
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class IslemButonu extends StatelessWidget {
            final IconData ikon;
            final String yazi;
            final VoidCallback tiklama;
            final Color renk;

            const IslemButonu({
              super.key,
              required this.ikon,
              required this.yazi,
              required this.tiklama,
              this.renk = Colors.white,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: tiklama,
                child: Padding(
                  padding: const EdgeInsets.only(top: 16),
                  child: Column(
                    children: [
                      Icon(ikon, size: 33, color: renk),
                      const SizedBox(height: 3),
                      Text(
                        yazi,
                        style: const TextStyle(
                          fontSize: 10,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class Yorumlar extends StatefulWidget {
            final String videoId;

            const Yorumlar({super.key, required this.videoId});

            @override
            State<Yorumlar> createState() => _YorumlarState();
          }

          class _YorumlarState extends State<Yorumlar> {
            final yorum = TextEditingController();
            bool gonderiliyor = false;

            CollectionReference<Map<String, dynamic>> get yorumlar =>
                FirebaseFirestore.instance
                    .collection('videos')
                    .doc(widget.videoId)
                    .collection('comments');

            Future<void> yorumGonder() async {
              final metin = yorum.text.trim();
              final kullanici = FirebaseAuth.instance.currentUser;
              if (metin.isEmpty || kullanici == null || gonderiliyor) return;
              setState(() => gonderiliyor = true);
              try {
                final profil = await FirebaseFirestore.instance
                    .collection('users')
                    .doc(kullanici.uid)
                    .get();
                final veri = profil.data() ?? {};
                final kullaniciAdi = (veri['username'] ?? kullanici.displayName ?? 'ngelx').toString();
                await yorumlar.add({
                  'userId': kullanici.uid,
                  'username': kullaniciAdi,
                  'text': metin,
                  'createdAt': FieldValue.serverTimestamp(),
                });
                yorum.clear();
              } finally {
                if (mounted) setState(() => gonderiliyor = false);
              }
            }

            @override
            void dispose() {
              yorum.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: SizedBox(
                  height: 430,
                  child: Column(
                    children: [
                      const Padding(
                        padding: EdgeInsets.all(16),
                        child: Text(
                          'Yorumlar',
                          style: TextStyle(
                            fontSize: 19,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                      Expanded(
                        child: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                          stream: yorumlar.orderBy('createdAt', descending: true).snapshots(),
                          builder: (context, snapshot) {
                            if (snapshot.connectionState == ConnectionState.waiting) {
                              return const Center(child: CircularProgressIndicator());
                            }
                            final belgeler = snapshot.data?.docs ?? [];
                            if (belgeler.isEmpty) {
                              return const Center(child: Text('İlk yorumu sen yaz.'));
                            }
                            return ListView.builder(
                              itemCount: belgeler.length,
                              itemBuilder: (_, i) {
                                final veri = belgeler[i].data();
                                final ad = (veri['username'] ?? 'ngelx').toString();
                                final metin = (veri['text'] ?? '').toString();
