          class ProfilPage extends StatefulWidget {
            const ProfilPage({super.key});

            @override
            State<ProfilPage> createState() => _ProfilPageState();
          }

          class _ProfilPageState extends State<ProfilPage> {
            String ad = 'NgelX Kullanıcısı';
            String kullanici = '@ngelx';
            String bio = 'NgelX dünyasına hoş geldin ✦';
            bool yukleniyor = true;

            User? get aktifKullanici => FirebaseAuth.instance.currentUser;

            @override
            void initState() {
              super.initState();
              profiliGetir();
            }

            Future<void> profiliGetir() async {
              final user = aktifKullanici;
              if (user == null) return;

              try {
                final belge = await FirebaseFirestore.instance
                    .collection('users')
                    .doc(user.uid)
                    .get();

                final veri = belge.data();

                if (veri != null && mounted) {
                  final hamKullanici = (veri['username'] ?? 'ngelx').toString();

                  setState(() {
                    ad = hamKullanici.isEmpty
                        ? (user.displayName ?? 'NgelX Kullanıcısı')
                        : hamKullanici;
                    kullanici = '@${hamKullanici.isEmpty ? 'ngelx' : hamKullanici}';
                    bio = (veri['bio'] ?? 'NgelX dünyasına hoş geldin ✦').toString();
                    yukleniyor = false;
                  });
                } else if (mounted) {
                  setState(() {
                    ad = user.isAnonymous
                        ? 'NgelX Misafir'
                        : (user.displayName ?? 'NgelX Kullanıcısı');
                    kullanici = user.isAnonymous ? '@misafir' : '@ngelx';
                    yukleniyor = false;
                  });
                }
              } catch (_) {
                if (mounted) setState(() => yukleniyor = false);
              }
            }

            Future<void> duzenle() async {
              final user = aktifKullanici;

              if (user == null || user.isAnonymous) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Profili kaydetmek için normal hesap oluşturmalısın.'),
                  ),
                );
                return;
              }

              final adKontrol = TextEditingController(text: ad);
              final kullaniciKontrol = TextEditingController(
                text: kullanici.replaceFirst('@', ''),
              );
              final bioKontrol = TextEditingController(text: bio);

              await showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: panel,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(26)),
                ),
                builder: (ctx) {
                  bool kaydediliyor = false;

                  return StatefulBuilder(
                    builder: (ctx, pencereState) {
                      return Padding(
                        padding: EdgeInsets.fromLTRB(
                          20,
                          25,
                          20,
                          MediaQuery.of(ctx).viewInsets.bottom + 25,
                        ),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            const Text(
                              'Profilini düzenle',
                              style: TextStyle(
                                fontSize: 23,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 20),
                            TextField(
                              controller: adKontrol,
                              decoration: const InputDecoration(
                                labelText: 'Görünen ad',
                              ),
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: kullaniciKontrol,
                              decoration: const InputDecoration(
                                prefixText: '@',
                                labelText: 'Kullanıcı adı',
                              ),
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: bioKontrol,
                              maxLength: 80,
                              decoration: const InputDecoration(
                                labelText: 'Biyografi',
                              ),
                            ),
                            const SizedBox(height: 12),
                            RenkliButon(
                              yazi: kaydediliyor ? 'Kaydediliyor...' : 'Kaydet',
                              tiklama: () async {
                                if (kaydediliyor) return;

                                final yeniAd = adKontrol.text.trim();
                                final yeniKullanici = kullaniciKontrol.text
                                    .trim()
                                    .replaceAll(' ', '');

                                if (yeniAd.length < 2 || yeniKullanici.length < 3) {
                                  ScaffoldMessenger.of(ctx).showSnackBar(
                                    const SnackBar(
                                      content: Text('Geçerli ad ve kullanıcı adı gir.'),
                                    ),
                                  );
                                  return;
                                }

                                pencereState(() => kaydediliyor = true);

                                await FirebaseFirestore.instance
                                    .collection('users')
                                    .doc(user.uid)
                                    .set({
                                  'displayName': yeniAd,
                                  'username': yeniKullanici,
                                  'bio': bioKontrol.text.trim(),
                                  'email': user.email,
                                  'updatedAt': FieldValue.serverTimestamp(),
                                }, SetOptions(merge: true));

                                await user.updateDisplayName(yeniAd);

                                if (!mounted || !ctx.mounted) return;

                                setState(() {
                                  ad = yeniAd;
                                  kullanici = '@$yeniKullanici';
                                  bio = bioKontrol.text.trim();
                                });

                                Navigator.pop(ctx);
                                ScaffoldMessenger.of(context).showSnackBar(
                                  const SnackBar(content: Text('Profil Firebase’e kaydedildi.')),
                                );
                              },
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> cikisYap() async {
              final onay = await showDialog<bool>(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('Çıkış yapılsın mı?'),
                  content: const Text('Tekrar giriş yapman gerekecek.'),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx, false),
                      child: const Text('Vazgeç'),
                    ),
                    FilledButton(
                      onPressed: () => Navigator.pop(ctx, true),
                      child: const Text('Çıkış Yap'),
                    ),
                  ],
                ),
              );

              if (onay != true || !mounted) return;

              await FirebaseAuth.instance.signOut();

              if (!mounted) return;

              Navigator.of(context).pushAndRemoveUntil(
                MaterialPageRoute(builder: (_) => const GirisPage()),
                (_) => false,
              );
            }

            @override
            Widget build(BuildContext context) {
              if (yukleniyor) {
                return const Center(
                  child: CircularProgressIndicator(color: mavi),
                );
              }

              return SafeArea(
                child: CustomScrollView(
                  slivers: [
                    SliverToBoxAdapter(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Column(
                          children: [
                            Row(
                              children: [
                                const Logo(kucuk: true),
                                const Spacer(),
                                IconButton(
                                  tooltip: 'Çıkış yap',
                                  onPressed: cikisYap,
                                  icon: const Icon(Icons.logout_rounded),
                                ),
                              ],
                            ),
                            const SizedBox(height: 25),
                            Container(
                              width: 105,
                              height: 105,
                              padding: const EdgeInsets.all(4),
                              decoration: const BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: LinearGradient(colors: [mavi, mor]),
                              ),
                              child: CircleAvatar(
                                backgroundColor: const Color(0xFF24222E),
                                child: Text(
                                  ad.isEmpty ? 'N' : ad[0].toUpperCase(),
                                  style: const TextStyle(
                                    fontSize: 45,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ),
                            ),
                            const SizedBox(height: 14),
                            Text(
                              ad,
                              style: const TextStyle(
                                fontSize: 23,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            Text(
                              kullanici,
                              style: const TextStyle(color: Colors.white54),
                            ),
                            const SizedBox(height: 13),
                            Text(bio),
                            const SizedBox(height: 23),
                            const Row(
                              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                              children: [
                                Istatistik('0', 'Takip'),
                                Istatistik('0', 'Takipçi'),
                                Istatistik('0', 'Etkileşim'),
                              ],
                            ),
                            const SizedBox(height: 23),
                            RenkliButon(
                              yazi: aktifKullanici?.isAnonymous == true
                                  ? 'Hesap Oluştur'
                                  : 'Profili Düzenle',
                              tiklama: aktifKullanici?.isAnonymous == true
                                  ? () async {
                                      await FirebaseAuth.instance.signOut();
                                      if (!context.mounted) return;
                                      Navigator.of(context).pushAndRemoveUntil(
                                        MaterialPageRoute(builder: (_) => const KayitPage()),
                                        (_) => false,
                                      );
                                    }
                                  : duzenle,
                            ),
                            const SizedBox(height: 25),
                            const Row(
                              mainAxisAlignment: MainAxisAlignment.spaceAround,
                              children: [
                                Icon(Icons.grid_view),
                                Icon(Icons.bookmark_border, color: Colors.white38),
                                Icon(Icons.favorite_border, color: Colors.white38),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    SliverPadding(
                      padding: const EdgeInsets.all(5),
                      sliver: SliverGrid(
                        delegate: SliverChildBuilderDelegate(
                          (_, i) => Container(
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(12),
                              color: i.isEven
                                  ? const Color(0xFF28233F)
                                  : const Color(0xFF173036),
                            ),
                            child: const Icon(
                              Icons.play_arrow,
                              color: Colors.white30,
                            ),
                          ),
                          childCount: 9,
                        ),
                        gridDelegate:
                            const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 3,
                          childAspectRatio: 0.72,
                          crossAxisSpacing: 5,
                          mainAxisSpacing: 5,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

